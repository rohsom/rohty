<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>유씨네 집들이</title>
<meta name="description" content="튜브와 도리아가 안내하는 우리 집 구경 · 숨은 선물 찾기">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Gaegu:wght@700&display=swap">
<style>
/* Layout: one-screen app — header / first-person 3D house / dog dock; gift cards rise as bottom sheets.
   Look: the house itself at night — greige walls, black-film kitchen, brass downlight accent. */
:root {
  color-scheme: dark;
  --night: #161514;
  --panel: #211f1d;
  --rule: #3a3633;
  --tile: #e6e1da;
  --brass: #c9a46c;
  --brass-dim: #8c7350;
  --text: #f1ede6;
  --muted: #a69f95;
  --ok: #8fb59a;
  --font-display: "Hahmlet", "Nanum Myeongjo", serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-dog: "Gaegu", "IBM Plex Sans KR", cursive;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--night); color: var(--text);
  font: 15px/1.55 var(--font-body);
  overflow: hidden; -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-rows: auto 1fr auto; padding-inline: 16px; padding-top: env(safe-area-inset-top, 0px); }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px 10px; }
.brand { min-width: 0; }
.brand h1 { margin: 0; font: 700 21px/1.2 var(--font-display); letter-spacing: -0.01em; text-wrap: balance; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }
.count { flex: none; display: flex; align-items: center; gap: 7px; padding: 7px 12px; border: 1px solid var(--rule); border-radius: 999px; font-variant-numeric: tabular-nums; font-size: 13px; background: none; cursor: pointer; }
.count svg { width: 16px; height: 16px; }
.count b { color: var(--brass); font-weight: 600; }

/* 3D stage */
.stage { position: relative; min-height: 0; border-radius: 18px; overflow: hidden; background: #2a2724; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
.stage canvas:active { cursor: grabbing; }
.chip {
  position: absolute; z-index: 2; top: 10px; display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 12px; border-radius: 999px; font-size: 13px;
  background: rgba(22,21,20,.72); border: 1px solid rgba(255,255,255,.12); backdrop-filter: blur(6px);
}
.chip.room { left: 10px; font: 700 14px var(--font-display); }
.chip.rooms { right: 10px; cursor: pointer; }
.chip svg { width: 14px; height: 14px; }
.howto {
  position: absolute; z-index: 2; left: 50%; bottom: 14px; transform: translateX(-50%);
  max-width: calc(100% - 24px); padding: 8px 14px; border-radius: 14px; font-size: 12.5px; text-align: center;
  background: rgba(22,21,20,.72); border: 1px solid rgba(255,255,255,.12); backdrop-filter: blur(6px);
  transition: opacity .6s;
}
.howto.fade { opacity: 0; pointer-events: none; }
.fallback { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); }

/* dock */
.dock { display: flex; align-items: flex-end; gap: 10px; padding-block: 10px calc(14px + env(safe-area-inset-bottom, 0px)); }
.avatar { flex: none; width: 46px; height: 46px; border-radius: 50%; background: var(--panel); border: 1px solid var(--rule); display: grid; place-items: center; cursor: pointer; padding: 0; }
.avatar svg { width: 38px; height: 38px; }
.bubble { position: relative; flex: 1; min-width: 0; background: var(--tile); color: #26221f; border-radius: 16px 16px 16px 4px; padding: 9px 13px; font: 700 16.5px/1.3 var(--font-dog); min-height: 46px; display: flex; align-items: center; }
.bubble small { display: block; font: 600 11px var(--font-body); color: #7a7168; margin-bottom: 1px; }

/* sheets */
.scrim { position: fixed; inset: 0; background: rgba(8,8,7,.55); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 10; }
.scrim.on { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; max-height: 86%; overflow-y: auto;
  background: var(--panel); border-top: 1px solid var(--rule); border-radius: 22px 22px 0 0;
  padding: 10px 20px calc(22px + env(safe-area-inset-bottom, 0px));
  transform: translateY(105%); transition: transform .32s cubic-bezier(.2,.8,.2,1);
  max-width: 560px; margin: 0 auto;
}
.sheet.on { transform: none; }
.grip { width: 38px; height: 4px; border-radius: 4px; background: var(--rule); margin: 0 auto 14px; }
.eyebrow { font-size: 11.5px; letter-spacing: .08em; color: var(--brass); font-weight: 600; }
.gift-hero { display: flex; gap: 14px; align-items: center; margin-top: 6px; }
.gift-emoji { flex: none; width: 64px; height: 64px; border-radius: 18px; background: var(--night); border: 1px solid var(--rule); display: grid; place-items: center; font-size: 34px; }
.gift-hero h2 { margin: 0; font: 700 21px/1.25 var(--font-display); text-wrap: balance; }
.price { color: var(--muted); font-size: 13.5px; margin-top: 3px; font-variant-numeric: tabular-nums; }
.note { margin: 16px 0 0; padding: 12px 14px; background: var(--night); border-radius: 12px; font: 700 17px/1.35 var(--font-dog); color: var(--tile); }
.note small { display: block; font: 500 11.5px var(--font-body); color: var(--muted); margin-top: 4px; }
.link { display: inline-block; margin-top: 12px; color: var(--brass); font-size: 13.5px; }
.actions { display: grid; gap: 8px; margin-top: 18px; }
.btn { height: 50px; border-radius: 14px; border: 0; font-weight: 600; font-size: 15.5px; cursor: pointer; }
.btn-primary { background: var(--brass); color: #1b1a19; }
.btn-ghost { background: none; border: 1px solid var(--rule); color: var(--text); }
.btn[disabled] { opacity: .55; cursor: default; }
.status { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--rule); font-size: 14px; }
.status .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.status.mine { border-color: var(--brass-dim); }
.status.mine .dot { background: var(--brass); }
.confirm-q { font-size: 14.5px; margin: 0 0 2px; }
.err { color: #e4a08f; font-size: 13px; margin-top: 8px; }

.nb-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.nb-head h2 { margin: 0; font: 700 20px var(--font-display); }
.nb-head span { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.nb-list { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 1px; background: var(--rule); border-radius: 14px; overflow: hidden; }
.nb-list li { background: var(--panel); }
.nb-item { width: 100%; display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; padding: 11px 12px; background: none; border: 0; text-align: left; cursor: pointer; }
.nb-item .em { font-size: 24px; text-align: center; }
.nb-item .t { min-width: 0; }
.nb-item .t b { display: block; font-weight: 600; font-size: 14.5px; }
.nb-item .t span { color: var(--muted); font-size: 12.5px; }
.nb-item .st { font-size: 12px; color: var(--muted); text-align: right; white-space: nowrap; }
.nb-item .st.claimed { color: var(--ok); }
.nb-item .st.mine { color: var(--brass); }
.nb-item.locked { cursor: default; }
.nb-item.locked .em { opacity: .4; filter: grayscale(1); }
.nb-item.locked b { color: var(--muted); letter-spacing: .1em; }
.demo-note { margin-top: 14px; font-size: 12px; color: var(--muted); }
.room-grid { list-style: none; margin: 14px 0 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.room-btn { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--rule); background: var(--night); text-align: left; cursor: pointer; }
.room-btn b { display: block; font-weight: 600; }
.room-btn span { font-size: 12px; color: var(--muted); }
.room-btn.here { border-color: var(--brass-dim); }

/* intro */
.intro {
  position: fixed; inset: 0; z-index: 20; background: var(--night);
  display: grid; place-items: center; padding: calc(24px + env(safe-area-inset-top, 0px)) 16px calc(24px + env(safe-area-inset-bottom, 0px));
  overflow-y: auto; transition: opacity .5s .5s, visibility 0s 1s;
}
.intro.gone { opacity: 0; visibility: hidden; }
.intro-inner { width: 100%; max-width: 360px; display: grid; gap: 22px; justify-items: center; text-align: center; }
.intro .kicker { font-size: 12px; letter-spacing: .14em; color: var(--brass); font-weight: 600; }
.intro h1 { margin: 6px 0 0; font: 700 34px/1.15 var(--font-display); text-wrap: balance; }
.intro p { margin: 10px 0 0; color: var(--muted); font-size: 14px; }
.door-frame { width: 150px; height: 232px; border-radius: 4px; background: #e9e5df; padding: 9px 9px 0; perspective: 600px; box-shadow: 0 0 0 1px var(--rule), 0 30px 60px -30px rgba(201,164,108,.45); position: relative; }
.door-frame::before { content: ""; position: absolute; inset: 9px 9px 0; background: radial-gradient(ellipse at 50% 20%, #fff7e6 0%, #e9dfcf 45%, #c9bfb0 100%); }
.door { position: relative; height: 100%; background: #5a3b2e; transform-origin: left center; transition: transform 1s cubic-bezier(.5,0,.2,1); box-shadow: inset -2px 0 0 rgba(0,0,0,.25); }
.door .lock { position: absolute; right: 12px; top: 46%; width: 13px; height: 34px; border-radius: 3px; background: #1d1d1d; box-shadow: inset 0 0 0 1px #444; }
.door .lock::after { content: ""; position: absolute; left: 4px; top: 6px; width: 5px; height: 5px; border-radius: 50%; background: #6fc3ff; opacity: .8; }
.door .handle { position: absolute; right: 6px; top: 58%; width: 22px; height: 4px; border-radius: 2px; background: #b9b4ad; }
.door .plate { position: absolute; left: 50%; top: 18px; transform: translateX(-50%); font: 700 11px var(--font-display); color: #d8c3a5; letter-spacing: .06em; white-space: nowrap; }
.door .banner { position: absolute; left: 50%; top: 52px; transform: translateX(-50%); width: 30px; }
.door .banner i { display: block; width: 18px; height: 12px; margin: 0 auto; border: 1px solid #c8b493; border-bottom: 0; border-right: 0; transform: rotate(45deg) translate(5px, 5px); }
.door .banner span { display: grid; place-items: center; width: 30px; height: 40px; background: #f2eee6; border-top: 2px solid #b48d5c; color: #c98a8a; font-size: 13px; }
.door.open { transform: rotateY(-78deg); }
.enter { width: 100%; display: grid; gap: 10px; }
.enter label { font-size: 13px; color: var(--muted); text-align: left; }
.enter input { height: 50px; border-radius: 14px; border: 1px solid var(--rule); background: var(--panel); color: var(--text); padding: 0 16px; font-size: 16px; }
.enter input::placeholder { color: #6f685f; }

.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 30; overflow: hidden; }
.confetti i { position: absolute; top: -12px; width: 7px; height: 12px; border-radius: 1px; animation: fall var(--t, 1.6s) cubic-bezier(.25,.6,.4,1) forwards; }
@keyframes fall { to { transform: translate(var(--x, 0), 105vh) rotate(var(--r, 540deg)); opacity: .9; } }

@media (prefers-reduced-motion: reduce) {
  .door, .sheet, .intro { transition-duration: .01s; }
  .confetti { display: none; }
}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand">
      <h1 id="siteTitle">유씨네 집들이</h1>
      <p>반짝이는 곳을 찾아보세요</p>
    </div>
    <button class="count" id="countBtn" aria-label="선물 수첩 열기">
      <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="6" width="12" height="8" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M1.5 6h13M8 6v8M8 6C6 2 3.5 3 5 5.2 6 6 8 6 8 6zm0 0c2-4 4.5-3 3-0.8C10 6 8 6 8 6z" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
      <span>선물 수첩 <b id="foundN">0</b>/<span id="totalN">0</span></span>
    </button>
  </header>

  <main class="stage" id="stage">
    <div class="chip room" id="roomChip">현관</div>
    <button class="chip rooms" id="roomsBtn">
      <svg viewBox="0 0 14 14" aria-hidden="true"><rect x="1.5" y="1.5" width="11" height="11" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M1.5 7h5V1.5M6.5 7v5.5M6.5 9.5h6" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
      방 이동
    </button>
    <div class="howto" id="howto">화면을 끌어서 둘러보고, 바닥의 동그라미를 누르면 걸어가요</div>
  </main>

  <footer class="dock">
    <button class="avatar" id="avatarBtn" aria-label="강아지에게 힌트 듣기">
      <svg viewBox="-12 -14 24 26" aria-hidden="true" id="avatarSvg"></svg>
    </button>
    <div class="bubble" id="bubble" aria-live="polite"></div>
  </footer>
</div>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="giftSheet" role="dialog" aria-modal="true" aria-labelledby="giftName"></section>
<section class="sheet" id="nbSheet" role="dialog" aria-modal="true" aria-label="선물 수첩"></section>
<section class="sheet" id="roomSheet" role="dialog" aria-modal="true" aria-label="방 이동"></section>

<div class="intro" id="intro">
  <div class="intro-inner">
    <div>
      <div class="kicker">HOUSEWARMING</div>
      <h1 id="introTitle">유씨네 집들이</h1>
      <p id="introSub"></p>
    </div>
    <div class="door-frame" aria-hidden="true">
      <div class="door" id="door">
        <div class="plate" id="doorPlate">유 · 튜브 · 도리아</div>
        <div class="banner"><i></i><span>♡</span></div>
        <div class="lock"></div><div class="handle"></div>
      </div>
    </div>
    <form class="enter" id="enterForm" autocomplete="off">
      <label for="guestName">방문하신 분 이름</label>
      <input id="guestName" name="guestName" maxlength="20" placeholder="예: 김민지" required>
      <button class="btn btn-primary" type="submit">문 열고 들어가기</button>
    </form>
  </div>
</div>

<div class="confetti" id="confetti"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ================================================================
   1) 사이트 설정
   ================================================================ */
const SITE = {
  title: '유씨네 집들이',
  intro: '튜브와 도리아가 집 구경을 시켜드릴게요.<br>구경하다 반짝이는 걸 찾으면, 그게 저희 집에 필요한 거예요.',
  doorPlate: '유 · 튜브 · 도리아',
  projector: '어서 오세요!',
};

/* ================================================================
   2) Firebase 설정 — 비워두면 '체험 모드'(이 기기에만 저장)
   ================================================================ */
const FIREBASE_CONFIG = null;

/* ================================================================
   3) 선물 목록 (지금은 예시)
      at: [평면도 x, 바닥에서 높이(m), 평면도 y]
   ================================================================ */
const GIFTS = [
  { id: 'shoerack',  room: 'entry',   at: [236, 0.35, 446], emoji: '👟', name: '현관 슈즈 벤치',      price: '5~10만원',  note: '카펫 위에 신발이 굴러다녀요. 앉아서 신발 신을 자리도 필요해요.', hint: '현관 카펫 위, 현관문 바로 앞을 봐주세요. 제가 신발 물어가는 데요' },
  { id: 'guestbed',  room: 'bed1',    at: [24, 0.6, 486],   emoji: '🛌', name: '손님용 침구 세트',     price: '8~15만원',  note: '놀러 와서 자고 가실 분들을 위한 포근한 이불이 필요해요.', hint: '현관 옆 손님방, 창가 데이베드를 봐주세요! 자고 가도 돼요' },
  { id: 'soundbar',  room: 'living',  at: [66, 0.35, 384],  emoji: '🔊', name: '블루투스 사운드바',    price: '10~20만원', note: '빔프로젝터로 영화 보는데 소리가 너무 작아요.',          hint: '거실 빔 화면 아래가 수상해요. 멍!' },
  { id: 'sofa',      room: 'living',  at: [67, 0.75, 334],  emoji: '🛋️', name: '거실 소파 (함께 보태기)', price: '여럿이 조금씩', note: '소파가 생기면 빈백 존을 싹 정리할 거예요. 몇 분이 같이 보태주셔도 좋아요!', hint: '거실 빈백 사이… 여기에 소파가 오면 좋겠대요' },
  { id: 'coffee',    room: 'kitchen', at: [330, 1.1, 300],  emoji: '☕', name: '캡슐 커피머신',        price: '15~25만원', note: '주방 창가 쪽 가전 코너에 커피머신 자리를 비워뒀어요.',  hint: '주방 창문 끝, 작은 가전들 옆에 빈자리가 있어요!' },
  { id: 'glasses',   room: 'kitchen', at: [262, 1.05, 268], emoji: '🍷', name: '와인잔 세트',          price: '5~10만원',  note: '아일랜드 식탁에서 집들이 건배하고 싶어요.',            hint: '주방 까만 대리석 아일랜드 위를 잘 보세요' },
  { id: 'dryrack',   room: 'utility', at: [280, 0.7, 380],  emoji: '🧺', name: '빨래 바구니 & 건조대', price: '3~6만원',   note: '튜브·도리아 담요 빨래가 매일 한가득이에요.',            hint: '주방 옆 다용도실… 제 담요가 거기서 빨래돼요' },
  { id: 'bathmat',   room: 'bath1',   at: [182, 1.05, 342], emoji: '🧼', name: '욕실 매트 & 디스펜서', price: '3~6만원',   note: '블랙 마블 세면대에 어울리는 디스펜서 세트가 갖고 싶어요.', hint: '거실 욕실 까만 세면대 위가 수상해요' },
  { id: 'fountain',  room: 'small',   at: [62, 0.4, 100],   emoji: '🐾', name: '강아지 자동 정수기',   price: '4~7만원',   note: '튜브와 도리아가 물을 더 많이 마셨으면 해서요.',        hint: '작업실 창가, 하얀 동그란 울타리 안에 뭐가 있게요?' },
  { id: 'monitorarm',room: 'small',   at: [70, 1.15, 188],  emoji: '🖥️', name: '듀얼 모니터암',        price: '5~10만원',  note: '작업실 책상 두 개 위가 선으로 정신없어요.',             hint: '작업실 창가 쪽 컴퓨터 책상 위를 봐주세요' },

const $ = (s) => document.querySelector(s);
function ls(key, val) {
  try {
    if (val === undefined) return JSON.parse(localStorage.getItem(key));
    localStorage.setItem(key, JSON.stringify(val));
  } catch (e) { return null; }
}

const state = {
  guest: ls('hw_guest') || null,
  guestId: ls('hw_gid') || (Math.random().toString(36).slice(2) + Date.now().toString(36)),
  found: new Set(ls('hw_found') || []),
  claims: {},
  node: 'e1',
  room: 'entry',
};
ls('hw_gid', state.guestId);

/* ---------- 저장소: 체험 모드(localStorage) / 실서비스(Firebase) ---------- */
const Store = {
  mode: 'demo', uid: state.guestId, listeners: [],
  onChange(fn) { this.listeners.push(fn); },
  emit() { this.listeners.forEach(fn => fn(state.claims)); },
  async init() {
    if (FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey) {
      try { await this.initLive(); return; } catch (e) { console.warn('Firebase 연결 실패, 체험 모드로 전환', e); }
    }
    this.initDemo();
  },
  initDemo() {
    this.mode = 'demo';
    let c = ls('hw_claims');
    if (!c) { c = { glasses: { name: '민지 (예시)', uid: 'example', at: Date.now() } }; ls('hw_claims', c); }
    state.claims = c;
    window.addEventListener('storage', (e) => { if (e.key === 'hw_claims') { state.claims = ls('hw_claims') || {}; this.emit(); } });
    this.emit();
  },
  async initLive() {
    const base = 'https://www.gstatic.com/firebasejs/10.12.2/';
    const [appMod, fs, authMod] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-firestore.js'), import(base + 'firebase-auth.js')]);
    const app = appMod.initializeApp(FIREBASE_CONFIG);
    const db = fs.getFirestore(app);
    const cred = await authMod.signInAnonymously(authMod.getAuth(app));
    this.uid = cred.user.uid; this.mode = 'live';
    fs.onSnapshot(fs.collection(db, 'claims'), (snap) => { const c = {}; snap.forEach(d => { c[d.id] = d.data(); }); state.claims = c; this.emit(); });
    this.claim = (gid, name) => fs.runTransaction(db, async (tx) => {
      const ref = fs.doc(db, 'claims', gid); const s = await tx.get(ref);
      if (s.exists()) throw new Error('taken');
      tx.set(ref, { name, uid: this.uid, at: fs.serverTimestamp() });
    });
    this.unclaim = (gid) => fs.deleteDoc(fs.doc(db, 'claims', gid));
  },
  async claim(gid, name) {
    const c = ls('hw_claims') || {}; if (c[gid]) throw new Error('taken');
    c[gid] = { name, uid: this.uid, at: Date.now() }; ls('hw_claims', c); state.claims = c; this.emit();
  },
  async unclaim(gid) { const c = ls('hw_claims') || {}; delete c[gid]; ls('hw_claims', c); state.claims = c; this.emit(); },
};
const isMine = (c) => c && c.uid === Store.uid;

/* ================================================================
   3D 집 만들기 (평면도 좌표 1 = 4cm, 천장 2.4m)
   ================================================================ */
const S = 0.04, H = 2.4, EYE = 1.5;
const W = (v) => v * S;
const THREEOK = typeof THREE !== 'undefined';
let scene, camera, renderer, raycaster, clock;
const anims = [];
const giftObjs = {};
const ringObjs = {};
let yaw = Math.PI / 2, pitch = -0.06;

function canvasTex(w, h, draw, repeat) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c);
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
  t.anisotropy = 4;
  return t;
}

let gradMap, lineMat;
const matCache = {};
function toon(color, opt = {}) {
  const plain = !Object.keys(opt).length;
  if (plain && matCache[color]) return matCache[color];
  const m = new THREE.MeshToonMaterial(Object.assign({ color, gradientMap: gradMap }, opt));
  if (plain) matCache[color] = m;
  return m;
}
const basic = (color, opt = {}) => new THREE.MeshBasicMaterial(Object.assign({ color }, opt));

function outline(m, thr = 30) {
  const e = new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry, thr), lineMat);
  e.userData.skip = true; m.add(e);
}
function add(geo, mat, x, y, z, o = {}) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  if (o.ry) m.rotation.y = o.ry;
  if (o.edges !== false) outline(m);
  if (o.data) Object.assign(m.userData, o.data);
  (o.parent || scene).add(m);
  return m;
}
function box(x0, z0, x1, z1, y0, y1, mat, o) {
  return add(new THREE.BoxGeometry(W(Math.abs(x1 - x0)), y1 - y0, W(Math.abs(z1 - z0))), mat, W((x0 + x1) / 2), (y0 + y1) / 2, W((z0 + z1) / 2), o);
}
function cyl(x, z, r, y0, y1, mat, o = {}) {
  return add(new THREE.CylinderGeometry(W(o.rt ?? r), W(r), y1 - y0, o.seg || 28), mat, W(x), (y0 + y1) / 2, W(z), o);
}
function blob(x, z, rx, ry, rz, y, mat, o = {}) {
  const m = add(new THREE.SphereGeometry(1, 28, 18), mat, W(x), y, W(z), Object.assign({ edges: false }, o));
  m.scale.set(W(rx), ry, W(rz)); return m;
}
/* a picture on a wall; face = direction the picture looks toward (n, s, e, w) */
function panel(cx, cz, w, y0, y1, face, mat, o = {}) {
  const ry = { s: 0, n: Math.PI, e: Math.PI / 2, w: -Math.PI / 2 }[face];
  return add(new THREE.PlaneGeometry(W(w), y1 - y0), mat, W(cx), (y0 + y1) / 2, W(cz), Object.assign({ ry, edges: false }, o));
}
function floorPlane(x0, z0, x1, z1, y, mat, o = {}) {
  const m = add(new THREE.PlaneGeometry(W(x1 - x0), W(z1 - z0)), mat, W((x0 + x1) / 2), y, W((z0 + z1) / 2), Object.assign({ edges: false }, o));
  m.rotation.x = -Math.PI / 2; return m;
}

/* axis-aligned wall with openings [{a, b, y0, y1, glass, face, mullions, both}] measured along the wall */
function wall(x0, z0, x1, z1, mat, openings = [], t = 3) {
  const horiz = z0 === z1;
  const a0 = horiz ? Math.min(x0, x1) : Math.min(z0, z1);
  const a1 = horiz ? Math.max(x0, x1) : Math.max(z0, z1);
  const f = horiz ? z0 : x0;
  const seg = (s0, s1, y0, y1, m = mat) => {
    if (s1 - s0 <= 0 || y1 - y0 <= 0) return;
    if (horiz) box(s0, f - t / 2, s1, f + t / 2, y0, y1, m, { data: { wall: true } });
    else box(f - t / 2, s0, f + t / 2, s1, y0, y1, m, { data: { wall: true } });
  };
  let cur = a0;
  openings.sort((p, q) => p.a - q.a).forEach(op => {
    seg(cur, op.a, 0, H);
    const y0 = op.y0 || 0, y1 = op.y1 ?? 2.1;
    seg(op.a, op.b, 0, y0);
    seg(op.a, op.b, y1, H);
    if (op.glass) {
      const frame = toon('#e7e0d2'), w = op.b - op.a, mid = (op.a + op.b) / 2, n = op.mullions || 1;
      if (y0 > 0) seg(op.a, op.b, y0, y0 + 0.05, frame);
      const g = horiz ? panel(mid, f, w, y0 + 0.05, y1, op.face || 's', op.glass, { data: { glass: true } })
                      : panel(f, mid, w, y0 + 0.05, y1, op.face || 'e', op.glass, { data: { glass: true } });
      if (op.both) { const g2 = g.clone(); g2.rotation.y += Math.PI; g2.userData.glass = true; scene.add(g2); }
      for (let k = 0; k <= n; k++) { const c = op.a + k * w / n; seg(Math.max(op.a, c - 0.7), Math.min(op.b, c + 0.7), y0, y1, frame); }
    }
    cur = op.b;
  });
  seg(cur, a1, 0, H);
}

/* ---------- walking ---------- */
let tween = null;
function goTo(id, opts = {}) {
  const n = NODES[id]; if (!n) return;
  const from = camera.position.clone();
  const to = new THREE.Vector3(W(n.p[0]), EYE, W(n.p[1]));
  const dx = to.x - from.x, dz = to.z - from.z;
  const dist = Math.hypot(dx, dz);
  const lookYaw = n.look ? Math.atan2(-(W(n.look[0]) - to.x), -(W(n.look[1]) - to.z)) : null;
  const targetYaw = n.yaw ?? (opts.instant && lookYaw !== null ? lookYaw : dist > 0.3 ? Math.atan2(-dx, -dz) : yaw);
  let dy = targetYaw - yaw; dy = Math.atan2(Math.sin(dy), Math.cos(dy));
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  tween = { from, to, y0: yaw, dy, p0: pitch, t0: performance.now(), dur: reduce || opts.instant ? 1 : Math.min(1500, 450 + dist * 260) };
  state.node = id;
  updateRings();

}
function stepTween(now) {
  if (!tween) return;
  const k = Math.min(1, (now - tween.t0) / tween.dur);
  const e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
  camera.position.lerpVectors(tween.from, tween.to, e);
  camera.position.y = EYE + Math.sin(k * Math.PI) * 0.03;
  yaw = tween.y0 + tween.dy * e;
  pitch = tween.p0 + (-0.08 - tween.p0) * e;
  if (k >= 1) tween = null;
}

/* ---------- input ---------- */
function setupInput(canvas) {
  let down = null;
  canvas.addEventListener('pointerdown', (e) => { down = { x: e.clientX, y: e.clientY, lx: e.clientX, ly: e.clientY, drag: false }; try { canvas.setPointerCapture(e.pointerId); } catch (err) {} });
  canvas.addEventListener('pointermove', (e) => {
    if (!down) return;
    const dx = e.clientX - down.lx, dy = e.clientY - down.ly;
    if (Math.hypot(e.clientX - down.x, e.clientY - down.y) > 7) down.drag = true;
    if (down.drag) {
      yaw += dx * 0.0055; pitch = Math.max(-1.0, Math.min(0.75, pitch + dy * 0.0045));
      if (tween) { tween.y0 = yaw; tween.dy = 0; tween.p0 = pitch; }
      $('#howto').classList.add('fade');
    }
    down.lx = e.clientX; down.ly = e.clientY;
  });
  canvas.addEventListener('pointerup', (e) => { if (down && !down.drag) tap(e, canvas); down = null; });
  canvas.addEventListener('pointercancel', () => { down = null; });
  window.addEventListener('keydown', (e) => {
    if ($('#scrim').classList.contains('on') || !$('#intro').classList.contains('gone')) return;
    if (e.key === 'ArrowLeft') yaw += 0.12;
    if (e.key === 'ArrowRight') yaw -= 0.12;
    if (e.key === 'ArrowUp') { const n = bestNodeAhead(); if (n) goTo(n); }
  });
}
function bestNodeAhead() {
  const fx = -Math.sin(yaw), fz = -Math.cos(yaw);
  let best = null, score = 0.3;
  for (const id of NODES[state.node].n) {
    const p = NODES[id].p; let vx = W(p[0]) - camera.position.x, vz = W(p[1]) - camera.position.z; const l = Math.hypot(vx, vz) || 1;
    const d = (vx * fx + vz * fz) / l; if (d > score) { score = d; best = id; }
  }
  return best;
}
function tap(e, canvas) {
  const r = canvas.getBoundingClientRect();
  const v = new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(v, camera);
  const hits = raycaster.intersectObjects(scene.children, true)
    .filter(h => h.object.type === 'Mesh' && !h.object.userData.skip && !h.object.userData.glass && isShown(h.object));
  for (const h of hits) {
    const u = h.object.userData;
    if (u.node) { if (ringObjs[u.node].visible) { goTo(u.node); return; } continue; }
    if (u.gift) { if (h.distance < 7) onGift(u.gift); return; }
    if (u.dog) { giveHint(u.dog); return; }
    if (u.egg) { easterEgg(u.egg); return; }
    if (u.floor) {
      let best = null, bd = 1e9;
      for (const id of NODES[state.node].n) { const p = NODES[id].p; const d = Math.hypot(W(p[0]) - h.point.x, W(p[1]) - h.point.z); if (d < bd) { bd = d; best = id; } }
      if (best && bd < 2.6) goTo(best);
    }
    return;
  }
}
function isShown(o) { while (o) { if (o.visible === false) return false; o = o.parent; } return true; }

function start3D() {

  if (!THREEOK) { fail('3D 화면을 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.'); return; }
  try { renderer = new THREE.WebGLRenderer({ antialias: true }); }
  catch (e) { fail('이 브라우저에서는 3D 집 구경을 할 수 없어요. 최신 크롬이나 사파리로 열어주세요.'); return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  stage.prepend(renderer.domElement);
  scene = new THREE.Scene(); scene.background = new THREE.Color('#2a2724');
  camera = new THREE.PerspectiveCamera(72, 1, 0.05, 60);
  camera.rotation.order = 'YXZ';
  raycaster = new THREE.Raycaster(); raycaster.camera = camera;
  gradMap = new THREE.DataTexture(new Uint8Array([120, 175, 225]), 3, 1, THREE.LuminanceFormat);
  gradMap.minFilter = gradMap.magFilter = THREE.NearestFilter; gradMap.needsUpdate = true;
  lineMat = new THREE.LineBasicMaterial({ color: 0x3a332d, transparent: true, opacity: 0.5 });
  const T = makeTextures();
  buildHouse(T); buildDogs(); buildGiftsAndNodes(T);
  const n = NODES.e1; camera.position.set(W(n.p[0]), EYE, W(n.p[1])); yaw = n.yaw; pitch = -0.06;
  updateRings();
  setupInput(renderer.domElement);

  const resize = () => { const w = stage.clientWidth, h = stage.clientHeight; if (!w || !h) return; renderer.setSize(w, h, false); camera.aspect = w / h; camera.fov = w / h < 0.8 ? 80 : 66; camera.updateProjectionMatrix(); };
  new ResizeObserver(resize).observe(stage); resize();
  clock = new THREE.Clock();
  const loop = (now) => {
    const dt = Math.min(0.05, clock.getDelta()); const t = clock.elapsedTime;
    stepTween(now);
    camera.rotation.y = yaw; camera.rotation.x = pitch;
    anims.forEach(f => f(t, dt));
    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
  window.__hw = { goTo, setView: (y, p) => { yaw = y; pitch = p; } };
}

    busy = true; lastErr = ''; renderGift();
    try { await Store.claim(g.id, state.guest); confirming = false; burst(60); say(`${state.guest}님 고마워요! 꼬리 흔드는 중`, dogFor(g.room)); }
    catch (e) { lastErr = e.message === 'taken' ? '방금 다른 분이 먼저 찜했어요. 다른 선물을 골라주세요.' : '저장하지 못했어요. 인터넷 연결을 확인하고 다시 눌러주세요.'; confirming = false; }
    busy = false; renderGift();
  });
  on('unclaimBtn', async () => {
    busy = true; renderGift();
    try { await Store.unclaim(g.id); } catch (e) { lastErr = '취소하지 못했어요. 다시 눌러주세요.'; }
    busy = false; renderGift();
  });
  $('#giftSheet').querySelectorAll('[data-close]').forEach(b => b.onclick = closeSheets);
}

/* ---------- 선물 수첩 / 방 이동 ---------- */
function renderNotebook() {
  const claimedN = GIFTS.filter(g => state.claims[g.id]).length;
  const rows = GIFTS.map(g => {
    const found = state.found.has(g.id); const c = state.claims[g.id]; const room = ROOM_NAMES[g.room];
    if (!found) return `<li><div class="nb-item locked"><span class="em">${g.emoji}</span><span class="t"><b>???</b><span>${esc(room)} 어딘가</span></span><span class="st">못 찾음</span></div></li>`;
    const st = c ? (isMine(c) ? `<span class="st mine">내가 찜함</span>` : `<span class="st claimed">${esc(c.name)}</span>`) : `<span class="st">찜 가능</span>`;
    return `<li><button class="nb-item" data-gift="${g.id}"><span class="em">${g.emoji}</span><span class="t"><b>${esc(g.name)}</b><span>${esc(room)} · ${esc(g.price)}</span></span>${st}</button></li>`;
  }).join('');
  $('#nbSheet').innerHTML = `
    <div class="grip"></div>
    <div class="nb-head"><h2>선물 수첩</h2><span>찾음 ${state.found.size}/${GIFTS.length} · 찜 ${claimedN}</span></div>
    <ul class="nb-list">${rows}</ul>
    ${Store.mode === 'demo' ? '<p class="demo-note">체험 모드예요. 찜한 내용은 이 기기에만 저장돼요. ‘민지 (예시)’는 화면 예시입니다.</p>' : ''}`;
  $('#nbSheet').querySelectorAll('[data-gift]').forEach(b => b.onclick = () => { closeSheets(); setTimeout(() => openGift(b.dataset.gift), 180); });
}
function renderRooms() {
  const order = ['entry', 'living', 'kitchen', 'small', 'bed2', 'dress', 'bath2', 'bed1', 'bath1', 'utility'];
  $('#roomSheet').innerHTML = `<div class="grip"></div><div class="nb-head"><h2>방 이동</h2><span>바로 가볼 방을 고르세요</span></div>
    <ul class="room-grid">${order.map(r => {
      const left = GIFTS.filter(g => g.room === r && !state.found.has(g.id)).length;
      return `<li><button class="room-btn ${state.room === r ? 'here' : ''}" data-room="${r}"><b>${ROOM_NAMES[r]}</b><span>${left ? `반짝이 ${left}개 남음` : '다 찾음'}</span></button></li>`;
    }).join('')}</ul>`;
  $('#roomSheet').querySelectorAll('[data-room]').forEach(b => b.onclick = () => { closeSheets(); if (camera) goTo(ROOM_ENTRY[b.dataset.room], { instant: true }); });
}
function showSheet(sel) { document.querySelectorAll('.sheet').forEach(s => s.classList.toggle('on', s.matches(sel))); $('#scrim').classList.add('on'); }
function closeSheets() { document.querySelectorAll('.sheet').forEach(s => s.classList.remove('on')); $('#scrim').classList.remove('on'); openGiftId = null; }

function refresh() {
  $('#foundN').textContent = state.found.size;
  $('#totalN').textContent = GIFTS.length;
  if (openGiftId) renderGift();
  if ($('#nbSheet').classList.contains('on')) renderNotebook();
}
function burst(n) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const box = $('#confetti'); const colors = ['#c9a46c', '#f1ede6', '#8d8780', '#e6e1da', '#5a3b2e'];
  for (let i = 0; i < n; i++) {
    const p = document.createElement('i');
    p.style.left = Math.random() * 100 + 'vw'; p.style.background = colors[i % colors.length];
    p.style.setProperty('--x', (Math.random() * 120 - 60) + 'px'); p.style.setProperty('--r', (Math.random() * 720 - 360) + 'deg');
    p.style.setProperty('--t', (1.1 + Math.random() * 0.9) + 's'); p.style.animationDelay = (Math.random() * 0.25) + 's';
    box.appendChild(p); setTimeout(() => p.remove(), 2600);
  }
}

function enterHouse(name) {
  state.guest = name; ls('hw_guest', name);
  $('#door').classList.add('open'); $('#intro').classList.add('gone');
  say(`${name}님 어서 오세요! 화면을 끌어서 둘러보고, 바닥의 동그라미를 눌러 걸어 다녀요`, 'doria');
}

async function start() {
  document.title = SITE.title;
  $('#siteTitle').textContent = SITE.title; $('#introTitle').textContent = SITE.title;
  $('#introSub').innerHTML = SITE.intro; $('#doorPlate').textContent = SITE.doorPlate;
  Store.onChange(refresh); Store.init(); refresh();
  $('#scrim').onclick = closeSheets;
  $('#countBtn').onclick = () => { renderNotebook(); showSheet('#nbSheet'); };
  $('#roomsBtn').onclick = () => { renderRooms(); showSheet('#roomSheet'); };
  $('#avatarBtn').onclick = () => giveHint(speaker === 'tube' ? 'doria' : 'tube');
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheets(); });
  $('#enterForm').addEventListener('submit', (e) => { e.preventDefault(); const v = $('#guestName').value.trim(); if (v) enterHouse(v); });
  if (state.guest) { $('#intro').classList.add('gone'); say(`${state.guest}님 또 오셨네요! 아직 ${GIFTS.length - state.found.size}개 숨어 있어요`, 'tube'); }
  else say('화면을 끌어서 둘러보고, 바닥의 동그라미를 눌러 걸어 다녀요', 'doria');
  try { await Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1500))]); } catch (e) {}
  start3D();
  setTimeout(() => $('#howto').classList.add('fade'), 9000);
}
start();
</script>
</body>

}
function hideThanksStage() {
  $('#thanksStage').hidden = true;
  updateThanksChip();
  updateInviteStage();
}
function showFinale() {
  const f = $('#finale'); if (!f) return;
  $('#finSub').innerHTML = state.guest
    ? `<b>${esc(state.guest)}</b>님, 덕분에 집들이가 더 따뜻해졌어요<br>집에서 꼭 뵐게요 🐾`
    : '덕분에 집들이가 더 따뜻해졌어요<br>집에서 꼭 뵐게요 🐾';
  const notes = $('#finNotes');
  notes.innerHTML = ['♪', '♫', '♬', '♩', '♪', '♫'].map((n, k) =>
    `<i style="left:${8 + k * 15 + Math.random() * 6}%;animation-delay:${(k * .42).toFixed(2)}s">${n}</i>`).join('');
  f.hidden = false;
  $('#thanksStage').hidden = true;
  updateThanksChip();
  Music.start('dance');
  burst(120);
  clearTimeout(finaleT);
  finaleT = setTimeout(hideFinale, 16000);
}
function hideFinale() {
  clearTimeout(finaleT);
  const f = $('#finale'); if (!f || f.hidden) return;
  f.hidden = true;
  if (!state.thanksSeen) { state.thanksSeen = true; ls('hw2_thanksseen', 1); }
  updateThanksChip();
  Music.start('lobby');
  say('감사합니다 감사합니다~ 또 놀러 오세요 멍!', 'tube');
}

/* ================================================================
   노크 → 마중 → 입장
   ================================================================ */
let knocks = 0;
function setupKnock() {
  const door = $('#door');
  door.addEventListener('click', () => {
    if (knocks >= 2) return;
    Music.knock();
    Music.start('lobby');
    knocks++;
    door.classList.remove('knock'); void door.offsetWidth; door.classList.add('knock');
    const m = document.createElement('div');
    m.className = 'knockmark'; m.textContent = '똑';
    door.parentElement.appendChild(m);
    setTimeout(() => m.remove(), 750);
    if (knocks === 1) $('#introSub').innerHTML = '한 번만 더요!';
    if (knocks === 2) setTimeout(greet, 420);
  });
}
function greet() {
  $('#door').classList.add('open');
  $('#introSub').innerHTML = '마중 나왔어요!';
  $('#greeters').hidden = false;
  setTimeout(() => {
    $('#introSay').hidden = false;
    $('#introSay').textContent = SITE.knockAsk;
    $('#enterForm').hidden = false;
    $('#guestName').focus({ preventScroll: true });
  }, 420);
}
/* 입장하면 도리·튜브가 화면 중앙에서 맞이하고, 초대장을 열어야 집이 열립니다 */
let greeting = false, greetStep = 0;
function startGreeting() {
  greeting = true; greetStep = 0;
  const g = $('#greetStage');
  g.classList.remove('out'); g.hidden = false;
  renderGreet(); updateCta();
}
function renderGreet() {
  const bubble = $('#greetBubble'), next = $('#greetNext'), env = $('#greetEnv');
  if (greetStep === 0) {
    bubble.dataset.who = 'doria';
    bubble.innerHTML = `<small>유도리</small>${esc(SITE.welcome(state.guest))}`;
    next.hidden = false; next.textContent = '네, 들어갈게요 ▸';
    env.hidden = true;
  } else {
    bubble.dataset.who = 'tube';
    bubble.innerHTML = `<small>유튜브</small>${esc(SITE.thanksCue)}`;
    next.hidden = true;
    env.hidden = false;
  }
}
function endGreeting() {
  if (!greeting) return;
  greeting = false;
  const g = $('#greetStage');
  g.classList.add('out');
  setTimeout(() => { g.hidden = true; g.classList.remove('out'); }, 620);
  state.cueReady = true;
  updateCta(); updateInviteStage(); updateThanksChip();
  say('이제 집 안으로 들어가 볼까요? 아래 버튼을 눌러주세요!', 'doria');
}
function enterHouse(name) {
  state.guest = name; ls('hw2_guest', name);
  $('#intro').classList.add('gone');
  if (!state.thanked) { startGreeting(); return; }
  state.cueReady = true;
  say(SITE.welcome(name), 'doria');
  updateCta();
}

function start() {
  document.title = SITE.title;
  $('#siteTitle').textContent = SITE.title;
  $('#introTitle').textContent = SITE.title;
  $('#doorPlate').textContent = SITE.doorPlate;

  Store.onChange(refresh); Store.init();
  setupDrag(); setupKnock();
  showScene(state.scene, 'fwd');
  updateChip(); refresh();

  $('#scrim').onclick = closeSheets;
  $('#countBtn').onclick = () => { renderNotebook(); showSheet('#nbSheet'); };
  $('#roomsBtn').onclick = () => { renderRooms(); showSheet('#roomSheet'); };
  $('#zoomBtn').onclick = () => setZoom(1);
  $('#muteBtn').onclick = () => Music.toggle();
  $('#finMute').onclick = () => Music.toggle();
  $('#thanksGo').onclick = () => { hideThanksStage(); showFinale(); };
  $('#thanksGo').onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); hideThanksStage(); showFinale(); } };
  $('#thanksLater').onclick = () => { hideThanksStage(); state.thanksSeen = true; ls('hw2_thanksseen', 1); updateThanksChip(); };
  $('#thanksAgain').onclick = showFinale;
  $('#greetNext').onclick = () => { greetStep = 1; renderGreet(); };
  $('#greetEnv').onclick = openInvite;
  $('#greetEnv').onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openInvite(); } };
  $('#bubble').onclick = () => { if (!flushPending()) dogTalk(speaker === 'tube' ? 'doria' : 'tube'); };
  $('#finClose').onclick = hideFinale;
  updateMuteBtn();
  const kick = () => Music.start(Music.kind || 'lobby');
  ['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, kick, { once: true }));
  $('#avatarBtn').onclick = () => { if (!flushPending()) dogTalk(speaker === 'tube' ? 'doria' : 'tube'); };
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheets(); });
  $('#enterForm').addEventListener('submit', (e) => { e.preventDefault(); const v = $('#guestName').value.trim(); if (v) enterHouse(v); });

  if (state.guest && !state.thanked) {
    $('#intro').classList.add('gone');
    startGreeting();
  } else if (state.guest) {
    $('#intro').classList.add('gone');
    state.cueReady = true;
    const left = ROOM_ORDER.filter(r => hasGame(r) && !state.cleared.has(r)).length;
    say(left ? `${state.guest}님 또 오셨네요! 아직 미니게임 ${left}개가 남았어요` : `${state.guest}님 또 오셨네요! 위시리스트 다 열어두셨어요`, 'tube');
  } else {
    say('문을 두 번 두드려 주세요. 저희가 마중 나갈게요!', 'doria');
  }
  updateCta(); updateInviteStage(); updateThanksChip();
  $('#inviteStage').onclick = openInvite;
  setTimeout(() => $('#howto').classList.add('fade'), 8000);
  window.__hw = { goScene, openGame, openInvite, state,
    forceGame: (room, kind) => { game = { room, def: null, hearts: 3, moves: 0, t0: Date.now() }; let d; do { d = makeGameDef(room); } while (d.type !== kind); game.def = d; showSheet('#gameSheet'); renderGame(); },
    pathLen: () => (game && game.path ? game.path.length : 0),
    peekQuiz: () => (game && game.def && game.def.qs ? game.def.qs[game.qi||0].c : 0),
    peekDiffs: () => (game && game.diffs) || null };
}
start();
</script>

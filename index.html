<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>유씨네 집들이</title>
<meta name="description" content="유튜브와 유도리가 안내하는 우리 집 구경 · 숨은 선물 찾기">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Gaegu:wght@700&display=swap">
<style>
/* Layout: one-screen app — header / hand-drawn room view / dog dock; gift cards rise as bottom sheets.
   Look: the architect's pen-and-wash sketchbook — warm paper, graphite lines, one brass accent. */
:root {
  color-scheme: dark;
  --ink: #171614;
  --panel: #211f1d;
  --rule: #3a3633;
  --paper: #f4f1ea;
  --paper-edge: #ded8cc;
  --brass: #c9a46c;
  --brass-dim: #8c7350;
  --text: #f1ede6;
  --muted: #a69f95;
  --ok: #8fb59a;
  --font-display: "Hahmlet", "Nanum Myeongjo", serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-dog: "Gaegu", "IBM Plex Sans KR", cursive;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--ink); color: var(--text);
  font: 15px/1.55 var(--font-body);
  overflow: hidden; -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-rows: auto 1fr auto; padding-inline: 16px; padding-top: env(safe-area-inset-top, 0px); }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 13px 9px; }
.brand { min-width: 0; }
.brand h1 { margin: 0; font: 700 20px/1.2 var(--font-display); letter-spacing: -0.01em; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }
.count { flex: none; display: flex; align-items: center; gap: 7px; padding: 7px 12px; border: 1px solid var(--rule); border-radius: 999px; font-variant-numeric: tabular-nums; font-size: 13px; background: none; cursor: pointer; }
.count svg { width: 16px; height: 16px; }
.count b { color: var(--brass); font-weight: 600; }

/* ---------- the sketchbook stage ---------- */
.stage {
  position: relative; min-height: 0; border-radius: 16px; overflow: hidden;
  background: var(--paper);
  box-shadow: 0 0 0 1px var(--paper-edge), 0 18px 40px -22px rgba(0,0,0,.9);
  touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none;
}
.stage.grabbing { cursor: grabbing; }
.layer { position: absolute; left: 0; top: 0; transform-origin: 50% 50%; --k: 1; }
.layer img { display: block; width: 100%; height: 100%; }
.vignette { position: absolute; inset: 0; z-index: 2; pointer-events: none; box-shadow: inset 0 0 70px 10px rgba(94,86,72,.2); }

/* hotspots live inside the layer so they track the drawing */
.hot { position: absolute; transform: translate(-50%, -50%); }
.go {
  display: grid; justify-items: center; gap: 4px; background: none; border: 0; padding: 4px; cursor: pointer;
  filter: drop-shadow(0 2px 5px rgba(80,72,58,.4));
}
.go .disc {
  width: calc(40px * var(--k)); height: calc(40px * var(--k)); border-radius: 50%; display: grid; place-items: center;
  background: rgba(255,253,247,.9); border: 1.5px solid #6d6659; color: #2c2823;
  transition: background .18s ease;
  animation: bob 2.6s ease-in-out infinite;
}
.go .disc svg { width: 46%; height: 46%; }
.go:hover .disc, .go:focus-visible .disc { background: #fff; }
.go b { font-family: var(--font-body); font-weight: 600; font-size: calc(11.5px * var(--k)); color: #302c26; background: rgba(255,253,247,.92); padding: 2px 7px; border-radius: 99px; white-space: nowrap; }
.go.back .disc { width: calc(34px * var(--k)); height: calc(34px * var(--k)); }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

.gift { background: none; border: 0; padding: 0; cursor: pointer; width: calc(54px * var(--k)); height: calc(54px * var(--k)); position: relative; }
.gift .spark { position: absolute; inset: 0; display: grid; place-items: center; }
.gift .spark svg { width: 100%; height: 100%; transform-origin: center; animation: twinkle var(--p, 3s) ease-in-out var(--d, 0s) infinite; }
@keyframes twinkle {
  0%, 100% { opacity: .62; transform: scale(.8) rotate(0deg); }
  50% { opacity: 1; transform: scale(1.1) rotate(20deg); }
}
.gift.found .spark { display: none; }
.gift .tag { display: none; width: 66%; height: 66%; border-radius: 50%; margin: 17% auto; place-items: center; background: var(--brass); border: 2px solid #fffdf7; color: #221f1a; box-shadow: 0 3px 8px rgba(80,72,58,.45); }
.gift .tag svg { width: 52%; height: 52%; }
.gift.found .tag { display: grid; }
.gift.claimed .tag { background: #7fa389; color: #fff; }

.dog { position: absolute; transform: translate(-50%, -100%); cursor: pointer; filter: drop-shadow(0 4px 6px rgba(90,82,66,.3)); --s: 1; }
.dog img { display: block; width: calc(104px * var(--k) * var(--s)); height: auto; animation: sniff 3.2s ease-in-out infinite; }
@keyframes sniff { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-2px) rotate(-1.5deg); } }

/* stage chrome */
.chip {
  position: absolute; z-index: 3; top: 10px; display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 12px; border-radius: 999px; font-size: 13px; color: #2c2823;
  background: rgba(255,253,247,.84); border: 1px solid rgba(90,82,66,.25); backdrop-filter: blur(6px);
}
.chip.place { left: 10px; font: 700 14px var(--font-display); }
.chip.place span { font: 500 11.5px var(--font-body); color: #6d6659; margin-left: 2px; }
.chip.rooms { right: 10px; cursor: pointer; }
.chip.zoom { right: 10px; top: auto; bottom: 12px; cursor: pointer; }
.chip svg { width: 14px; height: 14px; }
.howto {
  position: absolute; z-index: 3; left: 50%; bottom: 12px; transform: translateX(-50%);
  max-width: calc(100% - 24px); padding: 7px 13px; border-radius: 12px; font-size: 12.5px; text-align: center; color: #2c2823;
  background: rgba(255,253,247,.86); border: 1px solid rgba(90,82,66,.22); backdrop-filter: blur(6px);
  transition: opacity .6s;
}
.howto.fade { opacity: 0; pointer-events: none; }

/* dock */
.dock { display: flex; align-items: flex-end; gap: 10px; padding-block: 10px calc(14px + env(safe-area-inset-bottom, 0px)); }
.avatar { flex: none; width: 46px; height: 46px; border-radius: 50%; background: var(--paper); border: 1px solid var(--rule); overflow: hidden; cursor: pointer; padding: 0; }
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.bubble { position: relative; flex: 1; min-width: 0; background: var(--paper); color: #26221f; border-radius: 16px 16px 16px 4px; padding: 9px 13px; font: 700 16.5px/1.3 var(--font-dog); min-height: 46px; display: flex; align-items: center; }
.bubble small { display: block; font: 600 11px var(--font-body); color: #7a7168; margin-bottom: 1px; }

/* sheets */
.scrim { position: fixed; inset: 0; background: rgba(8,8,7,.55); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 10; }
.scrim.on { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; max-height: 86%; overflow-y: auto;
  background: var(--panel); border-top: 1px solid var(--rule); border-radius: 22px 22px 0 0;
  padding: 10px 20px calc(22px + env(safe-area-inset-bottom, 0px));
  transform: translateY(105%); transition: transform .32s cubic-bezier(.2,.8,.2,1);
  max-width: 560px; margin: 0 auto;
}
.sheet.on { transform: none; }
.grip { width: 38px; height: 4px; border-radius: 4px; background: var(--rule); margin: 0 auto 14px; }
.eyebrow { font-size: 11.5px; letter-spacing: .08em; color: var(--brass); font-weight: 600; }
.gift-hero { display: flex; gap: 14px; align-items: center; margin-top: 6px; }
.gift-emoji { flex: none; width: 64px; height: 64px; border-radius: 18px; background: #181715; border: 1px solid var(--rule); display: grid; place-items: center; font-size: 34px; }
.gift-hero h2 { margin: 0; font: 700 21px/1.25 var(--font-display); text-wrap: balance; }
.price { color: var(--muted); font-size: 13.5px; margin-top: 3px; font-variant-numeric: tabular-nums; }
.note { margin: 16px 0 0; padding: 12px 14px; background: #181715; border-radius: 12px; font: 700 17px/1.35 var(--font-dog); color: var(--paper); }
.note small { display: block; font: 500 11.5px var(--font-body); color: var(--muted); margin-top: 4px; }
.link { display: inline-block; margin-top: 12px; color: var(--brass); font-size: 13.5px; }
.actions { display: grid; gap: 8px; margin-top: 18px; }
.btn { height: 50px; border-radius: 14px; border: 0; font-weight: 600; font-size: 15.5px; cursor: pointer; }
.btn-primary { background: var(--brass); color: #1b1a19; }
.btn-ghost { background: none; border: 1px solid var(--rule); color: var(--text); }
.btn[disabled] { opacity: .55; cursor: default; }
.status { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--rule); font-size: 14px; }
.status .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.status.mine { border-color: var(--brass-dim); }
.status.mine .dot { background: var(--brass); }
.confirm-q { font-size: 14.5px; margin: 0 0 2px; }
.err { color: #e4a08f; font-size: 13px; margin-top: 8px; }

.nb-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.nb-head h2 { margin: 0; font: 700 20px var(--font-display); }
.nb-head span { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.nb-list { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 1px; background: var(--rule); border-radius: 14px; overflow: hidden; }
.nb-list li { background: var(--panel); }
.nb-item { width: 100%; display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; padding: 11px 12px; background: none; border: 0; text-align: left; cursor: pointer; }
.nb-item .em { font-size: 24px; text-align: center; }
.nb-item .t { min-width: 0; }
.nb-item .t b { display: block; font-weight: 600; font-size: 14.5px; }
.nb-item .t span { color: var(--muted); font-size: 12.5px; }
.nb-item .st { font-size: 12px; color: var(--muted); text-align: right; white-space: nowrap; }
.nb-item .st.claimed { color: var(--ok); }
.nb-item .st.mine { color: var(--brass); }
.nb-item.locked { cursor: default; }
.nb-item.locked .em { opacity: .4; filter: grayscale(1); }
.nb-item.locked b { color: var(--muted); letter-spacing: .1em; }
.demo-note { margin-top: 14px; font-size: 12px; color: var(--muted); }
.room-grid { list-style: none; margin: 14px 0 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.room-btn { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--rule); background: #181715; text-align: left; cursor: pointer; }
.room-btn b { display: block; font-weight: 600; }
.room-btn span { font-size: 12px; color: var(--muted); }
.room-btn.here { border-color: var(--brass-dim); }

/* intro */
.intro {
  position: fixed; inset: 0; z-index: 20; background: var(--ink);
  display: grid; place-items: center; padding: calc(24px + env(safe-area-inset-top, 0px)) 16px calc(24px + env(safe-area-inset-bottom, 0px));
  overflow-y: auto; transition: opacity .5s .5s, visibility 0s 1s;
}
.intro.gone { opacity: 0; visibility: hidden; }
.intro-inner { width: 100%; max-width: 360px; display: grid; gap: 22px; justify-items: center; text-align: center; }
.intro .kicker { font-size: 12px; letter-spacing: .14em; color: var(--brass); font-weight: 600; }
.intro h1 { margin: 6px 0 0; font: 700 34px/1.15 var(--font-display); text-wrap: balance; }
.intro p { margin: 10px 0 0; color: var(--muted); font-size: 14px; }
.door-frame { width: 150px; height: 232px; border-radius: 4px; background: #e9e5df; padding: 9px 9px 0; perspective: 600px; box-shadow: 0 0 0 1px var(--rule), 0 30px 60px -30px rgba(201,164,108,.45); position: relative; }
.door-frame::before { content: ""; position: absolute; inset: 9px 9px 0; background: radial-gradient(ellipse at 50% 20%, #fff7e6 0%, #e9dfcf 45%, #c9bfb0 100%); }
.door { position: relative; height: 100%; background: #5a3b2e; transform-origin: left center; transition: transform 1s cubic-bezier(.5,0,.2,1); box-shadow: inset -2px 0 0 rgba(0,0,0,.25); }
.door .lock { position: absolute; right: 12px; top: 46%; width: 13px; height: 34px; border-radius: 3px; background: #1d1d1d; box-shadow: inset 0 0 0 1px #444; }
.door .lock::after { content: ""; position: absolute; left: 4px; top: 6px; width: 5px; height: 5px; border-radius: 50%; background: #6fc3ff; opacity: .8; }
.door .handle { position: absolute; right: 6px; top: 58%; width: 22px; height: 4px; border-radius: 2px; background: #b9b4ad; }
.door .plate { position: absolute; left: 50%; top: 18px; transform: translateX(-50%); font: 700 11px var(--font-display); color: #d8c3a5; letter-spacing: .06em; white-space: nowrap; }
.door .banner { position: absolute; left: 50%; top: 52px; transform: translateX(-50%); width: 30px; }
.door .banner i { display: block; width: 18px; height: 12px; margin: 0 auto; border: 1px solid #c8b493; border-bottom: 0; border-right: 0; transform: rotate(45deg) translate(5px, 5px); }
.door .banner span { display: grid; place-items: center; width: 30px; height: 40px; background: #f2eee6; border-top: 2px solid #b48d5c; color: #c98a8a; font-size: 13px; }
.door.open { transform: rotateY(-78deg); }
.enter { width: 100%; display: grid; gap: 10px; }
.enter label { font-size: 13px; color: var(--muted); text-align: left; }
.enter input { height: 50px; border-radius: 14px; border: 1px solid var(--rule); background: var(--panel); color: var(--text); padding: 0 16px; font-size: 16px; }
.enter input::placeholder { color: #6f685f; }

.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 30; overflow: hidden; }
.confetti i { position: absolute; top: -12px; width: 7px; height: 12px; border-radius: 1px; animation: fall var(--t, 1.6s) cubic-bezier(.25,.6,.4,1) forwards; }
@keyframes fall { to { transform: translate(var(--x, 0), 105vh) rotate(var(--r, 540deg)); opacity: .9; } }

@media (prefers-reduced-motion: reduce) {
  .door, .sheet, .intro { transition-duration: .01s; }
  .confetti { display: none; }
  .go .disc, .dog img, .gift .spark svg { animation: none; }
  .gift .spark svg { opacity: .85; }
}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand">
      <h1 id="siteTitle">유씨네 집들이</h1>
      <p>반짝이는 곳을 찾아보세요</p>
    </div>
    <button class="count" id="countBtn" aria-label="선물 수첩 열기">
      <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="6" width="12" height="8" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M1.5 6h13M8 6v8M8 6C6 2 3.5 3 5 5.2 6 6 8 6 8 6zm0 0c2-4 4.5-3 3-0.8C10 6 8 6 8 6z" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
      <span>선물 수첩 <b id="foundN">0</b>/<span id="totalN">0</span></span>
    </button>
  </header>

  <main class="stage" id="stage">
    <div class="chip place" id="placeChip">거실</div>
    <button class="chip rooms" id="roomsBtn">
      <svg viewBox="0 0 14 14" aria-hidden="true"><rect x="1.5" y="1.5" width="11" height="11" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M1.5 7h5V1.5M6.5 7v5.5M6.5 9.5h6" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
      방 이동
    </button>
    <div class="vignette"></div>
    <button class="chip zoom" id="zoomBtn" hidden>
      <svg viewBox="0 0 14 14" aria-hidden="true"><path d="M1.5 5V1.5H5M9 1.5h3.5V5M12.5 9v3.5H9M5 12.5H1.5V9" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      전체 보기
    </button>
    <div class="howto" id="howto">그림을 두 번 누르면 가까이 보여요 · 화살표를 누르면 걸어가요</div>
  </main>

  <footer class="dock">
    <button class="avatar" id="avatarBtn" aria-label="강아지에게 힌트 듣기">
      <img id="avatarImg" src="rooms/face-doria.webp" alt="유도리">
    </button>
    <div class="bubble" id="bubble" aria-live="polite"></div>
  </footer>
</div>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="giftSheet" role="dialog" aria-modal="true" aria-labelledby="giftName"></section>
<section class="sheet" id="nbSheet" role="dialog" aria-modal="true" aria-label="선물 수첩"></section>
<section class="sheet" id="roomSheet" role="dialog" aria-modal="true" aria-label="방 이동"></section>

<div class="intro" id="intro">
  <div class="intro-inner">
    <div>
      <div class="kicker">HOUSEWARMING</div>
      <h1 id="introTitle">유씨네 집들이</h1>
      <p id="introSub"></p>
    </div>
    <div class="door-frame" aria-hidden="true">
      <div class="door" id="door">
        <div class="plate" id="doorPlate">유튜브 · 유도리</div>
        <div class="banner"><i></i><span>♡</span></div>
        <div class="lock"></div><div class="handle"></div>
      </div>
    </div>
    <form class="enter" id="enterForm" autocomplete="off">
      <label for="guestName">방문하신 분 이름</label>
      <input id="guestName" name="guestName" maxlength="20" placeholder="예: 김민지" required>
      <button class="btn btn-primary" type="submit">문 열고 들어가기</button>
    </form>
  </div>
</div>

<div class="confetti" id="confetti"></div>

<script>
/* ================================================================
   1) 사이트 설정 — 문구는 여기만 고치면 됩니다
   ================================================================ */
const SITE = {
  title: '유씨네 집들이',
  intro: '유튜브와 유도리가 집 구경을 시켜드릴게요.<br>구경하다 반짝이는 걸 찾으면, 그게 저희 집에 필요한 거예요.',
  doorPlate: '유튜브 · 유도리',
};

/* ================================================================
   2) Firebase 설정 — 비워두면 '체험 모드'(이 기기에만 저장)
   ================================================================ */
const FIREBASE_CONFIG = null;

/* ================================================================
   3) 장면 — 그림 한 장이 곧 한 시점입니다
      exits: [가는 곳, 버튼 글씨, 그림 위 x%, 그림 위 y%]
      dogs:  [누가, x%, y%, 크기]
   ================================================================ */
const SCENES = {
  'entry-art': {
    room: 'entry', sub: '그림 쪽', img: 'rooms/entry-art.webp',
    exits: [
      ['living-kitchen', '거실', 42, 86],
      ['guest', '손님방', 66, 74],
      ['entry-door', '뒤돌아보기', 26, 93, 'back'],
    ],
    dogs: [['doria', 78, 99, .75]],
  },
  'entry-door': {
    room: 'entry', sub: '현관문 쪽', img: 'rooms/entry-door.webp',
    exits: [['entry-art', '뒤돌아보기', 50, 93, 'back']],
  },
  'living-kitchen': {
    room: 'living', sub: '주방 쪽', img: 'rooms/living-kitchen.webp',
    exits: [
      ['kitchen', '주방', 34, 82],
      ['bath1-toilet', '거실 욕실', 56, 91],
      ['entry-art', '현관 쪽', 78, 82],
      ['living-window', '창가 쪽', 26, 95, 'back'],
    ],
  },
  'living-window': {
    room: 'living', sub: '창가 쪽', img: 'rooms/living-window.webp',
    exits: [
      ['living-beanbag', '빈백 쪽', 74, 88],
      ['living-kitchen', '주방 쪽', 40, 95, 'back'],
    ],
    dogs: [['doria', 24, 93, .85]],
  },
  'living-beanbag': {
    room: 'living', sub: '빈백 쪽', img: 'rooms/living-beanbag.webp',
    exits: [
      ['living-window', '창가 쪽', 26, 88],
      ['living-kitchen', '주방 쪽', 62, 95, 'back'],
    ],
    dogs: [['tube', 80, 94, .8]],
  },
  'kitchen': {
    room: 'kitchen', sub: '아일랜드', img: 'rooms/kitchen.webp',
    exits: [
      ['studio-desk', '작업실', 20, 86],
      ['utility', '다용도실', 78, 78],
      ['living-kitchen', '거실로', 50, 94, 'back'],
    ],
  },
  'utility': {
    room: 'utility', sub: '', img: 'rooms/utility.webp',
    exits: [['kitchen', '주방으로', 50, 92, 'back']],

const $ = (s) => document.querySelector(s);
function ls(key, val) {
  try {
    if (val === undefined) return JSON.parse(localStorage.getItem(key));
    localStorage.setItem(key, JSON.stringify(val));
  } catch (e) { return null; }
}
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const Store = {
  mode: 'demo', uid: state.guestId, listeners: [],
  onChange(fn) { this.listeners.push(fn); },
  emit() { this.listeners.forEach(fn => fn()); },
  async init() {
    if (FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey) {
      try { await this.initLive(); return; } catch (e) { console.warn('Firebase 연결 실패, 체험 모드로 전환', e); }
    }
    this.initDemo();
  },
  initDemo() {
    this.mode = 'demo';
    let c = ls('hw_claims');
    if (!c) { c = { glasses: { name: '민지 (예시)', uid: 'example', at: Date.now() } }; ls('hw_claims', c); }
    state.claims = c;
    window.addEventListener('storage', (e) => { if (e.key === 'hw_claims') { state.claims = ls('hw_claims') || {}; this.emit(); } });
    this.emit();
  },
  async initLive() {
    const base = 'https://www.gstatic.com/firebasejs/10.12.2/';
    const [appMod, fs, authMod] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-firestore.js'), import(base + 'firebase-auth.js')]);
    const app = appMod.initializeApp(FIREBASE_CONFIG);
    const db = fs.getFirestore(app);
    const cred = await authMod.signInAnonymously(authMod.getAuth(app));
    this.uid = cred.user.uid; this.mode = 'live';
    fs.onSnapshot(fs.collection(db, 'claims'), (snap) => { const c = {}; snap.forEach(d => { c[d.id] = d.data(); }); state.claims = c; this.emit(); });
    this.claim = (gid, name) => fs.runTransaction(db, async (tx) => {
      const ref = fs.doc(db, 'claims', gid); const s = await tx.get(ref);
      if (s.exists()) throw new Error('taken');
      tx.set(ref, { name, uid: this.uid, at: fs.serverTimestamp() });
    });
    this.unclaim = (gid) => fs.deleteDoc(fs.doc(db, 'claims', gid));
  },
  async claim(gid, name) {
    const c = ls('hw_claims') || {}; if (c[gid]) throw new Error('taken');
    c[gid] = { name, uid: this.uid, at: Date.now() }; ls('hw_claims', c); state.claims = c; this.emit();
  },
  async unclaim(gid) { const c = ls('hw_claims') || {}; delete c[gid]; ls('hw_claims', c); state.claims = c; this.emit(); },
};
const isMine = (c) => c && c.uid === Store.uid;

function buildScene(id) {
  const sc = SCENES[id];

  el.innerHTML = `<img alt="${esc(ROOM_NAMES[sc.room])} 그림" draggable="false" src="${sc.img}">`;

    h.querySelector('button').addEventListener('click', (e) => { e.stopPropagation(); goScene(to); });
    el.appendChild(h);
  });

  GIFTS.filter(g => g.scene === id).forEach((g, i) => {
    const h = document.createElement('div');

    h.querySelector('button').addEventListener('click', (e) => { e.stopPropagation(); onGift(g.id); });

  (sc.dogs || []).forEach(([who, x, y, s]) => {

    h.addEventListener('click', (e) => { e.stopPropagation(); giveHint(who); });

}

/* 그림 전체가 보이도록 맞추고(=확대 1배), 확대하면 그만큼 끌어서 볼 수 있게 합니다. */
function fitLayer(el) {
  const W = stage.clientWidth, H = stage.clientHeight;
  if (!W || !H) return;
  const contain = Math.min(W / natural.w, H / natural.h);
  const cover = Math.max(W / natural.w, H / natural.h);
  /* 화면을 채우되, 가로로 긴 그림은 1.3배까지만 잘라서 보여줍니다 */
  const base = contain * Math.min(cover / contain, 1.45);
  const w = natural.w * base * zoom, h = natural.h * base * zoom;
  el.style.width = w + 'px'; el.style.height = h + 'px';
  el.style.left = ((W - w) / 2) + 'px'; el.style.top = ((H - h) / 2) + 'px';
  el.style.setProperty('--k', Math.max(.6, Math.min(1.25, w / 430)).toFixed(3));
  maxPan.x = Math.max(0, (w - W) / 2); maxPan.y = Math.max(0, (h - H) / 2);
  pan.x = Math.max(-maxPan.x, Math.min(maxPan.x, pan.x));
  pan.y = Math.max(-maxPan.y, Math.min(maxPan.y, pan.y));
  applyPan();
}
function applyPan() { if (layer) layer.style.transform = `translate(${pan.x}px, ${pan.y}px)`; }
function setZoom(z, anchor) {
  const was = zoom;
  zoom = Math.max(1, Math.min(MAX_ZOOM, z));
  if (zoom === was) return;
  const r = zoom / was;
  if (anchor) {
    const cx = anchor.x - stage.clientWidth / 2, cy = anchor.y - stage.clientHeight / 2;
    pan.x = (pan.x - cx) * r + cx; pan.y = (pan.y - cy) * r + cy;
  } else { pan.x *= r; pan.y *= r; }
  if (layer) {
    layer.style.transition = 'width .3s ease, height .3s ease, left .3s ease, top .3s ease, transform .3s ease';
    fitLayer(layer);
    setTimeout(() => { if (layer) layer.style.transition = 'none'; }, 320);
  }
  $('#zoomBtn').hidden = zoom <= 1;
}

function showScene(id, dir) {
  const old = layer;
  const el = buildScene(id);
  el.style.opacity = '0';
  el.style.transform = `scale(${dir === 'back' ? 1.06 : 0.94})`;
  stage.appendChild(el);
  const img = el.querySelector('img');
  const go = () => {
    natural = { w: img.naturalWidth || 4, h: img.naturalHeight || 3 };
    pan = { x: 0, y: 0 }; zoom = 1; $('#zoomBtn').hidden = true;
    layer = el;
    fitLayer(el);
    requestAnimationFrame(() => {
      el.style.transition = 'opacity .5s ease, transform .5s cubic-bezier(.2,.75,.3,1)';
      el.style.opacity = '1';
      applyPan();
    });
    if (old) {
      old.style.transition = 'opacity .4s ease, transform .4s ease';
      old.style.opacity = '0';
      old.style.transform += ` scale(${dir === 'back' ? 0.94 : 1.07})`;
      setTimeout(() => old.remove(), 440);
    }
    refresh();
    preload(id);
  };
  if (img.complete && img.naturalWidth) go(); else { img.onload = go; img.onerror = go; }
}

const preloaded = new Set();
function preload(id) {
  (SCENES[id].exits || []).forEach(([to]) => {
    if (preloaded.has(to)) return;
    preloaded.add(to);
    const i = new Image(); i.src = SCENES[to].img;
  });
}

function goScene(id, opt = {}) {
  if (!SCENES[id] || id === state.scene) return;
  const back = (SCENES[state.scene].exits || []).some(([to, , , , kind]) => to === id && kind === 'back');
  const prevRoom = curRoom();
  state.scene = id;
  showScene(id, back ? 'back' : 'fwd');
  updateChip();
  $('#howto').classList.add('fade');
  if (!opt.silent) announce(prevRoom);
}
function updateChip() {
  const sc = SCENES[state.scene];
  $('#placeChip').innerHTML = `${esc(ROOM_NAMES[sc.room])}${sc.sub ? ` <span>${esc(sc.sub)}</span>` : ''}`;
}
function announce(prevRoom) {
  const room = curRoom();
  const left = GIFTS.filter(g => SCENES[g.scene].room === room && !state.found.has(g.id)).length;
  const total = GIFTS.filter(g => SCENES[g.scene].room === room).length;
  const who = dogFor(room);
  if (room === prevRoom) {
    if (left) say(`여기도 잘 보세요. 이 방에 ${left}개 남았어요`, who);
    return;
  }
  if (!total) say(pick(['여긴 선물이 없는 것 같아요. 다른 방도 가봐요!', '킁킁… 여긴 아무 냄새도 안 나요.']), who);
  else if (!left) say('이 방에선 다 찾았어요! 최고예요', who);
  else say(`${ROOM_NAMES[room]}에 반짝이는 게 ${left}개 숨어 있어요. 둘러보세요!`, who);
}

/* ---------- 확대해서 둘러보기 ---------- */
function setupDrag() {
  const pts = new Map();
  let drag = null, pinch = null, lastTap = 0;
  const rel = (e) => { const r = stage.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };

  stage.addEventListener('pointerdown', (e) => {
    if (e.target.closest('button')) return;
    pts.set(e.pointerId, e);
    try { stage.setPointerCapture(e.pointerId); } catch (err) {}
    if (pts.size === 2) {
      const [a, b] = [...pts.values()];
      pinch = { d: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY), z: zoom };
      drag = null;
    } else if (pts.size === 1) {
      drag = { x: e.clientX, y: e.clientY, px: pan.x, py: pan.y, moved: false };
      stage.classList.add('grabbing');
    }
  });
  stage.addEventListener('pointermove', (e) => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, e);
    if (pinch && pts.size === 2) {
      const [a, b] = [...pts.values()];
      const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
      zoom = Math.max(1, Math.min(MAX_ZOOM, pinch.z * (d / pinch.d)));
      if (layer) { layer.style.transition = 'none'; fitLayer(layer); }
      $('#zoomBtn').hidden = zoom <= 1;
      $('#howto').classList.add('fade');
      return;
    }
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.moved && Math.hypot(dx, dy) > 6) { drag.moved = true; $('#howto').classList.add('fade'); }
    if (!drag.moved) return;
    if (layer) layer.style.transition = 'none';
    pan.x = Math.max(-maxPan.x, Math.min(maxPan.x, drag.px + dx));
    pan.y = Math.max(-maxPan.y, Math.min(maxPan.y, drag.py + dy));
    applyPan();
  });
  const end = (e) => {
    pts.delete(e.pointerId);
    if (pts.size < 2) pinch = null;
    if (drag && !drag.moved && !e.target.closest('button')) {
      const now = Date.now();
      if (now - lastTap < 320) { setZoom(zoom > 1.2 ? 1 : 2, rel(e)); lastTap = 0; }
      else lastTap = now;
    }
    drag = null; stage.classList.remove('grabbing');
  };
  stage.addEventListener('pointerup', end);
  stage.addEventListener('pointercancel', end);
  stage.addEventListener('wheel', (e) => { e.preventDefault(); setZoom(zoom * (e.deltaY < 0 ? 1.18 : 1 / 1.18), rel(e)); }, { passive: false });
  new ResizeObserver(() => { if (layer) fitLayer(layer); }).observe(stage);
}

/* ---------- 선물 카드 ---------- */
function onGift(gid) {
  if (!state.found.has(gid)) {
    state.found.add(gid); ls('hw_found', [...state.found]);
    burst(16); refresh();
    const g = GIFTS.find(x => x.id === gid);
    say(state.found.size === GIFTS.length ? '마지막 하나까지 찾았어요! 대단해요' : pick(['찾았다! 멍멍!', '역시 눈썰미 최고예요', '오, 이거 진짜 필요해요!']), dogFor(SCENES[g.scene].room));
  }
  openGift(gid);
}
let openGiftId = null, confirming = false, busy = false, lastErr = '';
function openGift(gid) { openGiftId = gid; confirming = false; lastErr = ''; renderGift(); showSheet('#giftSheet'); }
function renderGift() {
  if (!openGiftId) return;
  const g = GIFTS.find(x => x.id === openGiftId);
  const c = state.claims[g.id];
  let action;
  if (c && isMine(c)) {
    action = `<div class="status mine"><span class="dot"></span><span><b>${esc(c.name)}</b>님이 준비하기로 했어요. 고마워요!</span></div>
      <button class="btn btn-ghost" id="unclaimBtn" ${busy ? 'disabled' : ''}>찜 취소하기</button>`;
  } else if (c) {
    action = `<div class="status"><span class="dot"></span><span><b>${esc(c.name)}</b>님이 이미 준비 중이에요</span></div>
      <button class="btn btn-ghost" data-close>다른 선물 찾으러 가기</button>`;
  } else if (confirming) {
    action = `<p class="confirm-q"><b>${esc(state.guest)}</b> 이름으로 이 선물을 찜할까요? 모두에게 이름이 보여요.</p>
      <button class="btn btn-primary" id="claimYes" ${busy ? 'disabled' : ''}>네, 제가 선물할게요</button>
      <button class="btn btn-ghost" id="claimNo">다시 생각해볼게요</button>`;
  } else {
    action = `<button class="btn btn-primary" id="claimBtn">이 선물 찜하기</button>
      <button class="btn btn-ghost" data-close>계속 구경하기</button>`;
  }
  $('#giftSheet').innerHTML = `
    <div class="grip"></div>
    <div class="eyebrow">${esc(ROOM_NAMES[SCENES[g.scene].room])}에서 찾은 선물</div>
    <div class="gift-hero">
      <div class="gift-emoji" aria-hidden="true">${g.emoji}</div>
      <div><h2 id="giftName">${esc(g.name)}</h2><div class="price">${esc(g.price)}</div></div>
    </div>
    <div class="note">“${esc(g.note)}”<small>집주인 한마디</small></div>
    ${g.url ? `<a class="link" href="${esc(g.url)}" target="_blank" rel="noopener">이런 제품이면 좋아요 ↗</a>` : ''}
    <div class="actions">${action}${lastErr ? `<div class="err">${esc(lastErr)}</div>` : ''}</div>`;
  const on = (id, fn) => { const b = document.getElementById(id); if (b) b.onclick = fn; };
  on('claimBtn', () => { confirming = true; renderGift(); });
  on('claimNo', () => { confirming = false; renderGift(); });
  on('claimYes', async () => {
    busy = true; lastErr = ''; renderGift();
    try { await Store.claim(g.id, state.guest); confirming = false; burst(60); say(`${state.guest}님 고마워요! 꼬리 흔드는 중`, dogFor(SCENES[g.scene].room)); }
    catch (e) { lastErr = e.message === 'taken' ? '방금 다른 분이 먼저 찜했어요. 다른 선물을 골라주세요.' : '저장하지 못했어요. 인터넷 연결을 확인하고 다시 눌러주세요.'; confirming = false; }
    busy = false; renderGift();
  });
  on('unclaimBtn', async () => {
    busy = true; renderGift();
    try { await Store.unclaim(g.id); } catch (e) { lastErr = '취소하지 못했어요. 다시 눌러주세요.'; }
    busy = false; renderGift();
  });
  $('#giftSheet').querySelectorAll('[data-close]').forEach(b => b.onclick = closeSheets);
}

/* ---------- 선물 수첩 / 방 이동 ---------- */
function renderNotebook() {
  const claimedN = GIFTS.filter(g => state.claims[g.id]).length;
  const rows = GIFTS.map(g => {
    const found = state.found.has(g.id); const c = state.claims[g.id]; const room = ROOM_NAMES[SCENES[g.scene].room];
    if (!found) return `<li><div class="nb-item locked"><span class="em">${g.emoji}</span><span class="t"><b>???</b><span>${esc(room)} 어딘가</span></span><span class="st">못 찾음</span></div></li>`;
    const st = c ? (isMine(c) ? `<span class="st mine">내가 찜함</span>` : `<span class="st claimed">${esc(c.name)}</span>`) : `<span class="st">찜 가능</span>`;
    return `<li><button class="nb-item" data-gift="${g.id}"><span class="em">${g.emoji}</span><span class="t"><b>${esc(g.name)}</b><span>${esc(room)} · ${esc(g.price)}</span></span>${st}</button></li>`;
  }).join('');
  $('#nbSheet').innerHTML = `
    <div class="grip"></div>
    <div class="nb-head"><h2>선물 수첩</h2><span>찾음 ${state.found.size}/${GIFTS.length} · 찜 ${claimedN}</span></div>
    <ul class="nb-list">${rows}</ul>
    ${Store.mode === 'demo' ? '<p class="demo-note">체험 모드예요. 찜한 내용은 이 기기에만 저장돼요. ‘민지 (예시)’는 화면 예시입니다.</p>' : ''}`;
  $('#nbSheet').querySelectorAll('[data-gift]').forEach(b => b.onclick = () => {
    closeSheets();
    const g = GIFTS.find(x => x.id === b.dataset.gift);
    if (g.scene !== state.scene) goScene(g.scene, { silent: true });
    setTimeout(() => openGift(g.id), 260);
  });
}
function renderRooms() {
  const order = ['entry', 'living', 'kitchen', 'small', 'bed2', 'dress', 'bath2', 'bed1', 'bath1', 'utility'];
  $('#roomSheet').innerHTML = `<div class="grip"></div><div class="nb-head"><h2>방 이동</h2><span>바로 가볼 방을 고르세요</span></div>
    <ul class="room-grid">${order.map(r => {
      const left = GIFTS.filter(g => SCENES[g.scene].room === r && !state.found.has(g.id)).length;
      return `<li><button class="room-btn ${curRoom() === r ? 'here' : ''}" data-room="${r}"><b>${ROOM_NAMES[r]}</b><span>${left ? `반짝이 ${left}개 남음` : '다 찾음'}</span></button></li>`;
    }).join('')}</ul>`;
  $('#roomSheet').querySelectorAll('[data-room]').forEach(b => b.onclick = () => { closeSheets(); goScene(ROOM_ENTRY[b.dataset.room]); });
}
function showSheet(sel) { document.querySelectorAll('.sheet').forEach(s => s.classList.toggle('on', s.matches(sel))); $('#scrim').classList.add('on'); }
function closeSheets() { document.querySelectorAll('.sheet').forEach(s => s.classList.remove('on')); $('#scrim').classList.remove('on'); openGiftId = null; }

function refresh() {
  $('#foundN').textContent = state.found.size;
  $('#totalN').textContent = GIFTS.length;
  document.querySelectorAll('.gift').forEach(b => {
    const id = b.dataset.gift;
    b.classList.toggle('found', state.found.has(id));
    b.classList.toggle('claimed', !!state.claims[id]);
    if (state.found.has(id)) b.setAttribute('aria-label', GIFTS.find(g => g.id === id).name);
  });
  if (openGiftId) renderGift();
  if ($('#nbSheet').classList.contains('on')) renderNotebook();
}
function burst(n) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const box = $('#confetti'); const colors = ['#c9a46c', '#f1ede6', '#8d8780', '#e6e1da', '#5a3b2e'];
  for (let i = 0; i < n; i++) {
    const p = document.createElement('i');
    p.style.left = Math.random() * 100 + 'vw'; p.style.background = colors[i % colors.length];
    p.style.setProperty('--x', (Math.random() * 120 - 60) + 'px'); p.style.setProperty('--r', (Math.random() * 720 - 360) + 'deg');
    p.style.setProperty('--t', (1.1 + Math.random() * 0.9) + 's'); p.style.animationDelay = (Math.random() * 0.25) + 's';
    box.appendChild(p); setTimeout(() => p.remove(), 2600);
  }
}

function enterHouse(name) {
  state.guest = name; ls('hw_guest', name);
  $('#door').classList.add('open'); $('#intro').classList.add('gone');
  say(`${name}님 어서 오세요! 화살표를 눌러 걸어 다니고, 그림을 두 번 누르면 가까이 보여요`, 'doria');
}

function start() {
  document.title = SITE.title;
  $('#siteTitle').textContent = SITE.title; $('#introTitle').textContent = SITE.title;
  $('#introSub').innerHTML = SITE.intro; $('#doorPlate').textContent = SITE.doorPlate;

  Store.onChange(refresh); Store.init();
  setupDrag();
  showScene(state.scene, 'fwd');
  updateChip();
  refresh();

  $('#scrim').onclick = closeSheets;
  $('#countBtn').onclick = () => { renderNotebook(); showSheet('#nbSheet'); };
  $('#roomsBtn').onclick = () => { renderRooms(); showSheet('#roomSheet'); };
  $('#zoomBtn').onclick = () => setZoom(1);
  $('#avatarBtn').onclick = () => giveHint(speaker === 'tube' ? 'doria' : 'tube');
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheets(); });
  $('#enterForm').addEventListener('submit', (e) => { e.preventDefault(); const v = $('#guestName').value.trim(); if (v) enterHouse(v); });

  if (state.guest) { $('#intro').classList.add('gone'); say(`${state.guest}님 또 오셨네요! 아직 ${GIFTS.length - state.found.size}개 숨어 있어요`, 'tube'); }
  else say('화살표를 눌러 걸어 다니고, 그림을 두 번 누르면 가까이 볼 수 있어요', 'doria');
  setTimeout(() => $('#howto').classList.add('fade'), 9000);
  window.__hw = { goScene };
}
start();
</script>

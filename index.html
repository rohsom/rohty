<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>유씨네 집들이</title>
<meta name="description" content="튜브와 도리아가 안내하는 우리 집 구경 · 숨은 선물 찾기">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Gaegu:wght@700&display=swap">
<style>
/* Layout: one-screen app — header / floor-plan stage / dog dock; gift cards rise as bottom sheets.
   Look: the house itself at night — greige tile plan on charcoal, black-film kitchen, brass downlight accent. */
:root {
  color-scheme: dark;
  --night: #161514;      /* page ground */
  --panel: #211f1d;      /* sheets, dock */
  --rule: #3a3633;       /* hairlines on dark */
  --tile: #e6e1da;       /* floor-plan floor (greige tile) */
  --wall: #2a2725;       /* plan walls */
  --film: #1d1f20;       /* black film / ceramic */
  --brass: #c9a46c;      /* downlight accent */
  --brass-dim: #8c7350;
  --text: #f1ede6;
  --muted: #a69f95;
  --ok: #8fb59a;
  --font-display: "Hahmlet", "Nanum Myeongjo", serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-dog: "Gaegu", "IBM Plex Sans KR", cursive;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--night); color: var(--text);
  font: 15px/1.55 var(--font-body);
  overflow: hidden; -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
.room-hit:focus, .spot:focus { outline: none; }
.room-hit:focus-visible { fill: rgba(201,164,108,.16); }

.app { height: 100%; display: grid; grid-template-rows: auto 1fr auto; padding-inline: 16px; padding-top: env(safe-area-inset-top, 0px); }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px 8px; }
.brand { min-width: 0; }
.brand h1 { margin: 0; font: 700 21px/1.2 var(--font-display); letter-spacing: -0.01em; text-wrap: balance; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }
.count { flex: none; display: flex; align-items: center; gap: 7px; padding: 7px 12px; border: 1px solid var(--rule); border-radius: 999px; font-variant-numeric: tabular-nums; font-size: 13px; background: none; cursor: pointer; }
.count svg { width: 16px; height: 16px; }
.count b { color: var(--brass); font-weight: 600; }

/* stage */
.stage { position: relative; min-height: 0; }
#plan { width: 100%; height: 100%; display: block; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.back {
  position: absolute; left: 0; top: 4px; z-index: 2;
  display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px 7px 9px;
  background: rgba(22,21,20,.82); border: 1px solid var(--rule); border-radius: 999px; font-size: 13px; cursor: pointer;
  backdrop-filter: blur(6px);
}
.room-title { position: absolute; right: 0; top: 4px; z-index: 2; font: 700 15px var(--font-display); padding: 6px 2px; color: var(--text); text-shadow: 0 1px 6px var(--night); }

/* plan */
.floor { fill: var(--tile); }
.room-hit { fill: transparent; cursor: pointer; transition: fill .25s; }
.room-hit:hover { fill: rgba(201,164,108,.10); }
.zoomed .room-hit.current { fill: transparent; cursor: default; }
.walls { fill: none; stroke: var(--wall); stroke-width: 4; stroke-linecap: square; }
.wall-black { stroke: #0b0b0b; stroke-width: 5; }
.demolished { fill: none; stroke: #a59d92; stroke-width: 1; stroke-dasharray: 3 3; }
.window { stroke: #c9d3d8; stroke-width: 2.2; stroke-linecap: butt; }
.f { fill: #f8f6f2; stroke: #8b847b; stroke-width: .8; }
.f-soft { fill: #d9d3ca; stroke: #8b847b; stroke-width: .8; }
.f-dark { fill: var(--film); stroke: #0b0b0b; stroke-width: .8; }
.f-line { stroke: #8b847b; stroke-width: .6; fill: none; }
.lbl { font: 600 9.5px var(--font-body); fill: #6f685f; text-anchor: middle; pointer-events: none; letter-spacing: .02em; }
.lbl-dark { fill: #c9c2b6; }
.zoomed .lbl { opacity: .35; }
.badge circle { fill: var(--brass); }
.badge text { font: 700 7.5px var(--font-body); fill: #1b1a19; text-anchor: middle; dominant-baseline: central; }
.zoomed .badge { display: none; }
.fan { transform-box: fill-box; transform-origin: center; animation: spin 6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* hidden gift spots */
.spot { pointer-events: none; }
.zoomed .spot.here { pointer-events: auto; cursor: pointer; }
.spot .hit { fill: transparent; }
.spot .glint { fill: #fff8e8; opacity: 0; transform-box: fill-box; transform-origin: center; }
.zoomed .spot.here:not(.found) .glint { animation: glint var(--p, 4s) ease-in-out var(--d, 0s) infinite; }
@keyframes glint { 0%, 70%, 100% { opacity: 0; transform: scale(.4) rotate(0deg); } 80% { opacity: .95; transform: scale(1.15) rotate(30deg); } 90% { opacity: .2; transform: scale(.8) rotate(45deg); } }
.spot .tag { display: none; }
.spot.found .tag { display: inline; }
.zoomed .spot.found { pointer-events: auto; cursor: pointer; }
.tag circle { fill: var(--brass); stroke: #fff; stroke-width: .8; }
.spot.claimed .tag circle { fill: #6b8f76; }
.tag path { fill: none; stroke: #1b1a19; stroke-width: 1; stroke-linecap: round; stroke-linejoin: round; }

/* dogs */
.dog { cursor: pointer; }
.dog .bob { animation: bob 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom center; }
.dog:nth-of-type(2) .bob { animation-delay: -1.1s; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.6px); } }

/* dock */
.dock { display: flex; align-items: flex-end; gap: 10px; padding-block: 10px calc(14px + env(safe-area-inset-bottom, 0px)); }
.avatar { flex: none; width: 46px; height: 46px; border-radius: 50%; background: var(--panel); border: 1px solid var(--rule); display: grid; place-items: center; cursor: pointer; padding: 0; }
.avatar svg { width: 38px; height: 38px; }
.bubble { position: relative; flex: 1; min-width: 0; background: var(--tile); color: #26221f; border-radius: 16px 16px 16px 4px; padding: 9px 13px; font: 700 16.5px/1.3 var(--font-dog); min-height: 46px; display: flex; align-items: center; }
.bubble small { display: block; font: 600 11px var(--font-body); color: #7a7168; margin-bottom: 1px; }

/* sheets */
.scrim { position: fixed; inset: 0; background: rgba(8,8,7,.55); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 10; }
.scrim.on { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; max-height: 86%; overflow-y: auto;
  background: var(--panel); border-top: 1px solid var(--rule); border-radius: 22px 22px 0 0;
  padding: 10px 20px calc(22px + env(safe-area-inset-bottom, 0px));
  transform: translateY(105%); transition: transform .32s cubic-bezier(.2,.8,.2,1);
  max-width: 560px; margin: 0 auto;
}
.sheet.on { transform: none; }
.grip { width: 38px; height: 4px; border-radius: 4px; background: var(--rule); margin: 0 auto 14px; }
.eyebrow { font-size: 11.5px; letter-spacing: .08em; color: var(--brass); font-weight: 600; }
.gift-hero { display: flex; gap: 14px; align-items: center; margin-top: 6px; }
.gift-emoji { flex: none; width: 64px; height: 64px; border-radius: 18px; background: var(--night); border: 1px solid var(--rule); display: grid; place-items: center; font-size: 34px; }
.gift-hero h2 { margin: 0; font: 700 21px/1.25 var(--font-display); text-wrap: balance; }
.price { color: var(--muted); font-size: 13.5px; margin-top: 3px; font-variant-numeric: tabular-nums; }
.note { margin: 16px 0 0; padding: 12px 14px; background: var(--night); border-radius: 12px; font: 700 17px/1.35 var(--font-dog); color: var(--tile); }
.note small { display: block; font: 500 11.5px var(--font-body); color: var(--muted); margin-top: 4px; }
.link { display: inline-block; margin-top: 12px; color: var(--brass); font-size: 13.5px; }
.actions { display: grid; gap: 8px; margin-top: 18px; }
.btn { height: 50px; border-radius: 14px; border: 0; font-weight: 600; font-size: 15.5px; cursor: pointer; }
.btn-primary { background: var(--brass); color: #1b1a19; }
.btn-ghost { background: none; border: 1px solid var(--rule); color: var(--text); }
.btn[disabled] { opacity: .55; cursor: default; }
.status { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--rule); font-size: 14px; }
.status .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.status.mine { border-color: var(--brass-dim); }
.status.mine .dot { background: var(--brass); }
.confirm-q { font-size: 14.5px; margin: 0 0 2px; }
.err { color: #e4a08f; font-size: 13px; margin-top: 8px; }

.nb-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.nb-head h2 { margin: 0; font: 700 20px var(--font-display); }
.nb-head span { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.nb-list { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 1px; background: var(--rule); border-radius: 14px; overflow: hidden; }
.nb-list li { background: var(--panel); }
.nb-item { width: 100%; display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; padding: 11px 12px; background: none; border: 0; text-align: left; cursor: pointer; }
.nb-item .em { font-size: 24px; text-align: center; }
.nb-item .t { min-width: 0; }
.nb-item .t b { display: block; font-weight: 600; font-size: 14.5px; }
.nb-item .t span { color: var(--muted); font-size: 12.5px; }
.nb-item .st { font-size: 12px; color: var(--muted); text-align: right; white-space: nowrap; }
.nb-item .st.claimed { color: var(--ok); }
.nb-item .st.mine { color: var(--brass); }
.nb-item.locked { cursor: default; }
.nb-item.locked .em { opacity: .4; filter: grayscale(1); }
.nb-item.locked b { color: var(--muted); letter-spacing: .1em; }
.demo-note { margin-top: 14px; font-size: 12px; color: var(--muted); }

/* intro */
.intro {
  position: fixed; inset: 0; z-index: 20; background: var(--night);
  display: grid; place-items: center; padding: calc(24px + env(safe-area-inset-top, 0px)) 16px calc(24px + env(safe-area-inset-bottom, 0px));
  overflow-y: auto; transition: opacity .5s .5s, visibility 0s 1s;
}
.intro.gone { opacity: 0; visibility: hidden; }
.intro-inner { width: 100%; max-width: 360px; display: grid; gap: 22px; justify-items: center; text-align: center; }
.intro .kicker { font-size: 12px; letter-spacing: .14em; color: var(--brass); font-weight: 600; }
.intro h1 { margin: 6px 0 0; font: 700 34px/1.15 var(--font-display); text-wrap: balance; }
.intro p { margin: 10px 0 0; color: var(--muted); font-size: 14px; }
.door-frame { width: 150px; height: 232px; border-radius: 4px; background: #e9e5df; padding: 9px 9px 0; perspective: 600px; box-shadow: 0 0 0 1px var(--rule), 0 30px 60px -30px rgba(201,164,108,.45); position: relative; }
.door-frame::before { content: ""; position: absolute; inset: 9px 9px 0; background: radial-gradient(ellipse at 50% 20%, #fff7e6 0%, #e9dfcf 45%, #c9bfb0 100%); }
.door { position: relative; height: 100%; background: #5a3b2e; transform-origin: left center; transition: transform 1s cubic-bezier(.5,0,.2,1); box-shadow: inset -2px 0 0 rgba(0,0,0,.25); }
.door .lock { position: absolute; right: 12px; top: 46%; width: 13px; height: 34px; border-radius: 3px; background: #1d1d1d; box-shadow: inset 0 0 0 1px #444; }
.door .lock::after { content: ""; position: absolute; left: 4px; top: 6px; width: 5px; height: 5px; border-radius: 50%; background: #6fc3ff; opacity: .8; }
.door .handle { position: absolute; right: 6px; top: 58%; width: 22px; height: 4px; border-radius: 2px; background: #b9b4ad; }
.door .plate { position: absolute; left: 50%; top: 18px; transform: translateX(-50%); font: 700 11px var(--font-display); color: #d8c3a5; letter-spacing: .06em; }
.door .banner { position: absolute; left: 50%; top: 52px; transform: translateX(-50%); width: 30px; }
.door .banner i { display: block; width: 18px; height: 12px; margin: 0 auto; border: 1px solid #c8b493; border-bottom: 0; transform: rotate(45deg) translate(5px, 5px); border-right: 0; }
.door .banner span { display: grid; place-items: center; width: 30px; height: 40px; background: #f2eee6; border-top: 2px solid #b48d5c; color: #c98a8a; font-size: 13px; }
.door.open { transform: rotateY(-78deg); }
.enter { width: 100%; display: grid; gap: 10px; }
.enter label { font-size: 13px; color: var(--muted); text-align: left; }
.enter input { height: 50px; border-radius: 14px; border: 1px solid var(--rule); background: var(--panel); color: var(--text); padding: 0 16px; font-size: 16px; }
.enter input::placeholder { color: #6f685f; }

/* confetti */
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 30; overflow: hidden; }
.confetti i { position: absolute; top: -12px; width: 7px; height: 12px; border-radius: 1px; animation: fall var(--t, 1.6s) cubic-bezier(.25,.6,.4,1) forwards; }
@keyframes fall { to { transform: translate(var(--x, 0), 105vh) rotate(var(--r, 540deg)); opacity: .9; } }

@media (prefers-reduced-motion: reduce) {
  .fan, .dog .bob, .zoomed .spot.here:not(.found) .glint { animation: none; }
  .zoomed .spot.here:not(.found) .glint { opacity: .8; }
  .door, .sheet, .intro { transition-duration: .01s; }
  .confetti { display: none; }
}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand">
      <h1 id="siteTitle">유씨네 집들이</h1>
      <p id="siteSub">반짝이는 곳을 찾아보세요</p>
    </div>
    <button class="count" id="countBtn" aria-label="선물 수첩 열기">
      <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="6" width="12" height="8" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M1.5 6h13M8 6v8M8 6C6 2 3.5 3 5 5.2 6 6 8 6 8 6zm0 0c2-4 4.5-3 3-0.8C10 6 8 6 8 6z" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
      <span>선물 수첩 <b id="foundN">0</b>/<span id="totalN">0</span></span>
    </button>
  </header>

  <main class="stage" id="stage">
    <button class="back" id="backBtn" hidden>
      <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M9 2 4 7l5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      집 전체 보기
    </button>
    <div class="room-title" id="roomTitle" hidden></div>

    <svg id="plan" viewBox="-8 -8 356 556" preserveAspectRatio="xMidYMid meet" role="img" aria-label="우리 집 평면도">
      <defs>
        <pattern id="tiles" width="12" height="24" patternUnits="userSpaceOnUse">
          <rect width="12" height="24" fill="#e6e1da"/>
          <path d="M0 0H12M0 0V24" stroke="#d6d0c7" stroke-width=".5"/>
        </pattern>
        <pattern id="balconyTiles" width="8" height="8" patternUnits="userSpaceOnUse">
          <rect width="8" height="8" fill="#dcd6cd"/>
          <path d="M0 0H8M0 0V8" stroke="#cbc4ba" stroke-width=".5"/>
        </pattern>
        <path id="glintShape" d="M0 -5 L1.1 -1.1 L5 0 L1.1 1.1 L0 5 L-1.1 1.1 L-5 0 L-1.1 -1.1Z"/>
      </defs>

      <!-- floors -->
      <g>
        <path class="floor" fill="url(#tiles)" d="M150 0H340V400H250V500H120V540H0V80H150Z" style="fill:url(#tiles)"/>
        <rect x="0" y="80" width="40" height="120" style="fill:url(#balconyTiles)"/>
        <!-- 현관: 호텔 느낌 네이비 카펫 + 블랙 마블 단차 -->
        <rect x="120" y="440" width="130" height="60" fill="#2a2f3d"/>
        <path d="M120 452H250M120 464H250M120 476H250M120 488H250" stroke="#323849" stroke-width=".6"/>
        <rect x="120" y="434" width="30" height="6" fill="#151515"/>
        <path d="M122 436c5 2 9 -1 14 2M138 438c4 -2 7 0 10 -1" stroke="#e9e6e1" stroke-width=".6" fill="none" opacity=".8"/>
        <!-- 복도: 시계, 강아지 얼굴 매트, 청소기 스테이션 -->
        <rect x="145" y="342" width="5" height="9" fill="#fff" stroke="#111" stroke-width=".6"/>
        <circle cx="147.5" cy="346.5" r="2" fill="none" stroke="#111" stroke-width=".4"/>
        <ellipse cx="143" cy="414" rx="5" ry="4" fill="#b8865a"/><ellipse cx="143" cy="415.5" rx="3.6" ry="2.4" fill="#f0e6d8"/>
        <rect x="122" y="420" width="6" height="7" rx="1" fill="#fff" stroke="#8b847b" stroke-width=".5"/><rect x="123.5" y="417" width="3" height="4" fill="#222"/>
      </g>

      <!-- ceiling cove light in living room -->
      <rect x="14" y="214" width="150" height="104" rx="2" fill="none" stroke="#c9a46c" stroke-width=".8" stroke-dasharray="2 3" opacity=".55"/>

      <!-- furniture -->
      <g id="furniture">
        <!-- 현관: full-height cabinets + mirror niche -->
        <rect class="f-soft" x="150" y="487" width="96" height="11"/>
        <rect x="178" y="488" width="32" height="9" fill="#efe6d6" stroke="#8b847b" stroke-width=".6"/>
        <path d="M179 489.5q2.6 -1.6 5.2 0t5.2 0t5.2 0t5.2 0t5.2 0" fill="none" stroke="#2b2b2b" stroke-width=".6"/>
        <rect x="179" y="489" width="18" height="4.5" fill="#fbfaf7" opacity=".9"/>
        <path d="M195 492.6l-2 -1.6v3.2zM195 492.6l2 -1.6v3.2z" fill="#111"/>
        <circle cx="204" cy="493" r="1.6" fill="#a58fd6"/>
        <rect x="199" y="491.5" width="2.4" height="3" fill="#8a5a3a"/>
        <path class="f-line" d="M166 487v11M228 487v11"/>
        <!-- 정면의 포인트 그림 (탭하면 강아지가 소개) -->
        <g id="artwork" style="cursor:pointer">
          <rect x="120.5" y="471" width="5" height="24" fill="#fff"/>
          <rect x="121.3" y="472" width="3.4" height="22" fill="#3d7a4b"/>
          <rect x="122.3" y="476" width="1.4" height="13" fill="#8fc0dd"/>
          <rect x="114" y="466" width="22" height="34" fill="transparent"/>
        </g>

        <!-- 손님방(현관 옆): 창가 수납 데이베드, 책상 + 스탠드, TV + 선반 -->
        <rect x="2" y="432" width="5" height="40" fill="#d6d2cc" opacity=".9"/>
        <rect class="f" x="6" y="440" width="34" height="72" rx="2"/>
        <rect x="9" y="444" width="30" height="66" rx="2" fill="#2f3b38"/>
        <path d="M9 452h30M9 460h30M9 468h30M9 476h30M9 484h30M9 492h30M9 500h30M17 444v66M25 444v66M33 444v66" stroke="#55635f" stroke-width=".4"/>
        <rect x="10" y="446" width="10" height="16" rx="3" fill="#a9c3c4"/>
        <rect class="f" x="6" y="396" width="38" height="14"/>
        <circle cx="12" cy="403" r="3.4" fill="#fff" stroke="#8b847b" stroke-width=".6"/>
        <rect class="f" x="100" y="440" width="17" height="62"/>
        <path class="f-line" d="M100 455h17M100 470h17M100 486h17"/>
        <rect x="96" y="448" width="3" height="26" fill="#1b1b1b"/>
        <rect x="104" y="476" width="9" height="8" fill="#c44a3a" opacity=".8"/>
        <rect class="f-soft" x="40" y="526" width="68" height="12"/>
        <path class="f-line" d="M57 526v12M74 526v12M91 526v12"/>

        <!-- 거실: 빔 스크린, 빈백 2, 좌탁, 프로젝터 -->
        <polygon points="34,209 16,383 114,383" fill="#c9a46c" opacity=".10"/>
        <rect x="16" y="383" width="98" height="3.5" fill="#fff" stroke="#8b847b" stroke-width=".6"/>
        <rect x="24" y="202" width="20" height="5" fill="#f4f2ee" stroke="#8b847b" stroke-width=".5"/>
        <circle cx="34" cy="206" r="3" fill="#fbfaf7" stroke="#555" stroke-width=".6"/><circle cx="34" cy="207.5" r="1" fill="#c9a46c"/>
        <rect x="52" y="203" width="14" height="8" fill="#d6d9da" stroke="#8b847b" stroke-width=".5"/>
        <ellipse cx="14" cy="238" rx="10" ry="8" fill="#7a6553"/><ellipse cx="14" cy="238" rx="6" ry="4.5" fill="#a08a75"/>
        <circle cx="9" cy="372" r="5.5" fill="#fbfaf7" stroke="#8b847b" stroke-width=".6"/><circle cx="9" cy="372" r="2" fill="#c9ced0"/>
        <circle cx="22" cy="375" r="4" fill="#b9bcbd" stroke="#8b847b" stroke-width=".6"/>

const $ = (s) => document.querySelector(s);
const NS = 'http://www.w3.org/2000/svg';
const OVERVIEW = [-8, -8, 356, 556];
const roomById = Object.fromEntries(ROOMS.map(r => [r.id, r]));

function ls(key, val) {
  try {
    if (val === undefined) return JSON.parse(localStorage.getItem(key));
    localStorage.setItem(key, JSON.stringify(val));
  } catch (e) { return null; }
}

const state = {
  guest: ls('hw_guest') || null,
  guestId: ls('hw_gid') || (Math.random().toString(36).slice(2) + Date.now().toString(36)),
  found: new Set(ls('hw_found') || []),
  claims: {},
  room: null,
  view: OVERVIEW.slice(),
};
ls('hw_gid', state.guestId);

/* ---------- 저장소: 체험 모드(localStorage) / 실서비스(Firebase) ---------- */
const Store = {
  mode: 'demo',
  uid: state.guestId,
  listeners: [],
  onChange(fn) { this.listeners.push(fn); },
  emit() { this.listeners.forEach(fn => fn(state.claims)); },

  async init() {
    if (FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey) {
      try { await this.initLive(); return; }
      catch (e) { console.warn('Firebase 연결 실패, 체험 모드로 전환', e); }
    }
    this.initDemo();
  },

  initDemo() {
    this.mode = 'demo';
    let c = ls('hw_claims');
    if (!c) { c = { glasses: { name: '민지 (예시)', uid: 'example', at: Date.now() } }; ls('hw_claims', c); }
    state.claims = c;
    window.addEventListener('storage', (e) => { if (e.key === 'hw_claims') { state.claims = ls('hw_claims') || {}; this.emit(); } });
    this.emit();
  },

  async initLive() {
    const base = 'https://www.gstatic.com/firebasejs/10.12.2/';
    const [appMod, fs, authMod] = await Promise.all([
      import(base + 'firebase-app.js'), import(base + 'firebase-firestore.js'), import(base + 'firebase-auth.js'),
    ]);
    const app = appMod.initializeApp(FIREBASE_CONFIG);
    const db = fs.getFirestore(app);
    const cred = await authMod.signInAnonymously(authMod.getAuth(app));
    this.uid = cred.user.uid;
    this.mode = 'live';
    fs.onSnapshot(fs.collection(db, 'claims'), (snap) => {
      const c = {}; snap.forEach(d => { c[d.id] = d.data(); });
      state.claims = c; this.emit();
    });
    this.claim = (gid, name) => fs.runTransaction(db, async (tx) => {
      const ref = fs.doc(db, 'claims', gid);
      const s = await tx.get(ref);
      if (s.exists()) throw new Error('taken');
      tx.set(ref, { name, uid: this.uid, at: fs.serverTimestamp() });
    });
    this.unclaim = (gid) => fs.deleteDoc(fs.doc(db, 'claims', gid));
  },

  async claim(gid, name) {
    const c = ls('hw_claims') || {};
    if (c[gid]) throw new Error('taken');
    c[gid] = { name, uid: this.uid, at: Date.now() };
    ls('hw_claims', c); state.claims = c; this.emit();
  },
  async unclaim(gid) {
    const c = ls('hw_claims') || {};
    delete c[gid]; ls('hw_claims', c); state.claims = c; this.emit();
  },
};
const isMine = (c) => c && c.uid === Store.uid;

/* ---------- 평면도 그리기 ---------- */
function el(tag, attrs, parent) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}

function buildPlan() {
  const hits = $('#hits'), labels = $('#labels'), spots = $('#spots');
  ROOMS.forEach(r => {
    const h = el('path', { d: r.hit, class: 'room-hit', 'data-room': r.id, tabindex: 0, role: 'button', 'aria-label': r.name + ' 들어가기' }, hits);
    h.addEventListener('click', () => enterRoom(r.id));
    h.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); enterRoom(r.id); } });

    const g = el('g', {}, labels);
    const t = el('text', { x: r.label[0], y: r.label[1], class: r.dark ? 'lbl lbl-dark' : 'lbl' }, g);
    if (r.vertical) { t.setAttribute('transform', `rotate(-90 ${r.label[0]} ${r.label[1]})`); }
    t.textContent = r.name;
    const b = el('g', { class: 'badge', 'data-badge': r.id }, g);
    const bx = r.vertical ? r.label[0] + 8 : r.label[0] + r.name.length * 5 + 6;
    const by = r.vertical ? r.label[1] - r.name.length * 5 - 6 : r.label[1] - 3.5;
    el('circle', { cx: bx, cy: by, r: 5.2 }, b);
    const bt = el('text', { x: bx, y: by + .3 }, b);
    bt.textContent = '?';
  });

  GIFTS.forEach((g, i) => {
    const s = el('g', { class: 'spot', 'data-gift': g.id, 'data-room': g.room, transform: `translate(${g.x} ${g.y})`, role: 'button', 'aria-label': '반짝이는 것' }, spots);
    s.style.setProperty('--d', (i * 0.73 % 3).toFixed(2) + 's');
    s.style.setProperty('--p', (3.2 + (i * 0.41 % 1.6)).toFixed(2) + 's');
    el('circle', { r: 13, class: 'hit' }, s);
    el('use', { href: '#glintShape', class: 'glint' }, s);
    const tag = el('g', { class: 'tag' }, s);
    el('circle', { r: 5.5 }, tag);
    el('path', { d: 'M-2.6 -.6h5.2v3.2h-5.2zM-3 -.6h6M0 -.6v3.2M0 -.6c-1 -2.2 -2.8 -1.6 -1.9 -.4M0 -.6c1 -2.2 2.8 -1.6 1.9 -.4' }, tag);
    s.addEventListener('click', (e) => { e.stopPropagation(); onSpot(g.id); });
  });
}

/* ---------- 확대 / 축소 ---------- */
let anim = null;
function animateView(target) {
  const svg = $('#plan');
  const from = state.view.slice();
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const dur = reduce ? 1 : 480;
  const t0 = performance.now();
  cancelAnimationFrame(anim);
  const step = (now) => {
    const k = Math.min(1, (now - t0) / dur);
    const e = 1 - Math.pow(1 - k, 3);
    state.view = from.map((v, i) => v + (target[i] - v) * e);
    svg.setAttribute('viewBox', state.view.map(n => n.toFixed(2)).join(' '));
    if (k < 1) anim = requestAnimationFrame(step);
  };
  anim = requestAnimationFrame(step);
}

function enterRoom(id) {
  if (state.room === id) return;
  const r = roomById[id];
  state.room = id;
  document.querySelectorAll('.room-hit').forEach(h => h.classList.toggle('current', h.dataset.room === id));
  document.querySelectorAll('.spot').forEach(s => s.classList.toggle('here', s.dataset.room === id));
  $('#stage').classList.add('zoomed');
  $('#plan').classList.add('zoomed');
  $('#backBtn').hidden = false;
  $('#roomTitle').hidden = false;
  $('#roomTitle').textContent = r.name;
  animateView(r.box);
  const left = GIFTS.filter(g => g.room === id && !state.found.has(g.id)).length;
  const total = GIFTS.filter(g => g.room === id).length;
  if (!total) say(pick(['여긴 선물이 없는 것 같아요. 다른 방도 가봐요!', '킁킁… 여긴 아무 냄새도 안 나요.', '여기는 그냥 구경만 하세요 멍!']), dogFor(id));
  else if (!left) say('이 방에선 다 찾았어요! 최고예요', dogFor(id));
  else say(`${r.name}에 반짝이는 게 ${left}개 숨어 있어요. 잘 보면 빛나요!`, dogFor(id));
}

function leaveRoom() {
  state.room = null;
  document.querySelectorAll('.room-hit').forEach(h => h.classList.remove('current'));
  document.querySelectorAll('.spot').forEach(s => s.classList.remove('here'));
  $('#stage').classList.remove('zoomed');
  $('#plan').classList.remove('zoomed');
  $('#backBtn').hidden = true;
  $('#roomTitle').hidden = true;
  animateView(OVERVIEW);
  idleTalk();
}

let speaker = 'doria';
const dogFor = (room) => (['small', 'utility', 'bed1', 'entry', 'bath2'].includes(room) ? 'tube' : 'doria');

function say(text, who) {
  speaker = who || speaker;
  const d = DOGS[speaker];
  $('#avatarSvg').innerHTML = d.svg;
  $('#bubble').innerHTML = `<div><small>${d.name}</small>${text}</div>`;

function idleTalk() {
  const left = GIFTS.length - state.found.size;
  if (state.found.size === 0) say('방을 눌러서 들어가 보세요! 반짝이는 걸 누르면 선물이 나와요', 'doria');
  else if (left === 0) say('우와, 전부 다 찾았어요! 선물 수첩에서 골라주세요', 'tube');
  else say(`아직 ${left}개 더 숨어 있어요. 힌트가 필요하면 저를 눌러요!`, pick(['tube', 'doria']));
}

function giveHint(who) {
  const pool = GIFTS.filter(g => !state.found.has(g.id) && (!state.room || g.room === state.room));
  const any = GIFTS.filter(g => !state.found.has(g.id));
  const g = pick(pool.length ? pool : any.length ? any : [null]);
  if (!g) { say('다 찾았잖아요! 이제 간식 주세요', who); return; }
  say(g.hint, who);
}

/* ---------- 선물 카드 ---------- */
function onSpot(gid) {
  if (!state.found.has(gid)) {
    state.found.add(gid);
    ls('hw_found', [...state.found]);
    burst(16);
    refresh();
    const g = GIFTS.find(x => x.id === gid);
    say(state.found.size === GIFTS.length ? '마지막 하나까지 찾았어요! 대단해요' : pick(['찾았다! 멍멍!', '역시 눈썰미 최고예요', '오, 이거 진짜 필요해요!']), dogFor(g.room));
  }
  openGift(gid);
}

let openGiftId = null, confirming = false, busy = false, lastErr = '';
function openGift(gid) {
  openGiftId = gid; confirming = false; lastErr = '';
  renderGift();
  showSheet('#giftSheet');
}

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

function renderGift() {
  if (!openGiftId) return;
  const g = GIFTS.find(x => x.id === openGiftId);
  const c = state.claims[g.id];
  const room = roomById[g.room].name;
  let action;
  if (c && isMine(c)) {
    action = `<div class="status mine"><span class="dot"></span><span><b>${esc(c.name)}</b>님이 준비하기로 했어요. 고마워요!</span></div>
      <button class="btn btn-ghost" id="unclaimBtn" ${busy ? 'disabled' : ''}>찜 취소하기</button>`;
  } else if (c) {
    action = `<div class="status"><span class="dot"></span><span><b>${esc(c.name)}</b>님이 이미 준비 중이에요</span></div>
      <button class="btn btn-ghost" data-close>다른 선물 찾으러 가기</button>`;
  } else if (confirming) {
    action = `<p class="confirm-q"><b>${esc(state.guest)}</b> 이름으로 이 선물을 찜할까요? 모두에게 이름이 보여요.</p>
      <button class="btn btn-primary" id="claimYes" ${busy ? 'disabled' : ''}>네, 제가 선물할게요</button>
      <button class="btn btn-ghost" id="claimNo">다시 생각해볼게요</button>`;
  } else {
    action = `<button class="btn btn-primary" id="claimBtn">이 선물 찜하기</button>
      <button class="btn btn-ghost" data-close>계속 구경하기</button>`;
  }
  $('#giftSheet').innerHTML = `
    <div class="grip"></div>
    <div class="eyebrow">${esc(room)}에서 찾은 선물</div>
    <div class="gift-hero">
      <div class="gift-emoji" aria-hidden="true">${g.emoji}</div>
      <div><h2 id="giftName">${esc(g.name)}</h2><div class="price">${esc(g.price)}</div></div>
    </div>
    <div class="note">“${esc(g.note)}”<small>집주인 한마디</small></div>
    ${g.url ? `<a class="link" href="${esc(g.url)}" target="_blank" rel="noopener">이런 제품이면 좋아요 ↗</a>` : ''}
    <div class="actions">${action}${lastErr ? `<div class="err">${esc(lastErr)}</div>` : ''}</div>`;

  const on = (id, fn) => { const b = document.getElementById(id); if (b) b.onclick = fn; };
  on('claimBtn', () => { confirming = true; renderGift(); });
  on('claimNo', () => { confirming = false; renderGift(); });
  on('claimYes', async () => {
    busy = true; lastErr = ''; renderGift();
    try {
      await Store.claim(g.id, state.guest);
      confirming = false; burst(60);
      say(`${state.guest}님 고마워요! 꼬리 흔드는 중`, dogFor(g.room));
    } catch (e) {
      lastErr = e.message === 'taken' ? '방금 다른 분이 먼저 찜했어요. 다른 선물을 골라주세요.' : '저장하지 못했어요. 인터넷 연결을 확인하고 다시 눌러주세요.';
      confirming = false;
    }
    busy = false; renderGift();
  });
  on('unclaimBtn', async () => {
    busy = true; renderGift();
    try { await Store.unclaim(g.id); } catch (e) { lastErr = '취소하지 못했어요. 다시 눌러주세요.'; }
    busy = false; renderGift();
  });
  $('#giftSheet').querySelectorAll('[data-close]').forEach(b => b.onclick = closeSheets);
}

/* ---------- 선물 수첩 ---------- */
function renderNotebook() {
  const claimedN = GIFTS.filter(g => state.claims[g.id]).length;
  const rows = GIFTS.map(g => {
    const found = state.found.has(g.id);
    const c = state.claims[g.id];
    const room = roomById[g.room].name;
    if (!found) {
      return `<li><div class="nb-item locked"><span class="em">${g.emoji}</span><span class="t"><b>???</b><span>${esc(room)} 어딘가</span></span><span class="st">못 찾음</span></div></li>`;
    }
    const st = c ? (isMine(c) ? `<span class="st mine">내가 찜함</span>` : `<span class="st claimed">${esc(c.name)}</span>`) : `<span class="st">찜 가능</span>`;
    return `<li><button class="nb-item" data-gift="${g.id}"><span class="em">${g.emoji}</span><span class="t"><b>${esc(g.name)}</b><span>${esc(room)} · ${esc(g.price)}</span></span>${st}</button></li>`;
  }).join('');
  $('#nbSheet').innerHTML = `
    <div class="grip"></div>
    <div class="nb-head"><h2>선물 수첩</h2><span>찾음 ${state.found.size}/${GIFTS.length} · 찜 ${claimedN}</span></div>
    <ul class="nb-list">${rows}</ul>
    ${Store.mode === 'demo' ? '<p class="demo-note">체험 모드예요. 찜한 내용은 이 기기에만 저장돼요. ‘민지 (예시)’는 화면 예시입니다.</p>' : ''}`;
  $('#nbSheet').querySelectorAll('[data-gift]').forEach(b => b.onclick = () => { closeSheets(); setTimeout(() => openGift(b.dataset.gift), 180); });
}

/* ---------- 시트 열고 닫기 ---------- */
function showSheet(sel) {
  document.querySelectorAll('.sheet').forEach(s => s.classList.toggle('on', s.matches(sel)));
  $('#scrim').classList.add('on');
}
function closeSheets() {
  document.querySelectorAll('.sheet').forEach(s => s.classList.remove('on'));
  $('#scrim').classList.remove('on');
  openGiftId = null;
}

/* ---------- 화면 갱신 ---------- */
function refresh() {
  $('#foundN').textContent = state.found.size;
  $('#totalN').textContent = GIFTS.length;
  ROOMS.forEach(r => {
    const left = GIFTS.filter(g => g.room === r.id && !state.found.has(g.id)).length;
    const b = document.querySelector(`[data-badge="${r.id}"]`);
    if (b) b.style.display = left ? '' : 'none';
  });
  document.querySelectorAll('.spot').forEach(s => {
    const id = s.dataset.gift;
    s.classList.toggle('found', state.found.has(id));
    s.classList.toggle('claimed', !!state.claims[id]);
    s.setAttribute('aria-label', state.found.has(id) ? GIFTS.find(g => g.id === id).name : '반짝이는 것');
  });
  if (openGiftId) renderGift();
  if ($('#nbSheet').classList.contains('on')) renderNotebook();
}

/* ---------- 축하 효과 ---------- */
function burst(n) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const box = $('#confetti');
  const colors = ['#c9a46c', '#f1ede6', '#8d8780', '#e6e1da', '#5a3b2e'];
  for (let i = 0; i < n; i++) {
    const p = document.createElement('i');
    p.style.left = Math.random() * 100 + 'vw';
    p.style.background = colors[i % colors.length];
    p.style.setProperty('--x', (Math.random() * 120 - 60) + 'px');
    p.style.setProperty('--r', (Math.random() * 720 - 360) + 'deg');
    p.style.setProperty('--t', (1.1 + Math.random() * 0.9) + 's');
    p.style.animationDelay = (Math.random() * 0.25) + 's';
    box.appendChild(p);
    setTimeout(() => p.remove(), 2600);
  }
}

/* ---------- 입장 ---------- */
function enterHouse(name) {
  state.guest = name;
  ls('hw_guest', name);
  $('#door').classList.add('open');
  $('#intro').classList.add('gone');
  say(`${name}님 어서 오세요! 방을 눌러서 구경해 보세요. 반짝이는 걸 찾으면 선물이 나와요`, 'doria');
}

function start() {
  document.title = SITE.title;
  $('#siteTitle').textContent = SITE.title;
  $('#introTitle').textContent = SITE.title;
  $('#introSub').innerHTML = SITE.intro;
  $('#doorPlate').textContent = SITE.doorPlate;

  buildPlan();
  Store.onChange(refresh);
  Store.init();
  refresh();

  $('#backBtn').onclick = leaveRoom;
  $('#scrim').onclick = closeSheets;
  $('#countBtn').onclick = () => { renderNotebook(); showSheet('#nbSheet'); };
  $('#avatarBtn').onclick = () => giveHint(speaker === 'tube' ? 'doria' : 'tube');
  $('#artwork').addEventListener('click', (e) => {
    e.stopPropagation();
    if (state.room !== 'entry') { enterRoom('entry'); return; }
    say(pick(['현관 정면의 그림이에요! 들어오자마자 숲길이 보이게 걸었대요', '이 그림 앞에서 사진 찍으면 예쁘게 나와요 멍!', '카펫이랑 그림 덕분에 현관이 호텔 같죠?']), 'tube');
  });
  $('#duck').addEventListener('click', (e) => {
    e.stopPropagation();
    if (state.room !== 'bath1') { enterRoom('bath1'); return; }
    say(pick(['수건걸이의 노란 오리예요! 제 장난감 아니래요…', '꽉! 오리는 선물이 아니에요. 다른 데 찾아봐요']), 'doria');
  });
  $('#gate').addEventListener('click', (e) => {
    e.stopPropagation();
    if (state.room !== 'kitchen') { enterRoom('kitchen'); return; }
    say(pick(['이 문 너머 주방은 저희 출입금지 구역이에요…', '킁킁, 맛있는 냄새는 나는데 못 들어가요 ㅠㅠ']), 'tube');
  });
  const dogTap = (who) => (e) => { e.stopPropagation(); giveHint(who); };
  $('#dogTube').addEventListener('click', dogTap('tube'));
  $('#dogDoria').addEventListener('click', dogTap('doria'));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if ($('#scrim').classList.contains('on')) closeSheets(); else if (state.room) leaveRoom(); } });

  $('#enterForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const v = $('#guestName').value.trim();
    if (v) enterHouse(v);
  });

  if (state.guest) {
    $('#intro').classList.add('gone');
    say(`${state.guest}님 또 오셨네요! 아직 ${GIFTS.length - state.found.size}개 숨어 있어요`, 'tube');
  } else {
    say('방을 눌러서 들어가 보세요! 반짝이는 걸 누르면 선물이 나와요', 'doria');
  }
}
start();
</script>
</body>
</html>

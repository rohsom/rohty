<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>유씨네 집들이</title>
<meta name="description" content="유튜브와 유도리가 안내하는 우리 집 구경 · 미니게임으로 여는 위시리스트">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Gaegu:wght@700&display=swap">
<style>
/* Layout: one-screen app — header / hand-drawn room view / dog dock; cards and games rise as bottom sheets.
   Look: a sketchbook open on a warm desk — greige ground, cream paper, brass accent, one colour per dog. */
:root {
  color-scheme: light;
  --bg: #e9e2d4;          /* 책상 같은 배경 */
  --surface: #fffdf7;     /* 카드·시트 */
  --paper: #fcfaf4;       /* 그림이 놓이는 종이 */
  --line: #d6cdb9;
  --line-soft: #e6dfd0;
  --ink: #2b2620;
  --ink-2: #534c42;
  --muted: #7b7366;
  --brass: #a9762c;
  --brass-fill: #e7bd6e;
  --graphite: #33302b;
  --ok: #3f7d5c;
  --bad: #bd5740;
  --tube-bg: #fff0e3; --tube-line: #e0a274; --tube-ink: #8a4420;
  --doria-bg: #e7f2ea; --doria-line: #8cbd9c; --doria-ink: #2f6b47;
  --font-display: "Hahmlet", "Nanum Myeongjo", serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-dog: "Gaegu", "IBM Plex Sans KR", cursive;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.55 var(--font-body);
  overflow: hidden; -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-rows: auto 1fr auto auto; padding-inline: 16px; padding-top: env(safe-area-inset-top, 0px); }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 13px 9px; }
.brand { min-width: 0; }
.brand h1 { margin: 0; font: 700 20px/1.2 var(--font-display); letter-spacing: -0.01em; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }
.count {
  flex: none; display: flex; align-items: center; gap: 7px; padding: 8px 13px;
  border: 1.5px solid var(--brass); border-radius: 999px; background: var(--surface);
  color: var(--brass); font-variant-numeric: tabular-nums; font-size: 13px; font-weight: 600; cursor: pointer;
  box-shadow: 0 2px 0 rgba(169,118,44,.18);
}
.count svg { width: 16px; height: 16px; flex: none; }
.count b { font-weight: 700; }

/* ---------- the sketchbook stage ---------- */
.stage {
  position: relative; min-height: 0; border-radius: 16px; overflow: hidden;
  background: var(--paper);
  box-shadow: 0 0 0 1px var(--line), 0 14px 30px -20px rgba(70,58,38,.55);
  touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none;
}
.stage.grabbing { cursor: grabbing; }
.layer { position: absolute; left: 0; top: 0; transform-origin: 50% 50%; --k: 1; }
.layer img { display: block; width: 100%; height: 100%; }
.vignette { position: absolute; inset: 0; z-index: 2; pointer-events: none; box-shadow: inset 0 0 70px 10px rgba(110,98,76,.16); }

.hot { position: absolute; transform: translate(-50%, -50%); }
.go { display: grid; justify-items: center; gap: 4px; background: none; border: 0; padding: 4px; cursor: pointer; filter: drop-shadow(0 2px 5px rgba(80,72,58,.35)); }
.go .disc {
  width: calc(40px * var(--k)); height: calc(40px * var(--k)); border-radius: 50%; display: grid; place-items: center;
  background: var(--graphite); border: 2px solid #fffdf7; color: #fdf7e9;
  transition: background .18s ease; animation: bob 2.6s ease-in-out infinite;
}
.go .disc svg { width: 44%; height: 44%; }
.go:hover .disc, .go:focus-visible .disc { background: var(--brass); }
.go b { font-family: var(--font-body); font-weight: 700; font-size: calc(11.5px * var(--k)); color: #2b2620; background: rgba(255,253,247,.95); padding: 3px 8px; border-radius: 99px; white-space: nowrap; box-shadow: 0 1px 3px rgba(80,70,50,.2); }
.go.back .disc { width: calc(34px * var(--k)); height: calc(34px * var(--k)); background: #6f675c; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

.wish { background: none; border: 0; padding: 0; cursor: pointer; width: calc(48px * var(--k)); height: calc(48px * var(--k)); display: grid; place-items: center; }
.wish span {
  width: 100%; height: 100%; border-radius: 50%; display: grid; place-items: center;
  background: var(--brass-fill); border: 2.5px solid #fffdf7; color: #3b2a10;
  box-shadow: 0 4px 10px rgba(120,90,40,.35); animation: bob 3.4s ease-in-out infinite;
}
.wish span svg { width: 52%; height: 52%; }
.wish.claimed span { background: #7fb79a; color: #14341f; }

.dog { position: absolute; transform: translate(-50%, -100%); cursor: pointer; filter: drop-shadow(0 4px 6px rgba(90,82,66,.3)); --s: 1; }
.dog img { display: block; width: calc(104px * var(--k) * var(--s)); height: auto; animation: sniff 3.2s ease-in-out infinite; }
@keyframes sniff { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-2px) rotate(-1.5deg); } }

.chip {
  position: absolute; z-index: 3; top: 10px; display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 12px; border-radius: 999px; font-size: 13px; color: var(--ink);
  background: rgba(255,253,247,.94); border: 1px solid var(--line); box-shadow: 0 2px 6px rgba(80,70,50,.14);
}
.chip.place { left: 10px; font: 700 14px var(--font-display); }
.chip.place span { font: 500 11.5px var(--font-body); color: var(--muted); margin-left: 2px; }
.chip.rooms { right: 10px; cursor: pointer; font-weight: 600; }
.chip.zoom { right: 10px; top: auto; bottom: 12px; cursor: pointer; font-weight: 600; }
.chip svg { width: 14px; height: 14px; }
.howto {
  position: absolute; z-index: 3; left: 50%; top: 52px; transform: translateX(-50%);
  max-width: calc(100% - 24px); padding: 7px 13px; border-radius: 12px; font-size: 12.5px; text-align: center; color: var(--ink-2);
  background: rgba(255,253,247,.94); border: 1px solid var(--line); box-shadow: 0 2px 6px rgba(80,70,50,.14);
  transition: opacity .6s;
}
.howto.fade { opacity: 0; pointer-events: none; }

/* 아래 큰 버튼 — 지금 할 일 */
.cta {
  margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 9px;
  height: 56px; border-radius: 16px; border: 0; cursor: pointer;
  font-weight: 700; font-size: 16px; letter-spacing: -.01em;
  animation: rise .4s ease both;
}
.cta em { font-style: normal; font-size: 21px; line-height: 1; }
.cta.ghost { background: var(--surface); color: var(--ink-2); border: 1.5px solid var(--line); box-shadow: 0 3px 0 var(--line-soft); font-size: 14.5px; }
.cta.ghost em { font-size: 17px; }
.cta.game { background: var(--graphite); color: #fdf7e9; box-shadow: 0 6px 0 #1f1d19, 0 12px 22px -12px rgba(40,34,26,.7); }
.cta.game:active { transform: translateY(3px); box-shadow: 0 3px 0 #1f1d19, 0 8px 16px -12px rgba(40,34,26,.7); }
.cta.gold {
  background: linear-gradient(180deg, #f0cb84, #d9a550); color: #3b2a10;
  box-shadow: 0 6px 0 #ad7f33, 0 12px 24px -12px rgba(140,100,30,.75);
  animation: rise .4s ease both, glow 2.2s ease-in-out .5s infinite;
}
.cta.gold:active { transform: translateY(3px); box-shadow: 0 3px 0 #ad7f33; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes glow { 0%, 100% { filter: brightness(1); } 55% { filter: brightness(1.09); } }

/* dock — 강아지 말풍선 */
.dock { display: flex; align-items: stretch; gap: 10px; padding-block: 10px calc(14px + env(safe-area-inset-bottom, 0px)); }
.avatar {
  flex: none; width: 52px; height: 52px; align-self: end; border-radius: 50%; background: var(--surface);
  border: 2.5px solid var(--line); overflow: hidden; cursor: pointer; padding: 0;
  box-shadow: 0 3px 8px rgba(80,70,50,.2);
}
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.avatar[data-who="tube"] { border-color: var(--tube-line); }
.avatar[data-who="doria"] { border-color: var(--doria-line); }
.bubble {
  position: relative; flex: 1; min-width: 0; align-self: end;
  background: var(--b-bg, var(--surface)); color: var(--b-ink, var(--ink));
  border: 2px solid var(--b-line, var(--line));
  border-radius: 16px 16px 16px 5px; padding: 9px 14px 10px;
  font: 700 18px/1.35 var(--font-dog); min-height: 52px; display: flex; align-items: center;
  box-shadow: 0 3px 10px rgba(80,70,50,.14);
}
.bubble[data-who="tube"] { --b-bg: var(--tube-bg); --b-line: var(--tube-line); --b-ink: var(--tube-ink); }
.bubble[data-who="doria"] { --b-bg: var(--doria-bg); --b-line: var(--doria-line); --b-ink: var(--doria-ink); }
.bubble small { display: block; font: 700 11px var(--font-body); letter-spacing: .04em; opacity: .75; margin-bottom: 1px; }

/* sheets */
.scrim { position: fixed; inset: 0; background: rgba(52,44,32,.45); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 10; }
.scrim.on { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; max-height: 88%; overflow-y: auto;
  background: var(--surface); border-top: 1px solid var(--line); border-radius: 22px 22px 0 0;
  padding: 10px 20px calc(22px + env(safe-area-inset-bottom, 0px));
  transform: translateY(105%); transition: transform .32s cubic-bezier(.2,.8,.2,1);
  max-width: 560px; margin: 0 auto; box-shadow: 0 -16px 44px -26px rgba(60,48,30,.8);
}
.sheet.on { transform: none; }
.grip { width: 38px; height: 4px; border-radius: 4px; background: var(--line); margin: 0 auto 14px; }
.eyebrow { font-size: 11.5px; letter-spacing: .08em; color: var(--brass); font-weight: 700; }
.sheet h2 { margin: 4px 0 0; font: 700 21px/1.25 var(--font-display); text-wrap: balance; }
.lede { color: var(--muted); font-size: 13.5px; margin: 6px 0 0; }

.gift-hero { display: flex; gap: 14px; align-items: center; margin-top: 8px; }
.gift-emoji { flex: none; width: 64px; height: 64px; border-radius: 18px; background: #f6f0e2; border: 1px solid var(--line-soft); display: grid; place-items: center; font-size: 34px; }
.price { color: var(--muted); font-size: 13.5px; margin-top: 3px; font-variant-numeric: tabular-nums; }
.note { margin: 16px 0 0; padding: 13px 15px; background: var(--doria-bg); border: 1.5px solid var(--doria-line); border-radius: 12px; font: 700 17px/1.4 var(--font-dog); color: var(--doria-ink); }
.note small { display: block; font: 600 11.5px var(--font-body); color: var(--muted); margin-top: 5px; }
.link { display: inline-block; margin-top: 12px; color: var(--brass); font-size: 13.5px; font-weight: 600; }
.actions { display: grid; gap: 8px; margin-top: 18px; }
.btn { height: 52px; border-radius: 14px; border: 0; font-weight: 700; font-size: 15.5px; cursor: pointer; }
.btn-primary { background: linear-gradient(180deg, #f0cb84, #d9a550); color: #3b2a10; box-shadow: 0 4px 0 #ad7f33; }
.btn-primary:active { transform: translateY(2px); box-shadow: 0 2px 0 #ad7f33; }
.btn-ghost { background: var(--surface); border: 1.5px solid var(--line); color: var(--ink-2); }
.btn[disabled] { opacity: .55; cursor: default; }
.status { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: #f8f4ea; font-size: 14px; }
.status .dot { flex: none; width: 9px; height: 9px; border-radius: 50%; background: var(--ok); }
.status.mine { border-color: var(--brass); background: #fdf3df; }
.status.mine .dot { background: var(--brass); }
.confirm-q { font-size: 14.5px; margin: 0 0 2px; }
.err { color: var(--bad); font-size: 13px; margin-top: 8px; font-weight: 600; }

.nb-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.nb-head h2 { margin: 0; }
.nb-head span { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.nb-list { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 1px; background: var(--line-soft); border: 1px solid var(--line-soft); border-radius: 14px; overflow: hidden; }
.nb-list li { background: var(--surface); }
.nb-item { width: 100%; display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; padding: 12px; background: none; border: 0; text-align: left; cursor: pointer; }
.nb-item .em { font-size: 24px; text-align: center; }
.nb-item .t { min-width: 0; }
.nb-item .t b { display: block; font-weight: 700; font-size: 14.5px; }
.nb-item .t span { color: var(--muted); font-size: 12.5px; }
.nb-item .st { font-size: 12px; color: var(--muted); text-align: right; white-space: nowrap; font-weight: 600; }
.nb-item .st.claimed { color: var(--ok); }
.nb-item .st.mine { color: var(--brass); }
.nb-item.locked { cursor: pointer; background: #f7f2e7; }
.nb-item.locked .em { opacity: .5; filter: grayscale(1); }
.nb-item.locked b { color: var(--muted); letter-spacing: .1em; }
.demo-note { margin-top: 14px; font-size: 12px; color: var(--muted); }
.room-grid { list-style: none; margin: 14px 0 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.room-btn { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: #faf6ec; text-align: left; cursor: pointer; }
.room-btn b { display: block; font-weight: 700; }
.room-btn span { font-size: 12px; color: var(--muted); }
.room-btn.here { border-color: var(--brass); background: #fdf3df; }
.room-btn.done span { color: var(--ok); font-weight: 600; }

/* ---------- mini games ---------- */
.game-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.hearts { font-size: 19px; color: #d4584a; letter-spacing: 2px; white-space: nowrap; flex: none; }
.hearts i { color: #e0d6c2; font-style: normal; }
.score { margin-top: 11px; display: inline-block; padding: 6px 13px; border-radius: 999px; background: #f6f0e2; border: 1px solid var(--line-soft); color: var(--ink-2); font-size: 13px; font-variant-numeric: tabular-nums; }
.score b { color: var(--brass); font-weight: 700; }
.board { margin-top: 14px; }

.panels { display: grid; gap: 8px; }
.pic { position: relative; border-radius: 12px; overflow: hidden; background: var(--paper); border: 1px solid var(--line); cursor: crosshair; }
.pic img, .picimg { display: block; width: 100%; height: auto; }
.pic .lab { position: absolute; left: 8px; top: 8px; z-index: 3; font: 700 11px var(--font-body); color: #5c5446; background: rgba(255,253,247,.92); border: 1px solid var(--line); border-radius: 99px; padding: 2px 9px; }
.marks { position: absolute; inset: 0; pointer-events: none; }
.found { position: absolute; transform: translate(-50%, -50%); aspect-ratio: 1; border: 3px solid #c0544a; border-radius: 50%; box-shadow: 0 0 0 2px rgba(255,255,255,.75); animation: ring .4s ease both; }
@keyframes ring { from { transform: translate(-50%, -50%) scale(.4); opacity: 0 } to { transform: translate(-50%, -50%) scale(1); opacity: 1 } }
.missx { position: absolute; transform: translate(-50%, -50%); width: 28px; height: 28px; border-radius: 50%; border: 2px dashed #9a9388; animation: fadeout .7s ease forwards; }
@keyframes fadeout { to { opacity: 0; transform: translate(-50%, -50%) scale(1.5); } }

.hintwrap { display: flex; align-items: center; gap: 14px; margin-bottom: 11px; }
.hintwrap canvas { width: 108px; height: 108px; flex: none; border-radius: 12px; border: 2.5px solid var(--brass); background: var(--paper); box-shadow: 0 5px 14px rgba(120,90,40,.28); }
.hintwrap span { font: 700 17px/1.35 var(--font-dog); color: var(--ink-2); }

.cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.card { position: relative; aspect-ratio: 3/4; border-radius: 10px; border: 1.5px solid #c9b995; background: linear-gradient(140deg, #efe3c9, #e2d3b2); font-size: 25px; display: grid; place-items: center; cursor: pointer; transition: background .2s; }
.card::after { content: "🐾"; position: absolute; inset: 0; display: grid; place-items: center; font-size: 18px; opacity: .55; transition: opacity .12s; }
.card.up::after, .card.done::after { opacity: 0; }
.card .f { opacity: 0; transition: opacity .12s; }
.card.up, .card.done { background: var(--surface); border-color: var(--line); }
.card.up .f, .card.done .f { opacity: 1; }
.card.done { opacity: .5; cursor: default; }

.quiz-q { margin: 0 0 12px; font: 700 18px/1.4 var(--font-display); text-wrap: balance; }
.opts { display: grid; gap: 8px; }
.opt { padding: 15px 16px; border-radius: 12px; border: 1.5px solid var(--line); background: #faf6ec; text-align: left; cursor: pointer; font-size: 15px; font-weight: 500; }
.opt.wrong { border-color: var(--bad); color: var(--bad); animation: shake .34s; }
.opt.right { border-color: var(--ok); color: var(--ok); background: #eef6f0; }
@keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)} }

.puz { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 4px; aspect-ratio: var(--ar, 1); }
.tile { border-radius: 6px; border: 1.5px solid var(--line); background-size: 300% 300%; background-color: var(--paper); cursor: pointer; }
.tile.sel { outline: 3px solid var(--brass); outline-offset: -3px; }
.tile.ok { border-color: #a8cdb6; }
.puz-ref { display: flex; align-items: center; gap: 10px; margin-top: 12px; color: var(--muted); font-size: 12.5px; }
.puz-ref img { width: 54px; border-radius: 6px; border: 1px solid var(--line); }

.won { text-align: center; padding: 6px 0 0; }
.won .big { font-size: 46px; }
.won .stars { font-size: 27px; color: #d9a550; letter-spacing: 5px; margin-top: 4px; }
.won h2 { margin: 6px 0 0; }
.won p { color: var(--ink-2); font-size: 14.5px; margin: 8px 0 0; }

/* ---------- invitation ---------- */
.env { perspective: 900px; margin: 16px auto 0; width: 100%; max-width: 320px; }
.env-body { position: relative; aspect-ratio: 3/2; border-radius: 10px; background: #efe7d6; box-shadow: 0 14px 30px -18px rgba(60,48,30,.8); overflow: hidden; border: 1px solid var(--line); }
.env-body::after { content: ""; position: absolute; inset: 0; background: linear-gradient(160deg, rgba(255,255,255,.4), rgba(0,0,0,.05)); }
.flap { position: absolute; left: 0; right: 0; top: 0; height: 56%; background: #e4d9c2; clip-path: polygon(0 0, 100% 0, 50% 100%); transform-origin: top center; transition: transform .7s cubic-bezier(.4,0,.2,1); z-index: 2; }
.env.open .flap { transform: rotateX(-172deg); }
.seal { position: absolute; left: 50%; top: 44%; transform: translate(-50%, -50%); width: 46px; height: 46px; border-radius: 50%; background: #a8503f; color: #ffe9d9; display: grid; place-items: center; font: 700 17px var(--font-display); z-index: 3; box-shadow: 0 3px 8px rgba(0,0,0,.3); transition: opacity .3s; }
.env.open .seal { opacity: 0; }
.card-invite {
  background: #fffcf2; color: #2b2721; border-radius: 12px; padding: 20px 18px; margin-top: 16px;
  box-shadow: 0 16px 36px -22px rgba(60,48,30,.8); border: 1px solid #e6ddc8;
  animation: cardIn .6s cubic-bezier(.2,.8,.3,1) both;
}
@keyframes cardIn { from { opacity: 0; transform: translateY(26px) rotate(-1.5deg); } to { opacity: 1; transform: none; } }
.card-invite .to { font: 700 25px/1.2 var(--font-dog); }
.card-invite .msg { font: 700 18px/1.55 var(--font-dog); margin-top: 10px; color: #4a443b; }
.card-invite .rule { height: 1px; background: #e2d9c4; margin: 16px 0; }
.coupon { display: flex; gap: 12px; align-items: center; padding: 13px; border: 2px dashed #c49a5c; border-radius: 10px; background: #fff8e6; }
.coupon .e { font-size: 32px; flex: none; }
.coupon b { display: block; font-size: 15px; }
.coupon span { font-size: 12.5px; color: #6f6859; }
.card-invite .sign { margin-top: 14px; text-align: right; font: 700 16px var(--font-dog); color: #4a443b; }

/* ---------- intro / knock ---------- */
.intro {
  position: fixed; inset: 0; z-index: 20; background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  padding: calc(20px + env(safe-area-inset-top, 0px)) 16px calc(20px + env(safe-area-inset-bottom, 0px));
  overflow: auto; transition: opacity .5s .4s, visibility 0s .9s;
}
.intro.gone { opacity: 0; visibility: hidden; }
.intro-inner { margin: auto; width: 100%; max-width: 360px; display: grid; gap: 18px; text-align: center; }
.intro-inner > * { max-width: 100%; min-width: 0; }
.door-wrap { justify-self: center; }

.door .lock { position: absolute; right: 12px; top: 46%; width: 13px; height: 34px; border-radius: 3px; background: #1d1d1d; box-shadow: inset 0 0 0 1px #444; }

.door .handle { position: absolute; right: 6px; top: 58%; width: 22px; height: 4px; border-radius: 2px; background: #b9b4ad; }

.door .banner { position: absolute; left: 50%; top: 48px; transform: translateX(-50%); width: 30px; }

.door .banner span { display: grid; place-items: center; width: 30px; height: 38px; background: #f2eee6; border-top: 2px solid #b48d5c; color: #c98a8a; font-size: 13px; }
.door.open { transform: rotateY(-78deg); }
.knockmark { position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%); font: 700 22px var(--font-dog); color: var(--brass); pointer-events: none; animation: pop .7s ease forwards; }

.greeters img { width: 104px; height: auto; animation: hop .6s cubic-bezier(.2,.9,.3,1.3) both; filter: drop-shadow(0 4px 6px rgba(90,82,66,.3)); }

const $ = (s) => document.querySelector(s);
function ls(key, val) {
  try {
    if (val === undefined) return JSON.parse(localStorage.getItem(key));
    localStorage.setItem(key, JSON.stringify(val));
  } catch (e) { return null; }
}
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const hash = (s) => { let h = 0; for (const c of String(s)) h = (h * 31 + c.codePointAt(0)) >>> 0; return h; };

const state = {
  guest: ls('hw2_guest') || null,
  guestId: ls('hw2_gid') || (Math.random().toString(36).slice(2) + Date.now().toString(36)),
  cleared: new Set(ls('hw2_cleared') || []),
  stars: ls('hw2_stars') || {},
  thanked: !!ls('hw2_thanked'),
  cueReady: false,
  claims: {},
  scene: FIRST_SCENE,
};
ls('hw2_gid', state.guestId);
const curRoom = () => SCENES[state.scene].room;
const giftRoom = (g) => SCENES[g.scene].room;
const openGifts = () => GIFTS.filter(g => state.cleared.has(giftRoom(g)));

/* ---------- 저장소: 체험 모드(localStorage) / 실서비스(Firebase) ---------- */
const Store = {
  mode: 'demo', uid: state.guestId, listeners: [],
  onChange(fn) { this.listeners.push(fn); },
  emit() { this.listeners.forEach(fn => fn()); },
  async init() {
    if (FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey) {
      try { await this.initLive(); return; } catch (e) { console.warn('Firebase 연결 실패, 체험 모드로 전환', e); }
    }
    this.initDemo();
  },
  initDemo() {
    this.mode = 'demo';
    let c = ls('hw2_claims');
    if (!c) { c = { glasses: { name: '민지 (예시)', uid: 'example', at: Date.now() } }; ls('hw2_claims', c); }
    state.claims = c;
    window.addEventListener('storage', (e) => { if (e.key === 'hw2_claims') { state.claims = ls('hw2_claims') || {}; this.emit(); } });
    this.emit();
  },
  async initLive() {
    const base = 'https://www.gstatic.com/firebasejs/10.12.2/';
    const [appMod, fs, authMod] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-firestore.js'), import(base + 'firebase-auth.js')]);
    const app = appMod.initializeApp(FIREBASE_CONFIG);
    const db = fs.getFirestore(app);
    const cred = await authMod.signInAnonymously(authMod.getAuth(app));
    this.uid = cred.user.uid; this.mode = 'live';
    fs.onSnapshot(fs.collection(db, 'claims'), (snap) => { const c = {}; snap.forEach(d => { c[d.id] = d.data(); }); state.claims = c; this.emit(); });
    this.claim = (gid, name) => fs.runTransaction(db, async (tx) => {
      const ref = fs.doc(db, 'claims', gid); const s = await tx.get(ref);
      if (s.exists()) throw new Error('taken');
      tx.set(ref, { name, uid: this.uid, at: fs.serverTimestamp() });
    });
    this.unclaim = (gid) => fs.deleteDoc(fs.doc(db, 'claims', gid));
  },
  async claim(gid, name) {
    const c = ls('hw2_claims') || {}; if (c[gid]) throw new Error('taken');
    c[gid] = { name, uid: this.uid, at: Date.now() }; ls('hw2_claims', c); state.claims = c; this.emit();
  },
  async unclaim(gid) { const c = ls('hw2_claims') || {}; delete c[gid]; ls('hw2_claims', c); state.claims = c; this.emit(); },
};
const isMine = (c) => c && c.uid === Store.uid;

/* ---------- 장면 그리기 ---------- */
const stage = $('#stage');
let layer = null, natural = { w: 4, h: 3 };
let pan = { x: 0, y: 0 }, maxPan = { x: 0, y: 0 }, zoom = 1;
const MAX_ZOOM = 2.8;

const svgArrow = (back) => back
  ? `<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v10M10 17l-5-6M10 17l5-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`
  : `<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 17V7M10 3l-5 6M10 3l5 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const svgGiftTag = () => `<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="6.5" width="11" height="7" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M1.5 6.5h13M8 6.5v7M8 6.5C6.2 3 4 3.8 5.3 5.6 6.2 6.4 8 6.5 8 6.5zm0 0c1.8-3.5 4-2.7 2.7-.9C9.8 6.4 8 6.5 8 6.5z" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>`;

function buildScene(id) {
  const sc = SCENES[id];
  const el = document.createElement('div');
  el.className = 'layer';
  el.innerHTML = `<img alt="${esc(ROOM_NAMES[sc.room])} 그림" draggable="false" src="${sc.img}">`;

  (sc.exits || []).forEach(([to, label, x, y, kind]) => {
    const back = kind === 'back';
    const h = document.createElement('div');
    h.className = 'hot';
    h.style.cssText = `left:${x}%;top:${y}%`;
    h.innerHTML = `<button class="go${back ? ' back' : ''}" type="button"><span class="disc">${svgArrow(back)}</span><b>${esc(label)}</b></button>`;
    h.querySelector('button').addEventListener('click', (e) => { e.stopPropagation(); goScene(to); });
    el.appendChild(h);
  });

  GIFTS.filter(g => g.scene === id && state.cleared.has(giftRoom(g))).forEach(g => {
    const h = document.createElement('div');
    h.className = 'hot';
    h.style.cssText = `left:${g.x}%;top:${g.y}%`;
    h.innerHTML = `<button class="wish" type="button" data-gift="${g.id}" aria-label="${esc(g.name)}"><span>${svgGiftTag()}</span></button>`;
    h.querySelector('button').addEventListener('click', (e) => { e.stopPropagation(); openGift(g.id); });
    el.appendChild(h);
  });

  (sc.dogs || []).forEach(([who, x, y, s]) => {
    const d = DOGS[who];
    const h = document.createElement('div');
    h.className = 'dog';
    h.style.cssText = `left:${x}%;top:${y}%;--s:${s || 1}`;
    h.innerHTML = `<img src="${d.img}" alt="${d.name}에게 말 걸기" draggable="false">`;
    h.addEventListener('click', (e) => { e.stopPropagation(); dogTalk(who); });
    el.appendChild(h);
  });
  return el;
}

/* 그림 전체가 보이도록 맞추고(=확대 1배), 확대하면 그만큼 끌어서 볼 수 있게 합니다 */
function fitLayer(el) {
  const W = stage.clientWidth, H = stage.clientHeight;
  if (!W || !H) return;
  const contain = Math.min(W / natural.w, H / natural.h);
  const cover = Math.max(W / natural.w, H / natural.h);
  const base = contain * Math.min(cover / contain, 1.45);
  const w = natural.w * base * zoom, h = natural.h * base * zoom;
  el.style.width = w + 'px'; el.style.height = h + 'px';
  el.style.left = ((W - w) / 2) + 'px'; el.style.top = ((H - h) / 2) + 'px';
  el.style.setProperty('--k', Math.max(.6, Math.min(1.25, w / 430)).toFixed(3));
  maxPan.x = Math.max(0, (w - W) / 2); maxPan.y = Math.max(0, (h - H) / 2);
  pan.x = Math.max(-maxPan.x, Math.min(maxPan.x, pan.x));
  pan.y = Math.max(-maxPan.y, Math.min(maxPan.y, pan.y));
  applyPan();
}
function applyPan() { if (layer) layer.style.transform = `translate(${pan.x}px, ${pan.y}px)`; }
function setZoom(z, anchor) {
  const was = zoom;
  zoom = Math.max(1, Math.min(MAX_ZOOM, z));
  if (zoom === was) return;
  const r = zoom / was;
  if (anchor) {
    const cx = anchor.x - stage.clientWidth / 2, cy = anchor.y - stage.clientHeight / 2;
    pan.x = (pan.x - cx) * r + cx; pan.y = (pan.y - cy) * r + cy;
  } else { pan.x *= r; pan.y *= r; }
  if (layer) {
    layer.style.transition = 'width .3s ease, height .3s ease, left .3s ease, top .3s ease, transform .3s ease';
    fitLayer(layer);
    setTimeout(() => { if (layer) layer.style.transition = 'none'; }, 320);
  }
  $('#zoomBtn').hidden = zoom <= 1;
}

function showScene(id, dir) {
  const old = layer;
  const el = buildScene(id);
  el.style.opacity = '0';
  el.style.transform = `scale(${dir === 'back' ? 1.06 : 0.94})`;
  stage.appendChild(el);
  const img = el.querySelector('img');
  const go = () => {
    natural = { w: img.naturalWidth || 4, h: img.naturalHeight || 3 };
    pan = { x: 0, y: 0 }; zoom = 1; $('#zoomBtn').hidden = true;
    layer = el;
    fitLayer(el);
    requestAnimationFrame(() => {
      el.style.transition = 'opacity .5s ease, transform .5s cubic-bezier(.2,.75,.3,1)';
      el.style.opacity = '1';
      applyPan();
    });
    if (old) {
      old.style.transition = 'opacity .4s ease, transform .4s ease';
      old.style.opacity = '0';
      old.style.transform += ` scale(${dir === 'back' ? 0.94 : 1.07})`;
      setTimeout(() => old.remove(), 440);
    }
    preload(id);
  };
  if (img.complete && img.naturalWidth) go(); else { img.onload = go; img.onerror = go; }
}

const preloaded = new Set();
function preload(id) {
  (SCENES[id].exits || []).forEach(([to]) => {
    if (preloaded.has(to)) return;
    preloaded.add(to);
    const i = new Image(); i.src = SCENES[to].img;
  });
}

function goScene(id, opt = {}) {
  if (!SCENES[id] || id === state.scene) return;
  const back = (SCENES[state.scene].exits || []).some(([to, , , , kind]) => to === id && kind === 'back');
  const prevRoom = curRoom();
  state.scene = id;
  showScene(id, back ? 'back' : 'fwd');
  updateChip();
  updateCta();
  $('#howto').classList.add('fade');
  if (!opt.silent) announce(prevRoom);
}
function updateChip() {
  const sc = SCENES[state.scene];
  $('#placeChip').innerHTML = `${esc(ROOM_NAMES[sc.room])}${sc.sub ? ` <span>${esc(sc.sub)}</span>` : ''}`;
}
function announce(prevRoom) {
  const room = curRoom();
  if (room === prevRoom) return;
  const who = dogFor(room);
  if (state.cleared.has(room)) {
    const n = GIFTS.filter(g => giftRoom(g) === room).length;
    say(n ? `${ROOM_NAMES[room]}은 이미 열었어요. 위시리스트 ${n}개가 놓여 있어요` : `${ROOM_NAMES[room]}은 다 보셨어요!`, who);
  } else {
    const g = GAMES[room];
    say(g ? `${ROOM_NAMES[room]}에 도착! ‘${g.title}’을 깨면 위시리스트가 열려요` : `${ROOM_NAMES[room]}이에요. 편하게 둘러보세요`, who);
  }
}

/* 아래쪽 큰 버튼: 초대장 → 미니게임 → 완료 */
function updateCta() {
  const b = $('#ctaBtn');
  if (!state.guest) { b.hidden = true; return; }
  if (!state.thanked && !state.cueReady) { b.hidden = true; return; }
  if (!state.thanked) {
    b.hidden = false; b.className = 'cta gold';
    b.innerHTML = '<em>💌</em> 초대장 열어보기';
    b.onclick = openInvite;
    return;
  }
  const room = curRoom();
  const g = GAMES[room];
  if (g && !state.cleared.has(room)) {
    b.hidden = false; b.className = 'cta game';
    b.innerHTML = `<em>🎮</em> ${esc(ROOM_NAMES[room])} 미니게임`;
    b.onclick = () => openGame(room);
  } else if (g) {
    const st = state.stars[room] || 0;
    b.hidden = false; b.className = 'cta ghost';
    b.innerHTML = `<em>${st >= 3 ? '🏆' : '⭐'}</em> ${esc(ROOM_NAMES[room])} ${starStr(st)} ${st >= 3 ? '· 한 판 더' : '· 기록 깨기'}`;
    b.onclick = () => openGame(room);
  } else {
    b.hidden = true;
  }
}

/* ---------- 확대해서 둘러보기 ---------- */
function setupDrag() {
  const pts = new Map();
  let drag = null, pinch = null, lastTap = 0;
  const rel = (e) => { const r = stage.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  stage.addEventListener('pointerdown', (e) => {
    if (e.target.closest('button')) return;
    pts.set(e.pointerId, e);
    try { stage.setPointerCapture(e.pointerId); } catch (err) {}
    if (pts.size === 2) {
      const [a, b] = [...pts.values()];
      pinch = { d: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY), z: zoom };
      drag = null;
    } else if (pts.size === 1) {
      drag = { x: e.clientX, y: e.clientY, px: pan.x, py: pan.y, moved: false };
      stage.classList.add('grabbing');
    }
  });
  stage.addEventListener('pointermove', (e) => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, e);
    if (pinch && pts.size === 2) {
      const [a, b] = [...pts.values()];
      const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
      zoom = Math.max(1, Math.min(MAX_ZOOM, pinch.z * (d / pinch.d)));
      if (layer) { layer.style.transition = 'none'; fitLayer(layer); }
      $('#zoomBtn').hidden = zoom <= 1;
      $('#howto').classList.add('fade');
      return;
    }
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.moved && Math.hypot(dx, dy) > 6) { drag.moved = true; $('#howto').classList.add('fade'); }
    if (!drag.moved) return;
    if (layer) layer.style.transition = 'none';
    pan.x = Math.max(-maxPan.x, Math.min(maxPan.x, drag.px + dx));
    pan.y = Math.max(-maxPan.y, Math.min(maxPan.y, drag.py + dy));
    applyPan();
  });
  const end = (e) => {
    pts.delete(e.pointerId);
    if (pts.size < 2) pinch = null;
    if (drag && !drag.moved && !e.target.closest('button')) {
      const now = Date.now();
      if (now - lastTap < 320) { setZoom(zoom > 1.2 ? 1 : 2, rel(e)); lastTap = 0; }
      else lastTap = now;
    }
    drag = null; stage.classList.remove('grabbing');
  };
  stage.addEventListener('pointerup', end);
  stage.addEventListener('pointercancel', end);
  stage.addEventListener('wheel', (e) => { e.preventDefault(); setZoom(zoom * (e.deltaY < 0 ? 1.18 : 1 / 1.18), rel(e)); }, { passive: false });
  new ResizeObserver(() => { if (layer) fitLayer(layer); }).observe(stage);
}

/* ================================================================
   미니게임 — 하트 3개, 별 3개가 걸린 한 판
   ================================================================ */
let game = null;
const imgCache = {};
function loadImg(src) {
  return new Promise((res, rej) => {
    if (imgCache[src]) return res(imgCache[src]);
    const i = new Image();
    i.onload = () => { imgCache[src] = i; res(i); };
    i.onerror = rej;
    i.src = src;
  });
}
/* 그림에서 '디테일이 많은 곳'을 골라줍니다 — 빈 벽이 아니라 물건 위에 문제가 나도록 */
function gridCells(gx, gy) {
  const out = [];
  for (let j = 0; j < gy; j++) for (let i = 0; i < gx; i++)
    out.push({ cx: (i + 0.5) / gx, cy: (j + 0.5) / gy, score: Math.random() });
  return out.sort((a, b) => b.score - a.score);
}
function detailCells(img, gx, gy) {
  try { return detailCellsPx(img, gx, gy); } catch (e) { return gridCells(gx, gy); }
}
function detailCellsPx(img, gx, gy) {
  const W = 180, H = Math.max(2, Math.round(180 * img.naturalHeight / img.naturalWidth));
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d', { willReadFrequently: true });
  g.drawImage(img, 0, 0, W, H);
  const d = g.getImageData(0, 0, W, H).data;
  const cw = W / gx, ch = H / gy, out = [];
  for (let j = 0; j < gy; j++) for (let i = 0; i < gx; i++) {
    let sum = 0, sum2 = 0, n = 0;
    for (let y = Math.floor(j * ch); y < Math.floor((j + 1) * ch); y++)
      for (let x = Math.floor(i * cw); x < Math.floor((i + 1) * cw); x++) {
        const k = (y * W + x) * 4, v = 0.299 * d[k] + 0.587 * d[k + 1] + 0.114 * d[k + 2];
        sum += v; sum2 += v * v; n++;
      }
    const mean = sum / n;
    out.push({ cx: (i + 0.5) / gx, cy: (j + 0.5) / gy, score: Math.max(0, sum2 / n - mean * mean) });
  }
  return out.sort((a, b) => b.score - a.score);
}
function spreadPicks(cells, n, minDist, margin) {
  const picks = [];
  for (const c of cells) {
    if (picks.length >= n) break;
    if (c.cx < margin || c.cx > 1 - margin || c.cy < margin || c.cy > 1 - margin) continue;
    if (picks.some(p => Math.hypot(p.cx - c.cx, p.cy - c.cy) < minDist)) continue;
    picks.push(c);
  }
  return picks;
}

function openGame(room) {
  const def = GAMES[room];
  if (!def) return;
  game = { room, def, hearts: 3, moves: 0, t0: Date.now() };
  showSheet('#gameSheet');
  renderGame();
}
const heartsHtml = () => `<span class="hearts">${'♥'.repeat(game.hearts)}<i>${'♥'.repeat(3 - game.hearts)}</i></span>`;
function gameHead(score) {
  const g = game.def;
  return `<div class="grip"></div>
    <div class="eyebrow">${esc(ROOM_NAMES[game.room])} 미니게임</div>
    <div class="game-top"><h2>${esc(g.title)}</h2>${heartsHtml()}</div>
    <p class="lede">${esc(g.lede)}</p>
    ${score ? `<div class="score" id="score">${score}</div>` : ''}`;
}
const gameFoot = () => `<div class="actions"><button class="btn btn-ghost" data-close>나중에 할게요</button></div>`;
function wireFoot() { $('#gameSheet').querySelectorAll('[data-close]').forEach(b => b.onclick = closeSheets); }
function loading() {
  $('#gameSheet').innerHTML = gameHead() + `<p class="lede" style="margin-top:22px">그림 준비 중…</p>`;
}
function renderGame() {
  const t = game.def.type;
  if (t === 'spot') renderSpot();
  else if (t === 'detail') renderDetail();
  else if (t === 'memory') renderMemory();
  else if (t === 'quiz') renderQuiz();
  else if (t === 'puzzle') renderPuzzle();
}
function loseHeart(msg) {
  game.hearts--;
  const h = $('#gameSheet').querySelector('.hearts');
  if (h) { h.outerHTML = heartsHtml(); }
  if (game.hearts <= 0) { setTimeout(failGame, 420); return true; }
  if (msg) say(msg, dogFor(game.room));
  return false;
}
function failGame() {
  $('#gameSheet').innerHTML = `
    <div class="grip"></div>
    <div class="won">
      <div class="big">🐾</div>
      <h2>아깝다! 기회를 다 썼어요</h2>
      <p>${esc(DOGS[dogFor(game.room)].name)}가 다시 섞어줄게요. 한 판 더 가시죠!</p>
    </div>
    <div class="actions">
      <button class="btn btn-primary" id="retry">다시 도전</button>
      <button class="btn btn-ghost" data-close>나중에 할게요</button>
    </div>`;
  $('#retry').onclick = () => openGame(game.room);
  wireFoot();
  say(pick(['괜찮아요, 저도 열 번은 틀렸어요', '한 판만 더요! 이번엔 느낌이 와요']), dogFor(game.room));
}

/* ---------- 틀린 그림 찾기 ---------- */
/* 종이(흰 부분)는 그대로 두고 연필선만 얹습니다 */
function inkPatch(g, src, sx, sy, sw, sh, dx, dy, dw, dh, flip, alpha) {
  const t = document.createElement('canvas'); t.width = dw; t.height = dh;
  const tg = t.getContext('2d');
  if (flip) { tg.translate(dw, 0); tg.scale(-1, 1); }
  tg.drawImage(src, sx, sy, sw, sh, 0, 0, dw, dh);
  tg.setTransform(1, 0, 0, 1, 0, 0);
  tg.globalCompositeOperation = 'destination-in';
  const grd = tg.createRadialGradient(dw / 2, dh / 2, dw * 0.08, dw / 2, dh / 2, dw / 2);
  grd.addColorStop(0, 'rgba(0,0,0,1)'); grd.addColorStop(.7, 'rgba(0,0,0,1)'); grd.addColorStop(1, 'rgba(0,0,0,0)');
  tg.fillStyle = grd; tg.fillRect(0, 0, dw, dh);
  g.save(); g.globalCompositeOperation = 'multiply'; if (alpha != null) g.globalAlpha = alpha; g.drawImage(t, dx, dy); g.restore();
}
/* 그 자리의 선을 종이색으로 지웁니다 */
function wipe(g, cx, cy, r) {
  const grd = g.createRadialGradient(cx, cy, r * 0.1, cx, cy, r);
  grd.addColorStop(0, 'rgba(252,251,247,1)');
  grd.addColorStop(.68, 'rgba(252,251,247,1)');
  grd.addColorStop(1, 'rgba(252,251,247,0)');
  g.save(); g.fillStyle = grd; g.beginPath(); g.arc(cx, cy, r, 0, 7); g.fill(); g.restore();
}
function regionDiff(ga, gb, x, y, w, h) {
  try {
    const a = ga.getImageData(x, y, w, h).data, b = gb.getImageData(x, y, w, h).data;
    let sum = 0;
    for (let i = 0; i < a.length; i += 16) sum += Math.abs(a[i] - b[i]);
    return sum / (a.length / 16);
  } catch (e) { return 999; }   /* 픽셀을 읽을 수 없는 환경이면 그대로 진행 */
}
async function renderSpot() {
  loading();
  const def = game.def;
  let img;
  try { img = await loadImg(SCENES[def.scene].img); } catch (e) { return failLoad(); }
  const W = 780, H = Math.round(W * img.naturalHeight / img.naturalWidth);
  const src = document.createElement('canvas'); src.width = W; src.height = H;
  const sg = src.getContext('2d', { willReadFrequently: true }); sg.drawImage(img, 0, 0, W, H);
  const out = document.createElement('canvas'); out.width = W; out.height = H;
  out.className = 'picimg';
  const og = out.getContext('2d', { willReadFrequently: true }); og.drawImage(img, 0, 0, W, H);

  const all = detailCells(img, 11, 9);
  const busy = spreadPicks(all, 22, 0.17, 0.12);               /* 물건이 많은 자리 */
  const empty = spreadPicks([...all].reverse(), 22, 0.19, 0.15); /* 휑한 자리 */
  busy.sort(() => Math.random() - 0.5); empty.sort(() => Math.random() - 0.5);

  const vAt = (g, x, y, d) => {
    try {
      const px = g.getImageData(x, y, d, d).data;
      let sum = 0, sum2 = 0, n = 0;
      for (let i = 0; i < px.length; i += 16) { const v = 0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2]; sum += v; sum2 += v * v; n++; }
      const m = sum / n; return { v: Math.max(0, sum2 / n - m * m), m };
    } catch (e) { return { v: 120, m: 240 }; }
  };
  const inside = (x, y, d) => x >= 0 && y >= 0 && x + d <= W && y + d <= H;
  const diffs = [];
  const far = (cx, cy) => diffs.every(p2 => Math.hypot(p2.x * W - cx, p2.y * H - cy) > W * 0.17);

  const makeOne = (cell, wantBusy) => {
    const r = Math.round(W * (wantBusy ? 0.055 + Math.random() * 0.018 : 0.058 + Math.random() * 0.016));
    const cx = Math.round(Math.min(W - r - 3, Math.max(r + 3, cell.cx * W)));
    const cy = Math.round(Math.min(H - r - 3, Math.max(r + 3, cell.cy * H)));
    if (!far(cx, cy)) return false;
    const x = cx - r, y = cy - r, d = r * 2;
    const tv = vAt(sg, x, y, d).v;
    const restore = () => { og.save(); og.clearRect(x, y, d, d); og.drawImage(src, x, y, d, d, x, y, d, d); og.restore(); };

    /* 이웃 칸 중에서 가장 디테일이 많은 / 가장 휑한 곳 찾기 */
    const offs = [[1.25, 0], [-1.25, 0], [0, 1.25], [0, -1.25], [1.15, 1.15], [-1.15, -1.15], [1.15, -1.15], [-1.15, 1.15]];
    let rich = null, plain = null;
    for (const [ox, oy] of offs) {
      const nx = Math.round(x + ox * d), ny = Math.round(y + oy * d);
      if (!inside(nx, ny, d)) continue;
      const { v, m } = vAt(sg, nx, ny, d);
      if (!rich || v > rich.v) rich = { nx, ny, v, m };
      if (!plain || v < plain.v) plain = { nx, ny, v, m };
    }

    const plan = wantBusy
      ? [['flip'], ['grow'], ['erase'], ['dup']]
      : [['dup'], ['flip'], ['grow']];
    for (const [kind] of plan.sort(() => Math.random() - 0.35)) {
      restore();
      if (kind === 'dup') {
        if (!rich || rich.v < tv * 1.5 || rich.v < 72) continue;
        const fl = Math.random() < .5;
        inkPatch(og, src, rich.nx, rich.ny, d, d, x, y, d, d, fl);
        inkPatch(og, src, rich.nx, rich.ny, d, d, x, y, d, d, fl, 0.5);  /* 살짝 한 번 더 — 또렷하게 */
      } else if (kind === 'erase') {
        if (tv < 80 || !plain || plain.m < 231) continue;
        wipe(og, cx, cy, r * 0.82);
      } else if (kind === 'flip') {
        if (tv < 60) continue;
        wipe(og, cx, cy, r * 0.96);
        inkPatch(og, src, x, y, d, d, x, y, d, d, true);
      } else {
        if (tv < 60) continue;
        wipe(og, cx, cy, r * 0.96);
        const z = 0.58;
        inkPatch(og, src, cx - r * z, cy - r * z, d * z, d * z, x, y, d, d, false);
      }
      if (regionDiff(sg, og, x, y, d, d) > 13) {
        diffs.push({ x: cx / W, y: cy / H, r: r / W });
        return true;
      }
    }
    restore();
    return false;
  };

  let bi = 0, ei = 0, guard = 0;
  while (diffs.length < def.count && guard++ < 120) {
    const wantBusy = diffs.length % 2 === 0 ? bi < busy.length : !(ei < empty.length);
    if (wantBusy) { if (bi >= busy.length) break; makeOne(busy[bi++], true); }
    else { if (ei >= empty.length) { if (bi >= busy.length) break; makeOne(busy[bi++], true); } else makeOne(empty[ei++], false); }
  }
  game.diffs = diffs; game.left = diffs.length;

  $('#gameSheet').innerHTML = gameHead(`찾은 곳 <b>0</b> / ${diffs.length}`) + `
    <div class="board">
      <div class="panels">
        <div class="pic" id="picA"><span class="lab">원본</span><img src="${SCENES[def.scene].img}" alt="원본 그림" draggable="false"><div class="marks" id="markA"></div></div>
        <div class="pic" id="picB"><span class="lab">바뀐 그림</span><div class="marks" id="markB"></div></div>
      </div>
    </div>` + gameFoot();
  $('#picB').insertBefore(out, $('#markB'));
  const tap = (e, host) => {
    const r = host.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
    const ar = H / W;
    const hit = game.diffs.find(d => !d.got && Math.hypot(d.x - px, (d.y - py) * ar) < d.r * 1.7);
    if (hit) {
      hit.got = true; game.left--;
      for (const m of ['#markA', '#markB']) {
        const el = document.createElement('i');
        el.className = 'found';
        el.style.cssText = `left:${hit.x * 100}%;top:${hit.y * 100}%;width:${hit.r * 260}%`;
        $(m).appendChild(el);
      }
      const sc = $('#score'); if (sc) sc.innerHTML = `찾은 곳 <b>${game.diffs.length - game.left}</b> / ${game.diffs.length}`;
      if (!game.left) setTimeout(winGame, 500);
    } else {
      const el = document.createElement('i');
      el.className = 'missx'; el.style.cssText = `left:${px * 100}%;top:${py * 100}%`;
      host.querySelector('.marks').appendChild(el);
      setTimeout(() => el.remove(), 700);
      loseHeart(pick(['음… 거긴 아니에요!', '앗, 다시 한 번 보세요', '거긴 똑같은데요?']));
    }
  };
  $('#picA').addEventListener('click', (e) => tap(e, $('#picA')));
  $('#picB').addEventListener('click', (e) => tap(e, $('#picB')));
  wireFoot();
}
function failLoad() {
  $('#gameSheet').innerHTML = gameHead() + `<p class="lede" style="margin-top:20px">그림을 불러오지 못했어요. 인터넷 연결을 확인하고 다시 눌러주세요.</p>` + gameFoot();
  wireFoot();
}

/* ---------- 돋보기: 확대된 조각이 어디인지 찾기 ---------- */
async function renderDetail() {
  loading();
  const def = game.def;
  let img;
  try { img = await loadImg(SCENES[def.scene].img); } catch (e) { return failLoad(); }
  if (!game.spots) {
    const cells = spreadPicks(detailCells(img, 8, 7), 14, 0.2, 0.14);
    cells.sort(() => Math.random() - 0.5);
    game.spots = cells.slice(0, def.rounds);
    game.ri = 0;
  }
  const spot = game.spots[game.ri];
  const ar = img.naturalHeight / img.naturalWidth;
  $('#gameSheet').innerHTML = gameHead(`${game.ri + 1} / ${game.spots.length} 번째 조각`) + `
    <div class="board">
      <div class="hintwrap"><canvas id="hint" width="320" height="320"></canvas><span>이 조각이 어디일까요?</span></div>
      <div class="pic" id="picD"><img src="${SCENES[def.scene].img}" alt="${esc(ROOM_NAMES[game.room])} 그림" draggable="false"><div class="marks" id="markD"></div></div>
    </div>` + gameFoot();
  const hg = $('#hint').getContext('2d');
  const sW = img.naturalWidth * 0.17;
  hg.imageSmoothingQuality = 'high';
  hg.drawImage(img, spot.cx * img.naturalWidth - sW / 2, spot.cy * img.naturalHeight - sW / 2, sW, sW, 0, 0, 320, 320);
  $('#picD').addEventListener('click', (e) => {
    const r = $('#picD').getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
    const near = Math.hypot(spot.cx - px, (spot.cy - py) * ar) < 0.1;
    const el = document.createElement('i');
    el.style.cssText = `left:${px * 100}%;top:${py * 100}%`;
    if (near) {
      el.className = 'found'; el.style.width = '23%';
      el.style.left = spot.cx * 100 + '%'; el.style.top = spot.cy * 100 + '%';
      $('#markD').appendChild(el);
      game.ri++;
      setTimeout(() => { if (game.ri >= game.spots.length) winGame(); else renderDetail(); }, 650);
    } else {
      el.className = 'missx'; $('#markD').appendChild(el);
      setTimeout(() => el.remove(), 700);
      loseHeart(pick(['조금 더 왼쪽? 오른쪽?', '음… 그 근처는 아니에요', '다시 한 번 눈 크게!']));
    }
  }, { once: false });
  wireFoot();
}

/* ---------- 짝 맞추기 ---------- */
function renderMemory() {
  const g = game.def;
  const deck = [...g.pairs, ...g.pairs].sort(() => Math.random() - 0.5);
  game.deck = deck; game.up = []; game.done = 0; game.lock = false; game.moves = 0;
  $('#gameSheet').innerHTML = gameHead(`맞춘 쌍 <b>0</b> / ${g.pairs.length} · 뒤집기 <b id="mv">0</b>번`) + `
    <div class="board"><div class="cards" id="cards">
      ${deck.map((f, i) => `<button class="card" type="button" data-i="${i}" aria-label="카드"><span class="f">${f}</span></button>`).join('')}
    </div></div>` + gameFoot();
  $('#cards').querySelectorAll('.card').forEach(b => b.addEventListener('click', () => {
    if (game.lock || b.classList.contains('up') || b.classList.contains('done')) return;
    b.classList.add('up'); game.up.push(b);
    if (game.up.length < 2) return;
    game.moves++;
    const [a, c] = game.up;
    const score = () => { const s = $('#score'); if (s) s.innerHTML = `맞춘 쌍 <b>${game.done}</b> / ${g.pairs.length} · 뒤집기 <b>${game.moves}</b>번`; };
    if (game.deck[+a.dataset.i] === game.deck[+c.dataset.i]) {
      a.classList.add('done'); c.classList.add('done');
      game.up = []; game.done++; score();
      if (game.done === g.pairs.length) setTimeout(winGame, 420);
    } else {
      game.lock = true; score();
      setTimeout(() => { a.classList.remove('up'); c.classList.remove('up'); game.up = []; game.lock = false; }, 680);
    }
  }));
  wireFoot();
}

/* ---------- 집주인 퀴즈 ---------- */
function renderQuiz() {
  game.qi = game.qi || 0;
  const g = game.def, q = g.qs[game.qi];
  $('#gameSheet').innerHTML = gameHead(`${game.qi + 1}번 문제 / 전체 ${g.qs.length}문제`) + `
    <div class="board">
      <p class="quiz-q">${esc(q.q)}</p>
      <div class="opts" id="opts">
        ${q.a.map((t, i) => `<button class="opt" type="button" data-i="${i}">${esc(t)}</button>`).join('')}
      </div>
    </div>` + gameFoot();
  $('#opts').querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
    if (b.classList.contains('wrong') || b.classList.contains('right')) return;
    const ok = +b.dataset.i === q.c;
    b.classList.add(ok ? 'right' : 'wrong');
    if (!ok) { loseHeart(pick(['어어, 그건 아니에요!', '집을 더 둘러보고 오실래요?'])); return; }
    setTimeout(() => {
      game.qi++;
      if (game.qi >= g.qs.length) winGame(); else renderQuiz();
    }, 480);
  }));
  wireFoot();
}

/* ---------- 그림 조각 맞추기 ---------- */
function renderPuzzle() {
  const g = game.def;
  let order = [...Array(9).keys()];
  do { order.sort(() => Math.random() - 0.5); } while (order.filter((v, i) => v === i).length > 1);
  game.order = order; game.sel = null; game.moves = 0;
  const img = SCENES[g.scene].img;
  $('#gameSheet').innerHTML = gameHead(`맞은 조각 <b>0</b> / 9 · 바꾼 횟수 <b>0</b>`) + `
    <div class="board"><div class="puz" id="puz" style="--ar:1">
      ${order.map((v, i) => `<button class="tile" type="button" data-i="${i}" aria-label="조각"></button>`).join('')}
    </div>
    <div class="puz-ref"><img src="${img}" alt="완성 그림"><span>이 그림이 되도록 맞춰주세요</span></div></div>` + gameFoot();
  const puz = $('#puz');
  const paint = () => {
    puz.querySelectorAll('.tile').forEach((t, i) => {
      t.style.backgroundImage = `url(${img})`;
      t.style.backgroundPosition = `${(game.order[i] % 3) * 50}% ${Math.floor(game.order[i] / 3) * 50}%`;
      t.classList.toggle('ok', game.order[i] === i);
      t.classList.toggle('sel', game.sel === i);
    });
    const done = game.order.filter((v, i) => v === i).length;
    const s = $('#score'); if (s) s.innerHTML = `맞은 조각 <b>${done}</b> / 9 · 바꾼 횟수 <b>${game.moves}</b>`;
    if (done === 9) setTimeout(winGame, 420);
  };
  puz.querySelectorAll('.tile').forEach(t => t.addEventListener('click', () => {
    const i = +t.dataset.i;
    if (game.sel === null) { game.sel = i; paint(); return; }
    if (game.sel === i) { game.sel = null; paint(); return; }
    const a = game.sel;
    [game.order[a], game.order[i]] = [game.order[i], game.order[a]];
    game.sel = null; game.moves++; paint();
  }));
  paint();
  const probe = new Image();
  probe.onload = () => { puz.style.setProperty('--ar', (probe.naturalWidth / probe.naturalHeight).toFixed(3)); };
  probe.src = img;
  wireFoot();
}

/* ---------- 통과! ---------- */
function gradeOf() {
  const t = game.def.type;
  if (t === 'puzzle') return game.moves <= 12 ? 3 : game.moves <= 20 ? 2 : 1;
  if (t === 'memory') return game.moves <= 14 ? 3 : game.moves <= 22 ? 2 : 1;
  return Math.max(1, game.hearts);
}
const starStr = (n) => '★'.repeat(n) + '☆'.repeat(3 - n);
function winGame() {
  const room = game.room;
  const isNew = !state.cleared.has(room);
  const grade = gradeOf();
  const best = state.stars[room] || 0;
  const record = grade > best;
  state.cleared.add(room); ls('hw2_cleared', [...state.cleared]);
  if (record) { state.stars[room] = grade; ls('hw2_stars', state.stars); }
  burst(grade === 3 ? 100 : 70);
  const items = GIFTS.filter(g => giftRoom(g) === room);
  $('#gameSheet').innerHTML = `
    <div class="grip"></div>
    <div class="won">
      <div class="big">${grade === 3 ? '🏆' : '🎉'}</div>
      <div class="stars">${starStr(grade)}</div>
      <h2>${grade === 3 ? '퍼펙트!' : '통과!'}</h2>
      <p>${isNew && items.length ? `${esc(ROOM_NAMES[room])} 위시리스트 ${items.length}개가 열렸어요` :
          record ? '최고 기록을 새로 세웠어요!' : `최고 기록은 ${starStr(best)} 예요. 한 번 더?`}</p>
    </div>
    ${items.length ? `<ul class="nb-list">${items.map(g => {
      const c = state.claims[g.id];
      const st = c ? (isMine(c) ? `<span class="st mine">내가 찜함</span>` : `<span class="st claimed">${esc(c.name)}</span>`) : `<span class="st">찜 가능</span>`;
      return `<li><button class="nb-item" data-gift="${g.id}"><span class="em">${g.emoji}</span><span class="t"><b>${esc(g.name)}</b><span>${esc(g.price)}</span></span>${st}</button></li>`;
    }).join('')}</ul>` : ''}
    <div class="actions">
      <button class="btn btn-primary" data-close>계속 구경하기</button>
      ${grade < 3 ? `<button class="btn btn-ghost" id="retry">★★★ 노리고 다시 하기</button>` : ''}
    </div>`;
  $('#gameSheet').querySelectorAll('[data-gift]').forEach(b => b.onclick = () => {
    closeSheets(); setTimeout(() => openGift(b.dataset.gift), 240);
  });
  const rt = $('#retry'); if (rt) rt.onclick = () => openGame(room);
  wireFoot();
  say(grade === 3 ? pick(['퍼펙트! 한 번도 안 틀리셨어요!', '우와, 하트를 하나도 안 쓰다니!'])
    : pick(['통과! 위시리스트가 열렸어요', '잘하시는데요? 멍멍!', '역시 눈썰미가 다르시네요']), dogFor(room));
  showScene(state.scene, 'fwd');
  updateCta(); refresh();
}

/* ================================================================
   초대장
   ================================================================ */
function couponFor(name) { return COUPONS[hash(name || 'guest') % COUPONS.length]; }
function openInvite() {
  const c = couponFor(state.guest);
  $('#inviteSheet').innerHTML = `
    <div class="grip"></div>
    <div class="eyebrow">주인님이 남긴 것</div>
    <h2>초대장이 도착했어요</h2>
    <p class="lede">봉투를 눌러 열어보세요</p>
    <div class="env" id="env"><div class="env-body"><div class="flap"></div><div class="seal">유</div></div></div>
    <div class="actions"><button class="btn btn-primary" id="openEnv">봉투 열기</button></div>`;
  showSheet('#inviteSheet');
  $('#openEnv').onclick = () => {
    $('#env').classList.add('open');
    $('#openEnv').disabled = true;
    burst(50);
    setTimeout(() => {
      $('#inviteSheet').innerHTML = `
        <div class="grip"></div>
        <div class="eyebrow">주인님이 남긴 것</div>
        <h2>초대장</h2>
        <div class="card-invite">
          <div class="to">${esc(state.guest)}님께</div>
          <div class="msg">${esc(SITE.inviteMsg).replace(/\n/g, '<br>')}</div>
          <div class="rule"></div>
          <div class="coupon"><span class="e">${c.e}</span><span><b>${esc(c.t)}</b><span>${esc(c.s)}</span></span></div>
          <div class="sign">${esc(SITE.inviteSign)}</div>
        </div>
        <div class="actions"><button class="btn btn-primary" data-close>집 구경 시작하기</button></div>`;
      $('#inviteSheet').querySelectorAll('[data-close]').forEach(b => b.onclick = () => {
        closeSheets();
        state.thanked = true; ls('hw2_thanked', 1);
        updateCta();
        say(`${ROOM_NAMES[curRoom()]}부터 둘러볼까요? 방마다 미니게임이 하나씩 있어요!`, 'doria');
      });
      state.thanked = true; ls('hw2_thanked', 1);
    }, 780);
  };
}

/* ================================================================
   위시리스트 카드 / 수첩 / 방 이동
   ================================================================ */
let openGiftId = null, confirming = false, busy = false, lastErr = '';
function openGift(gid) { openGiftId = gid; confirming = false; lastErr = ''; renderGift(); showSheet('#giftSheet'); }
function renderGift() {
  if (!openGiftId) return;
  const g = GIFTS.find(x => x.id === openGiftId);
  const c = state.claims[g.id];
  let action;
  if (c && isMine(c)) {
    action = `<div class="status mine"><span class="dot"></span><span><b>${esc(c.name)}</b>님이 준비하기로 했어요. 고마워요!</span></div>
      <button class="btn btn-ghost" id="unclaimBtn" ${busy ? 'disabled' : ''}>찜 취소하기</button>`;
  } else if (c) {
    action = `<div class="status"><span class="dot"></span><span><b>${esc(c.name)}</b>님이 이미 준비 중이에요</span></div>
      <button class="btn btn-ghost" data-close>다른 선물 보러 가기</button>`;
  } else if (confirming) {
    action = `<p class="confirm-q"><b>${esc(state.guest)}</b> 이름으로 이 선물을 찜할까요? 모두에게 이름이 보여요.</p>
      <button class="btn btn-primary" id="claimYes" ${busy ? 'disabled' : ''}>네, 제가 선물할게요</button>
      <button class="btn btn-ghost" id="claimNo">다시 생각해볼게요</button>`;
  } else {
    action = `<button class="btn btn-primary" id="claimBtn">이 선물 찜하기</button>
      <button class="btn btn-ghost" data-close>계속 구경하기</button>`;
  }
  $('#giftSheet').innerHTML = `
    <div class="grip"></div>
    <div class="eyebrow">${esc(ROOM_NAMES[giftRoom(g)])} 위시리스트</div>
    <div class="gift-hero">
      <div class="gift-emoji" aria-hidden="true">${g.emoji}</div>
      <div><h2 id="giftName">${esc(g.name)}</h2><div class="price">${esc(g.price)}</div></div>
    </div>
    <div class="note">“${esc(g.note)}”<small>집주인 한마디</small></div>
    ${g.url ? `<a class="link" href="${esc(g.url)}" target="_blank" rel="noopener">이런 제품이면 좋아요 ↗</a>` : ''}
    <div class="actions">${action}${lastErr ? `<div class="err">${esc(lastErr)}</div>` : ''}</div>`;
  const on = (id, fn) => { const b = document.getElementById(id); if (b) b.onclick = fn; };
  on('claimBtn', () => { confirming = true; renderGift(); });
  on('claimNo', () => { confirming = false; renderGift(); });
  on('claimYes', async () => {
    busy = true; lastErr = ''; renderGift();
    try { await Store.claim(g.id, state.guest); confirming = false; burst(60); say(`${state.guest}님 고마워요! 꼬리 흔드는 중`, dogFor(giftRoom(g))); }
    catch (e) { lastErr = e.message === 'taken' ? '방금 다른 분이 먼저 찜했어요. 다른 선물을 골라주세요.' : '저장하지 못했어요. 인터넷 연결을 확인하고 다시 눌러주세요.'; confirming = false; }
    busy = false; renderGift();
  });
  on('unclaimBtn', async () => {
    busy = true; renderGift();
    try { await Store.unclaim(g.id); } catch (e) { lastErr = '취소하지 못했어요. 다시 눌러주세요.'; }
    busy = false; renderGift();
  });
  $('#giftSheet').querySelectorAll('[data-close]').forEach(b => b.onclick = closeSheets);
}

function renderNotebook() {
  const claimedN = GIFTS.filter(g => state.claims[g.id]).length;
  const open = openGifts().length;
  const rows = ROOM_ORDER.flatMap(r => {
    const items = GIFTS.filter(g => giftRoom(g) === r);
    if (!items.length) return [];
    if (!state.cleared.has(r)) {
      return [`<li><button class="nb-item locked" data-room="${r}"><span class="em">🔒</span><span class="t"><b>???</b><span>${esc(ROOM_NAMES[r])} · 미니게임을 깨면 열려요</span></span><span class="st">${items.length}개</span></button></li>`];
    }
    return items.map(g => {
      const c = state.claims[g.id];
      const st = c ? (isMine(c) ? `<span class="st mine">내가 찜함</span>` : `<span class="st claimed">${esc(c.name)}</span>`) : `<span class="st">찜 가능</span>`;
      return `<li><button class="nb-item" data-gift="${g.id}"><span class="em">${g.emoji}</span><span class="t"><b>${esc(g.name)}</b><span>${esc(ROOM_NAMES[r])} · ${esc(g.price)}</span></span>${st}</button></li>`;
    });
  }).join('');
  $('#nbSheet').innerHTML = `
    <div class="grip"></div>
    <div class="nb-head"><h2>내가 찾은 위시리스트</h2><span>열림 ${open}/${GIFTS.length} · 찜 ${claimedN}</span></div>
    <ul class="nb-list">${rows}</ul>
    <div class="actions"><button class="btn btn-ghost" id="againInvite">💌 초대장 다시 보기</button></div>
    ${Store.mode === 'demo' ? '<p class="demo-note">체험 모드예요. 찜한 내용은 이 기기에만 저장돼요. ‘민지 (예시)’는 화면 예시입니다.</p>' : ''}`;
  $('#nbSheet').querySelectorAll('[data-gift]').forEach(b => b.onclick = () => {
    closeSheets();
    const g = GIFTS.find(x => x.id === b.dataset.gift);
    if (g.scene !== state.scene) goScene(g.scene, { silent: true });
    setTimeout(() => openGift(g.id), 260);
  });
  $('#nbSheet').querySelectorAll('[data-room]').forEach(b => b.onclick = () => {
    const r = b.dataset.room;
    closeSheets();
    if (curRoom() !== r) goScene(ROOM_ENTRY[r], { silent: true });
    setTimeout(() => openGame(r), 300);
  });
  const ai = $('#againInvite'); if (ai) ai.onclick = () => { closeSheets(); setTimeout(openInvite, 240); };
}
function renderRooms() {
  $('#roomSheet').innerHTML = `<div class="grip"></div><div class="nb-head"><h2>방 이동</h2><span>별 ${ROOM_ORDER.reduce((a, r) => a + (state.stars[r] || 0), 0)} / ${ROOM_ORDER.length * 3}</span></div>
    <ul class="room-grid">${ROOM_ORDER.map(r => {
      const done = state.cleared.has(r);
      const st = state.stars[r] || 0;
      return `<li><button class="room-btn ${curRoom() === r ? 'here' : ''} ${done ? 'done' : ''}" data-room="${r}"><b>${ROOM_NAMES[r]}</b><span>${done ? starStr(st) : '🎮 미니게임 남음'}</span></button></li>`;
    }).join('')}</ul>`;
  $('#roomSheet').querySelectorAll('[data-room]').forEach(b => b.onclick = () => { closeSheets(); goScene(ROOM_ENTRY[b.dataset.room]); });
}
function showSheet(sel) { document.querySelectorAll('.sheet').forEach(s => s.classList.toggle('on', s.matches(sel))); $('#scrim').classList.add('on'); }
function closeSheets() { document.querySelectorAll('.sheet').forEach(s => s.classList.remove('on')); $('#scrim').classList.remove('on'); openGiftId = null; }

function refresh() {
  $('#foundN').textContent = openGifts().length;
  $('#totalN').textContent = GIFTS.length;
  document.querySelectorAll('.wish').forEach(b => b.classList.toggle('claimed', !!state.claims[b.dataset.gift]));
  if (openGiftId) renderGift();
  if ($('#nbSheet').classList.contains('on')) renderNotebook();
}
function burst(n) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const box = $('#confetti'); const colors = ['#d9a550', '#3f7d5c', '#bd5740', '#8a4420', '#fff6e0'];
  for (let i = 0; i < n; i++) {
    const p = document.createElement('i');
    p.style.left = Math.random() * 100 + 'vw'; p.style.background = colors[i % colors.length];
    p.style.setProperty('--x', (Math.random() * 120 - 60) + 'px'); p.style.setProperty('--r', (Math.random() * 720 - 360) + 'deg');
    p.style.setProperty('--t', (1.1 + Math.random() * 0.9) + 's'); p.style.animationDelay = (Math.random() * 0.25) + 's';
    box.appendChild(p); setTimeout(() => p.remove(), 2600);
  }
}

/* ================================================================
   노크 → 마중 → 입장
   ================================================================ */
let knocks = 0;
function setupKnock() {
  const door = $('#door');
  door.addEventListener('click', () => {
    if (knocks >= 2) return;
    knocks++;
    door.classList.remove('knock'); void door.offsetWidth; door.classList.add('knock');
    const m = document.createElement('div');
    m.className = 'knockmark'; m.textContent = '똑';
    door.parentElement.appendChild(m);
    setTimeout(() => m.remove(), 750);
    if (knocks === 1) $('#introSub').innerHTML = '한 번만 더요!';
    if (knocks === 2) setTimeout(greet, 420);
  });
}
function greet() {
  $('#door').classList.add('open');
  $('#introSub').innerHTML = '마중 나왔어요!';
  $('#greeters').hidden = false;
  setTimeout(() => {
    $('#introSay').hidden = false;
    $('#introSay').textContent = SITE.knockAsk;
    $('#enterForm').hidden = false;
    $('#guestName').focus({ preventScroll: true });
  }, 420);
}
function enterHouse(name) {
  state.guest = name; ls('hw2_guest', name);
  $('#intro').classList.add('gone');
  say(SITE.welcome(name), 'doria');
  updateCta();
  if (!state.thanked) {
    setTimeout(() => {
      state.cueReady = true;
      say(SITE.thanksCue, 'tube');
      updateCta();
    }, 3400);
  }
}

function start() {
  document.title = SITE.title;
  $('#siteTitle').textContent = SITE.title;
  $('#introTitle').textContent = SITE.title;
  $('#doorPlate').textContent = SITE.doorPlate;

  Store.onChange(refresh); Store.init();
  setupDrag(); setupKnock();
  showScene(state.scene, 'fwd');
  updateChip(); refresh();

  $('#scrim').onclick = closeSheets;
  $('#countBtn').onclick = () => { renderNotebook(); showSheet('#nbSheet'); };
  $('#roomsBtn').onclick = () => { renderRooms(); showSheet('#roomSheet'); };
  $('#zoomBtn').onclick = () => setZoom(1);
  $('#avatarBtn').onclick = () => dogTalk(speaker === 'tube' ? 'doria' : 'tube');
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheets(); });
  $('#enterForm').addEventListener('submit', (e) => { e.preventDefault(); const v = $('#guestName').value.trim(); if (v) enterHouse(v); });

  if (state.guest) {
    $('#intro').classList.add('gone');
    state.cueReady = true;
    const left = ROOM_ORDER.filter(r => GAMES[r] && !state.cleared.has(r)).length;
    say(left ? `${state.guest}님 또 오셨네요! 아직 미니게임 ${left}개가 남았어요` : `${state.guest}님 또 오셨네요! 위시리스트 다 열어두셨어요`, 'tube');
  } else {
    say('문을 두 번 두드려 주세요. 저희가 마중 나갈게요!', 'doria');
  }
  updateCta();
  setTimeout(() => $('#howto').classList.add('fade'), 8000);
  window.__hw = { goScene, openGame, openInvite, state, peekDiffs: () => (game && game.diffs) || null };
}
start();
</script>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>유씨네 집들이</title>
<meta name="description" content="유튜브와 유도리가 안내하는 우리 집 구경 · 미니게임으로 여는 위시리스트">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Gaegu:wght@700&display=swap">
<style>
/* Layout: one-screen app — header / hand-drawn room view / dog dock; cards and games rise as bottom sheets.
   Look: a sketchbook open on a warm desk — greige ground, cream paper, brass accent, one colour per dog. */
:root {
  color-scheme: light;
  --bg: #e9e2d4;          /* 책상 같은 배경 */
  --surface: #fffdf7;     /* 카드·시트 */
  --paper: #fcfaf4;       /* 그림이 놓이는 종이 */
  --line: #d6cdb9;
  --line-soft: #e6dfd0;
  --ink: #2b2620;
  --ink-2: #534c42;
  --muted: #7b7366;
  --brass: #a9762c;
  --brass-fill: #e7bd6e;
  --graphite: #33302b;
  --ok: #3f7d5c;
  --bad: #bd5740;
  --tube-bg: #fff0e3; --tube-line: #e0a274; --tube-ink: #8a4420;
  --doria-bg: #e7f2ea; --doria-line: #8cbd9c; --doria-ink: #2f6b47;
  --font-display: "Hahmlet", "Nanum Myeongjo", serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-dog: "Gaegu", "IBM Plex Sans KR", cursive;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.55 var(--font-body);
  overflow: hidden; -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-rows: auto 1fr auto auto; padding-top: env(safe-area-inset-top, 0px); }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px 7px; }
.brand { min-width: 0; }
.brand h1 { margin: 0; font: 700 18px/1.2 var(--font-display); letter-spacing: -0.01em; }
.brand p { margin: 1px 0 0; color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.count {
  flex: none; display: flex; align-items: center; gap: 7px; padding: 8px 13px;
  border: 1.5px solid var(--brass); border-radius: 999px; background: var(--surface);
  color: var(--brass); font-variant-numeric: tabular-nums; font-size: 13px; font-weight: 600; cursor: pointer;
  box-shadow: 0 2px 0 rgba(169,118,44,.18);
}
.count svg { width: 16px; height: 16px; flex: none; }
.count b { font-weight: 700; }

/* ---------- the sketchbook stage ---------- */
.stage {
  position: relative; min-height: 0; overflow: hidden;
  background: var(--paper);
  border-block: 1px solid var(--line);
  touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none;
}
.stage.grabbing { cursor: grabbing; }
.layer { position: absolute; left: 0; top: 0; transform-origin: 50% 50%; --k: 1; }
.layer img { display: block; width: 100%; height: 100%; }
.vignette { position: absolute; inset: 0; z-index: 2; pointer-events: none; box-shadow: inset 0 0 70px 10px rgba(110,98,76,.16); }

.hot { position: absolute; transform: translate(-50%, -50%); }
.go { display: grid; justify-items: center; gap: 4px; background: none; border: 0; padding: 4px; cursor: pointer; filter: drop-shadow(0 2px 5px rgba(80,72,58,.35)); }
.go .disc {
  width: calc(40px * var(--k)); height: calc(40px * var(--k)); border-radius: 50%; display: grid; place-items: center;
  background: var(--graphite); border: 2px solid #fffdf7; color: #fdf7e9;
  transition: background .18s ease; animation: bob 2.6s ease-in-out infinite;
}
.go .disc svg { width: 44%; height: 44%; }
.go:hover .disc, .go:focus-visible .disc { background: var(--brass); }
.go b { font-family: var(--font-body); font-weight: 700; font-size: calc(11.5px * var(--k)); color: #2b2620; background: rgba(255,253,247,.95); padding: 3px 8px; border-radius: 99px; white-space: nowrap; box-shadow: 0 1px 3px rgba(80,70,50,.2); }
.go.back .disc { width: calc(34px * var(--k)); height: calc(34px * var(--k)); background: #6f675c; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

.wish { background: none; border: 0; padding: 0; cursor: pointer; width: calc(48px * var(--k)); height: calc(48px * var(--k)); display: grid; place-items: center; }
.wish span {
  width: 100%; height: 100%; border-radius: 50%; display: grid; place-items: center;
  background: var(--brass-fill); border: 2.5px solid #fffdf7; color: #3b2a10;
  box-shadow: 0 4px 10px rgba(120,90,40,.35); animation: bob 3.4s ease-in-out infinite;
}
.wish span svg { width: 52%; height: 52%; }
.wish.claimed span { background: #7fb79a; color: #14341f; }

.dog { position: absolute; transform: translate(-50%, -100%); cursor: pointer; filter: drop-shadow(0 4px 6px rgba(90,82,66,.3)); --s: 1; }
.dog img { display: block; width: calc(104px * var(--k) * var(--s)); height: auto; animation: sniff 3.2s ease-in-out infinite; }
@keyframes sniff { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-2px) rotate(-1.5deg); } }

.chip {
  position: absolute; z-index: 3; top: 10px; display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 12px; border-radius: 999px; font-size: 13px; color: var(--ink);
  background: rgba(255,253,247,.94); border: 1px solid var(--line); box-shadow: 0 2px 6px rgba(80,70,50,.14);
}
.chip.place { left: 10px; font: 700 14px var(--font-display); }
.chip.place span { font: 500 11.5px var(--font-body); color: var(--muted); margin-left: 2px; }
.chip.rooms { right: 10px; cursor: pointer; font-weight: 600; }
.chip.zoom { right: 10px; top: auto; bottom: 12px; cursor: pointer; font-weight: 600; }
.chip svg { width: 14px; height: 14px; }
.howto {
  position: absolute; z-index: 3; left: 50%; top: 52px; transform: translateX(-50%);
  max-width: calc(100% - 24px); padding: 7px 13px; border-radius: 12px; font-size: 12.5px; text-align: center; color: var(--ink-2);
  background: rgba(255,253,247,.94); border: 1px solid var(--line); box-shadow: 0 2px 6px rgba(80,70,50,.14);
  transition: opacity .6s;
}
.howto.fade { opacity: 0; pointer-events: none; }

/* 아래 큰 버튼 — 지금 할 일 */
.cta {
  margin: 9px 16px 0; display: flex; align-items: center; justify-content: center; gap: 9px;
  height: 52px; border-radius: 16px; border: 0; cursor: pointer;
  font-weight: 700; font-size: 16px; letter-spacing: -.01em;
  animation: rise .4s ease both;
}
.cta em { font-style: normal; font-size: 21px; line-height: 1; }
.cta.ghost { background: var(--surface); color: var(--ink-2); border: 1.5px solid var(--line); box-shadow: 0 3px 0 var(--line-soft); font-size: 14.5px; }
.cta.ghost em { font-size: 17px; }
.cta.game { background: var(--graphite); color: #fdf7e9; box-shadow: 0 6px 0 #1f1d19, 0 12px 22px -12px rgba(40,34,26,.7); }
.cta.game:active { transform: translateY(3px); box-shadow: 0 3px 0 #1f1d19, 0 8px 16px -12px rgba(40,34,26,.7); }
.cta.gold {
  background: linear-gradient(180deg, #f0cb84, #d9a550); color: #3b2a10;
  box-shadow: 0 6px 0 #ad7f33, 0 12px 24px -12px rgba(140,100,30,.75);
  animation: rise .4s ease both, glow 2.2s ease-in-out .5s infinite;
}
.cta.gold:active { transform: translateY(3px); box-shadow: 0 3px 0 #ad7f33; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes glow { 0%, 100% { filter: brightness(1); } 55% { filter: brightness(1.09); } }

/* dock — 강아지 말풍선 */
.dock { display: flex; align-items: stretch; gap: 10px; padding: 9px 16px calc(11px + env(safe-area-inset-bottom, 0px)); }
.avatar {
  flex: none; width: 48px; height: 48px; align-self: end; border-radius: 50%; background: var(--surface);
  border: 2.5px solid var(--line); overflow: hidden; cursor: pointer; padding: 0;
  box-shadow: 0 3px 8px rgba(80,70,50,.2);
}
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.avatar[data-who="tube"] { border-color: var(--tube-line); }
.avatar[data-who="doria"] { border-color: var(--doria-line); }
.bubble {
  position: relative; flex: 1; min-width: 0; align-self: end;
  background: var(--b-bg, var(--surface)); color: var(--b-ink, var(--ink));
  border: 2px solid var(--b-line, var(--line));
  border-radius: 16px 16px 16px 5px; padding: 8px 13px 9px;
  font: 700 17.5px/1.32 var(--font-dog); min-height: 48px; display: flex; align-items: center;
  box-shadow: 0 3px 10px rgba(80,70,50,.14);
}
.bubble[data-who="tube"] { --b-bg: var(--tube-bg); --b-line: var(--tube-line); --b-ink: var(--tube-ink); }
.bubble[data-who="doria"] { --b-bg: var(--doria-bg); --b-line: var(--doria-line); --b-ink: var(--doria-ink); }
.bubble small { display: block; font: 700 11px var(--font-body); letter-spacing: .04em; opacity: .75; margin-bottom: 1px; }

/* sheets */
.scrim { position: fixed; inset: 0; background: rgba(52,44,32,.45); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 10; }
.scrim.on { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; max-height: 88%; overflow-y: auto;
  background: var(--surface); border-top: 1px solid var(--line); border-radius: 22px 22px 0 0;
  padding: 10px 20px calc(22px + env(safe-area-inset-bottom, 0px));
  transform: translateY(105%); transition: transform .32s cubic-bezier(.2,.8,.2,1);
  max-width: 560px; margin: 0 auto; box-shadow: 0 -16px 44px -26px rgba(60,48,30,.8);
}
.sheet.on { transform: none; }
.grip { width: 38px; height: 4px; border-radius: 4px; background: var(--line); margin: 0 auto 14px; }
.eyebrow { font-size: 11.5px; letter-spacing: .08em; color: var(--brass); font-weight: 700; }
.sheet h2 { margin: 4px 0 0; font: 700 21px/1.25 var(--font-display); text-wrap: balance; }
.lede { color: var(--muted); font-size: 13.5px; margin: 6px 0 0; }

.gift-hero { display: flex; gap: 14px; align-items: center; margin-top: 8px; }
.gift-emoji { flex: none; width: 64px; height: 64px; border-radius: 18px; background: #f6f0e2; border: 1px solid var(--line-soft); display: grid; place-items: center; font-size: 34px; }
.price { color: var(--muted); font-size: 13.5px; margin-top: 3px; font-variant-numeric: tabular-nums; }
.note { margin: 16px 0 0; padding: 13px 15px; background: var(--doria-bg); border: 1.5px solid var(--doria-line); border-radius: 12px; font: 700 17px/1.4 var(--font-dog); color: var(--doria-ink); }
.note small { display: block; font: 600 11.5px var(--font-body); color: var(--muted); margin-top: 5px; }
.link { display: inline-block; margin-top: 12px; color: var(--brass); font-size: 13.5px; font-weight: 600; }
.actions { display: grid; gap: 8px; margin-top: 18px; }
.btn { height: 52px; border-radius: 14px; border: 0; font-weight: 700; font-size: 15.5px; cursor: pointer; }
.btn-primary { background: linear-gradient(180deg, #f0cb84, #d9a550); color: #3b2a10; box-shadow: 0 4px 0 #ad7f33; }
.btn-primary:active { transform: translateY(2px); box-shadow: 0 2px 0 #ad7f33; }
.btn-ghost { background: var(--surface); border: 1.5px solid var(--line); color: var(--ink-2); }
.btn[disabled] { opacity: .55; cursor: default; }
.status { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: #f8f4ea; font-size: 14px; }
.status .dot { flex: none; width: 9px; height: 9px; border-radius: 50%; background: var(--ok); }
.status.mine { border-color: var(--brass); background: #fdf3df; }
.status.mine .dot { background: var(--brass); }
.confirm-q { font-size: 14.5px; margin: 0 0 2px; }
.err { color: var(--bad); font-size: 13px; margin-top: 8px; font-weight: 600; }

.nb-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.nb-head h2 { margin: 0; }
.nb-head span { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.nb-list { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 1px; background: var(--line-soft); border: 1px solid var(--line-soft); border-radius: 14px; overflow: hidden; }
.nb-list li { background: var(--surface); }
.nb-item { width: 100%; display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; padding: 12px; background: none; border: 0; text-align: left; cursor: pointer; }
.nb-item .em { font-size: 24px; text-align: center; }
.nb-item .t { min-width: 0; }
.nb-item .t b { display: block; font-weight: 700; font-size: 14.5px; }
.nb-item .t span { color: var(--muted); font-size: 12.5px; }
.nb-item .st { font-size: 12px; color: var(--muted); text-align: right; white-space: nowrap; font-weight: 600; }
.nb-item .st.claimed { color: var(--ok); }
.nb-item .st.mine { color: var(--brass); }
.nb-item.locked { cursor: pointer; background: #f7f2e7; }
.nb-item.locked .em { opacity: .5; filter: grayscale(1); }
.nb-item.locked b { color: var(--muted); letter-spacing: .1em; }
.nb-sec { padding: 10px 12px 8px; background: #faf3e6; display: grid; gap: 2px; }
.nb-sec b { font-size: 12.5px; font-weight: 800; color: var(--brass); letter-spacing: .02em; }
.nb-sec span { font-size: 11.5px; color: var(--muted); }
.gift-hero .opt { margin-top: 4px; font-size: 12px; color: var(--muted); line-height: 1.45; }
.demo-note { margin-top: 14px; font-size: 12px; color: var(--muted); }
.room-grid { list-style: none; margin: 14px 0 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.room-btn { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: #faf6ec; text-align: left; cursor: pointer; }
.room-btn b { display: block; font-weight: 700; }
.room-btn span { font-size: 12px; color: var(--muted); }
.room-btn.here { border-color: var(--brass); background: #fdf3df; }
.room-btn.done span { color: var(--ok); font-weight: 600; }

/* ---------- mini games ---------- */
.game-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.hearts { font-size: 19px; color: #d4584a; letter-spacing: 2px; white-space: nowrap; flex: none; }
.hearts i { color: #e0d6c2; font-style: normal; }
.score { margin-top: 11px; display: inline-block; padding: 6px 13px; border-radius: 999px; background: #f6f0e2; border: 1px solid var(--line-soft); color: var(--ink-2); font-size: 13px; font-variant-numeric: tabular-nums; }
.score b { color: var(--brass); font-weight: 700; }
.board { margin-top: 14px; }

.panels { display: grid; gap: 8px; }
.pic { position: relative; isolation: isolate; border-radius: 12px; overflow: hidden; background: var(--paper); border: 1px solid var(--line); cursor: crosshair; }
.foundlist { margin: 10px 0 0; font-size: 12.5px; line-height: 1.6; color: var(--ok); font-weight: 600; }

/* 숨은 그림 찾기 */
.seek { list-style: none; display: flex; gap: 6px; margin: 12px 0 0; padding: 0; }
.seek li { flex: 1; min-width: 0; display: grid; justify-items: center; gap: 1px; padding: 7px 2px 5px; border: 1.5px solid var(--line); border-radius: 10px; background: #faf6ec; }
.seek li img { width: 100%; max-width: 44px; height: 32px; object-fit: contain; }
.seek li span { font-size: 10.5px; color: var(--ink-2); white-space: nowrap; font-weight: 600; }
.seek li.got { border-color: var(--ok); background: #edf5f0; }
.seek li.got img { opacity: .4; }
.seek li.got span { color: var(--ok); }
.seek li.got span::after { content: " ✓"; }
.hidden-item {
  position: absolute; height: auto; transform-origin: center;
  mix-blend-mode: multiply; cursor: pointer;
}
.hidden-item.got { animation: pulseFound .5s ease; }
@keyframes pulseFound { 50% { filter: drop-shadow(0 0 6px rgba(192,84,74,.9)); } }
.pic img, .picimg { display: block; width: 100%; height: auto; }
.pic .lab { position: absolute; left: 8px; top: 8px; z-index: 3; font: 700 11px var(--font-body); color: #5c5446; background: rgba(255,253,247,.92); border: 1px solid var(--line); border-radius: 99px; padding: 2px 9px; }
.marks { position: absolute; inset: 0; pointer-events: none; }
.found { position: absolute; transform: translate(-50%, -50%); aspect-ratio: 1; border: 3px solid #c0544a; border-radius: 50%; box-shadow: 0 0 0 2px rgba(255,255,255,.75); animation: ring .4s ease both; }
@keyframes ring { from { transform: translate(-50%, -50%) scale(.4); opacity: 0 } to { transform: translate(-50%, -50%) scale(1); opacity: 1 } }
.missx { position: absolute; transform: translate(-50%, -50%); width: 28px; height: 28px; border-radius: 50%; border: 2px dashed #9a9388; animation: fadeout .7s ease forwards; }
@keyframes fadeout { to { opacity: 0; transform: translate(-50%, -50%) scale(1.5); } }

.hintwrap { display: flex; align-items: center; gap: 14px; margin-bottom: 11px; }
.hintwrap canvas { width: 108px; height: 108px; flex: none; border-radius: 12px; border: 2.5px solid var(--brass); background: var(--paper); box-shadow: 0 5px 14px rgba(120,90,40,.28); }
.hintwrap span { font: 700 17px/1.35 var(--font-dog); color: var(--ink-2); }

.cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.card { position: relative; aspect-ratio: 3/4; border-radius: 10px; border: 1.5px solid #c9b995; background: linear-gradient(140deg, #efe3c9, #e2d3b2); font-size: 25px; display: grid; place-items: center; cursor: pointer; transition: background .2s; }
.card::after { content: "🐾"; position: absolute; inset: 0; display: grid; place-items: center; font-size: 18px; opacity: .55; transition: opacity .12s; }
.card.up::after, .card.done::after { opacity: 0; }
.card .f { opacity: 0; transition: opacity .12s; }
.card.up, .card.done { background: var(--surface); border-color: var(--line); }
.card.up .f, .card.done .f { opacity: 1; }
.card.done { opacity: .5; cursor: default; }

.quiz-q { margin: 0 0 12px; font: 700 18px/1.4 var(--font-display); text-wrap: balance; }
.opts { display: grid; gap: 8px; }
.opt { padding: 15px 16px; border-radius: 12px; border: 1.5px solid var(--line); background: #faf6ec; text-align: left; cursor: pointer; font-size: 15px; font-weight: 500; }
.opt.wrong { border-color: var(--bad); color: var(--bad); animation: shake .34s; }
.opt.right { border-color: var(--ok); color: var(--ok); background: #eef6f0; }
@keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)} }

.puz { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 4px; aspect-ratio: var(--ar, 1); }
.tile { border-radius: 6px; border: 1.5px solid var(--line); background-size: 300% 300%; background-color: var(--paper); cursor: pointer; }
.tile.sel { outline: 3px solid var(--brass); outline-offset: -3px; }
.tile.ok { border-color: #a8cdb6; }
.puz-ref { display: flex; align-items: center; gap: 10px; margin-top: 12px; color: var(--muted); font-size: 12.5px; }
.puz-ref img { width: 54px; border-radius: 6px; border: 1px solid var(--line); }

.timer { font: 700 16px var(--font-body); color: var(--brass); font-variant-numeric: tabular-nums; white-space: nowrap; flex: none; }
.mazec { width: 100%; display: block; border-radius: 12px; border: 1px solid var(--line); background: var(--paper); touch-action: none; cursor: pointer; }

.shellbox { position: relative; height: 180px; margin-top: 6px; }
.cup {
  position: absolute; bottom: 34px; left: 0; width: 29%; padding: 0; border: 0; background: none; cursor: pointer;
  transform: translateX(calc(var(--p) * 122%));
  transition: transform .35s cubic-bezier(.4, 0, .2, 1);
}
.cup svg { width: 100%; height: auto; display: block; filter: drop-shadow(0 5px 7px rgba(90,82,66,.28)); }
.cup .bone { position: absolute; left: 50%; bottom: 4px; transform: translateX(-50%); font-size: 27px; opacity: 0; transition: opacity .18s; }
.cup.up { transform: translateX(calc(var(--p) * 122%)) translateY(-38px) rotate(-7deg); }
.cup.up.has .bone { opacity: 1; transform: translate(-50%, 40px) rotate(7deg); }
.shellbox::after { content: ""; position: absolute; left: 2%; right: 2%; bottom: 26px; height: 2px; background: #ded5c0; border-radius: 2px; }
.shelltip { text-align: center; margin: 10px 0 0; font: 700 17px var(--font-dog); color: var(--ink-2); }

/* 열쇠 */
.keyring { display: flex; justify-content: center; gap: 14px; margin: 16px 0 2px; }
.keyslot {
  width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; font-size: 26px;
  border: 2px dashed var(--line); background: #faf6ec; font-style: normal; filter: grayscale(1); opacity: .5;
}
.keyslot.on { border: 2px solid var(--brass); background: #fdf3df; filter: none; opacity: 1; box-shadow: 0 3px 10px -4px rgba(169,118,44,.6); }

/* 화면 중앙 감사인사 버튼 */
.thanks-stage {

/* ---------- invitation ---------- */

}

.card-invite .msg .hi {

}
.card-invite .rule { height: 1px; background: #e2d9c4; margin: 16px 0; }
.coupon { display: flex; gap: 12px; align-items: center; padding: 13px; border: 2px dashed #c49a5c; border-radius: 10px; background: #fff8e6; }
.coupon .e { font-size: 32px; flex: none; }
.coupon b { display: block; font-size: 15px; }
.coupon span { font-size: 12.5px; color: #6f6859; }
.card-invite .sign { margin-top: 14px; text-align: right; font: 700 16px var(--font-dog); color: #4a443b; }

/* ---------- 입장 인사: 화면 중앙에서 도리·튜브가 맞이합니다 ---------- */
.greet {
  position: fixed; inset: 0; z-index: 8; display: flex; align-items: center; justify-content: center;
  padding: calc(18px + env(safe-area-inset-top, 0px)) 16px calc(18px + env(safe-area-inset-bottom, 0px));
  background: radial-gradient(ellipse at 50% 42%, #fffaef 0%, #f7eedc 48%, #e9dcc3 100%);
  overflow: auto; transition: opacity .5s ease;
}
.greet.out { opacity: 0; pointer-events: none; }
.greet-inner { margin: auto; width: 100%; max-width: 380px; display: grid; justify-items: center; gap: 14px; }
.greet-dogs { display: flex; align-items: flex-end; justify-content: center; gap: 0; transition: transform .55s cubic-bezier(.4,0,.2,1); }
.greet.out .greet-dogs { transform: translateY(40vh) scale(.6); }
.greet-dogs img { width: 42vw; max-width: 158px; height: auto; display: block; filter: drop-shadow(0 6px 8px rgba(90,82,66,.3)); animation: greetHop .9s cubic-bezier(.2,.9,.3,1.3) both; }
.greet-dogs img:last-child { width: 46vw; max-width: 172px; margin-left: -14px; animation-delay: .12s; }
@keyframes greetHop { from { opacity: 0; transform: translateY(34px) scale(.86) } to { opacity: 1; transform: none } }
.greet-bubble {
  width: 100%; border-radius: 18px; padding: 14px 16px; min-height: 0;
  font: 700 19px/1.45 var(--font-dog); text-align: center;

  box-shadow: 0 6px 16px -8px rgba(80,70,50,.4); animation: rise .4s ease both;
}
.greet-bubble[data-who="tube"] { --b-bg: var(--tube-bg); --b-line: var(--tube-line); --b-ink: var(--tube-ink); }

.greet-bubble small { display: block; font: 700 11.5px var(--font-body); letter-spacing: .04em; opacity: .75; margin-bottom: 3px; }
.greet-next { width: 100%; max-width: 300px; animation: rise .4s .12s ease both; }
.greet-env { display: grid; justify-items: center; gap: 14px; width: 100%; cursor: pointer; animation: rise .45s .1s ease both; }
.greet-env .env { width: 62vw; max-width: 236px; margin: 0; animation: floatEnv 3.2s ease-in-out infinite; }
.greet-env .env-body { box-shadow: 0 20px 36px -20px rgba(60,48,30,.75); }
.greet-env .cap {
  text-align: center; font: 700 18px var(--font-dog); color: #2b2620;
  background: var(--brass-fill); border: 2px solid #b68a3e; border-radius: 999px; padding: 10px 22px;
  box-shadow: 0 6px 16px -8px rgba(120,90,40,.7); animation: capPulse 2.2s ease-in-out infinite;
}

/* ---------- intro / knock ---------- */
.intro {
  position: fixed; inset: 0; z-index: 20; background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  padding: calc(20px + env(safe-area-inset-top, 0px)) 16px calc(20px + env(safe-area-inset-bottom, 0px));
  overflow: auto; transition: opacity .5s .4s, visibility 0s .9s;
}
.intro.gone { opacity: 0; visibility: hidden; }
.intro-inner { margin: auto; width: 100%; max-width: 360px; display: grid; gap: 18px; text-align: center; }
.intro-inner > * { max-width: 100%; min-width: 0; }
.door-wrap { justify-self: center; }
.intro .kicker { font-size: 12px; letter-spacing: .14em; color: var(--brass); font-weight: 700; }

.door-frame::before { content: ""; position: absolute; inset: 9px 9px 0; background: radial-gradient(ellipse at 50% 20%, #fff7e6 0%, #e9dfcf 45%, #c9bfb0 100%); }
.door { position: relative; height: 100%; width: 100%; padding: 0; border: 0; display: block; background: #5a3b2e; transform-origin: left center; transition: transform 1s cubic-bezier(.5,0,.2,1); box-shadow: inset -2px 0 0 rgba(0,0,0,.25); cursor: pointer; }
.door.knock { animation: knock .3s; }
@keyframes knock { 0%,100%{transform:translateX(0)} 30%{transform:translateX(-3px)} 70%{transform:translateX(3px)} }
.door .lock { position: absolute; right: 12px; top: 46%; width: 13px; height: 34px; border-radius: 3px; background: #1d1d1d; box-shadow: inset 0 0 0 1px #444; }
.door .lock::after { content: ""; position: absolute; left: 4px; top: 6px; width: 5px; height: 5px; border-radius: 50%; background: #6fc3ff; opacity: .8; }
.door .handle { position: absolute; right: 6px; top: 58%; width: 22px; height: 4px; border-radius: 2px; background: #b9b4ad; }
.door .plate { position: absolute; left: 50%; top: 16px; transform: translateX(-50%); font: 700 11px var(--font-display); color: #d8c3a5; letter-spacing: .06em; white-space: nowrap; }
.door .banner { position: absolute; left: 50%; top: 48px; transform: translateX(-50%); width: 30px; }
.door .banner i { display: block; width: 18px; height: 12px; margin: 0 auto; border: 1px solid #c8b493; border-bottom: 0; border-right: 0; transform: rotate(45deg) translate(5px, 5px); }
.door .banner span { display: grid; place-items: center; width: 30px; height: 38px; background: #f2eee6; border-top: 2px solid #b48d5c; color: #c98a8a; font-size: 13px; }
.door.open { transform: rotateY(-78deg); }
.knockmark { position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%); font: 700 22px var(--font-dog); color: var(--brass); pointer-events: none; animation: pop .7s ease forwards; }
@keyframes pop { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.6) } 30% { opacity: 1; transform: translate(-50%, -90%) scale(1) } 100% { opacity: 0; transform: translate(-50%, -160%) scale(1) } }
.greeters { display: flex; align-items: flex-end; justify-content: center; gap: 2px; margin-top: -26px; }
.greeters img { width: 104px; height: auto; animation: hop .6s cubic-bezier(.2,.9,.3,1.3) both; filter: drop-shadow(0 4px 6px rgba(90,82,66,.3)); }
.greeters img:last-child { width: 118px; animation-delay: .12s; }
@keyframes hop { from { opacity: 0; transform: translateY(40px) scale(.8); } to { opacity: 1; transform: none; } }
.say-bubble {
  width: 100%; background: var(--doria-bg); color: var(--doria-ink); border: 2px solid var(--doria-line);
  border-radius: 16px; padding: 13px 16px; font: 700 18px/1.45 var(--font-dog);
  box-shadow: 0 4px 12px rgba(80,70,50,.14); animation: rise .4s ease both;
}
.enter { width: 100%; display: grid; gap: 10px; animation: rise .4s .15s ease both; }
.enter label { font-size: 13px; color: var(--muted); text-align: left; font-weight: 600; }
.enter input { height: 52px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); padding: 0 16px; font-size: 16px; }
.enter input::placeholder { color: #a79e8f; }

/* ---------- 배경음악 버튼 ---------- */
.topright { flex: none; display: flex; align-items: center; gap: 8px; }
.mute {
  flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
  border: 1.5px solid var(--line); background: var(--surface); font-size: 17px; cursor: pointer;
  box-shadow: 0 2px 0 var(--line-soft);
}
.mute.off { color: var(--muted); opacity: .75; }
.fin-mute { position: absolute; right: 16px; top: calc(14px + env(safe-area-inset-top, 0px)); z-index: 2; }

/* ---------- 피날레: 집주인 커튼콜 ---------- */
.finale {
  position: fixed; inset: 0; z-index: 26; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 4px; overflow: hidden;
  padding: 20px 16px calc(20px + env(safe-area-inset-bottom, 0px));
  background: radial-gradient(ellipse at 50% 40%, #fffaef 0%, #f6ecd9 45%, #e6d9c0 100%);
  animation: finIn .45s ease both;
}
@keyframes finIn { from { opacity: 0 } to { opacity: 1 } }
.finale .spot {
  position: absolute; left: 50%; top: -14%; width: 150%; height: 108%; transform: translateX(-50%);
  background: radial-gradient(ellipse at 50% 76%, rgba(255,246,222,.95) 0%, rgba(255,246,222,0) 62%);
  pointer-events: none;
}
.duo::after { content: ""; position: absolute; left: 10%; right: 10%; bottom: -4px; height: 14px; border-radius: 50%; background: rgba(120,100,70,.18); filter: blur(5px); }
.fin-eyebrow { position: relative; font: 700 12px var(--font-body); letter-spacing: .14em; color: var(--brass); }
.thanks {
  position: relative; text-align: center; font: 700 34px/1.15 var(--font-dog); color: #8a4420;
  text-shadow: 0 2px 0 #fff6e0; margin: 2px 0 10px;
}
.thanks b { color: var(--brass); }
.thanks span { display: inline-block; animation: hop2 .62s ease-in-out infinite alternate; }
.thanks span:nth-child(2) { animation-delay: .1s; }
@keyframes hop2 { from { transform: translateY(0) rotate(-2deg) } to { transform: translateY(-9px) rotate(2deg) } }
.duo { position: relative; display: flex; align-items: flex-end; justify-content: center; gap: 0; }
.ch { width: 41vw; max-width: 176px; height: auto; display: block; filter: drop-shadow(0 8px 10px rgba(96,80,56,.22)); }
.ch-her { animation: danceA .62s ease-in-out infinite; transform-origin: 50% 100%; }
.ch-him { animation: danceB .62s ease-in-out infinite; transform-origin: 50% 100%; margin-left: -10px; }
@keyframes danceA { 0%, 100% { transform: translateY(0) rotate(-5deg) } 50% { transform: translateY(-14px) rotate(5deg) } }
@keyframes danceB { 0%, 100% { transform: translateY(-14px) rotate(6deg) } 50% { transform: translateY(0) rotate(-6deg) } }
.fin-sub { position: relative; margin-top: 14px; text-align: center; font: 700 18px/1.5 var(--font-dog); color: var(--ink-2); }
.fin-sub b { color: var(--brass); }
.fin-close {
  position: relative; margin-top: 18px; height: 50px; padding: 0 26px; border-radius: 14px; border: 0; cursor: pointer;
  font-weight: 700; font-size: 15.5px; background: linear-gradient(180deg, #f0cb84, #d9a550); color: #3b2a10; box-shadow: 0 4px 0 #ad7f33;
}
.notes { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.notes i {
  position: absolute; bottom: 24%; font-style: normal; font-size: 26px; color: var(--brass); opacity: 0;
  animation: noteUp 2.6s linear infinite;
}
@keyframes noteUp {
  0% { opacity: 0; transform: translateY(0) rotate(-10deg) scale(.7) }
  15% { opacity: .9 }
  100% { opacity: 0; transform: translateY(-62vh) rotate(22deg) scale(1.15) }
}

.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 30; overflow: hidden; }
.confetti i { position: absolute; top: -12px; width: 7px; height: 12px; border-radius: 1px; animation: fall var(--t, 1.6s) cubic-bezier(.25,.6,.4,1) forwards; }
@keyframes fall { to { transform: translate(var(--x, 0), 105vh) rotate(var(--r, 540deg)); opacity: .9; } }

@media (prefers-reduced-motion: reduce) {
  .door, .sheet, .intro, .flap { transition-duration: .01s; }
  .confetti { display: none; }
  .go .disc, .dog img, .wish span, .cta, .cta.gold { animation: none; }
  .greeters img, .say-bubble, .enter, .card-invite { animation: none; }
  .keyslot.new, .unlockbig, .invite-stage .env, .invite-stage .cap { animation: none; }

  .greet-dogs img, .greet-bubble, .greet-next, .greet-env, .greet-env .env, .greet-env .cap { animation: none; }
  .ch-her, .ch-him, .thanks span, .notes i { animation: none; }
}
</style>

      방 이동
    </button>

/* 한 판 시작할 때마다 종류를 새로 뽑습니다 */
function makeGameDef(room) {
  const rn = ROOM_NAMES[room];
  if (SPOT_SETS[room]) {
    return { type: 'spot', set: SPOT_SETS[room], title: `${rn} 틀린 그림 찾기`, lede: '위아래 두 그림에서 다른 곳 6군데를 찾아 눌러주세요' };
  }
  const type = pick(GAME_KINDS.concat(HIDE_SPOTS[room] ? ['find', 'find'] : []));
  if (type === 'find') {
    return { type, scene: ROOM_SCENE[room], count: 5, title: `${rn} 숨은 그림 찾기`, lede: '이 방에 몰래 숨겨둔 다섯 가지를 찾아 눌러주세요' };
  }
  if (type === 'detail') {
    const n = 2 + Math.floor(Math.random() * 2);
    return { type, scene: ROOM_SCENE[room], rounds: n, title: `${rn} 돋보기`, lede: '확대된 조각이 그림의 어디인지 짚어주세요' };
  }
  if (type === 'memory') {
    const set = pick(MEMO_SETS);
    const n = 6 + Math.floor(Math.random() * 3);
    return { type, pairs: set.slice(0, n), title: `${rn} 짝 맞추기`, lede: `${n}쌍을 다 맞춰야 통과예요. 적게 뒤집을수록 별이 많아요` };
  }
  if (type === 'quiz') {
    const qs = [...QUIZ_POOL].sort(() => Math.random() - 0.5).slice(0, 2).map(q => {
      const right = q.a[q.c];
      const a = [...q.a].sort(() => Math.random() - 0.5);
      return { q: q.q, a, c: a.indexOf(right) };
    });
    return { type, qs, title: `${rn} 집주인 퀴즈`, lede: '집주인을 잘 아는 분이라면 쉬워요' };
  }
  if (type === 'puzzle') {
    return { type, scene: ROOM_SCENE[room], title: `${rn} 그림 맞추기`, lede: '조각 두 개를 눌러 자리를 바꿔요. 적게 움직일수록 별이 많아요' };
  }

}

const $ = (s) => document.querySelector(s);
function ls(key, val) {
  try {
    if (val === undefined) return JSON.parse(localStorage.getItem(key));
    localStorage.setItem(key, JSON.stringify(val));
  } catch (e) { return null; }
}
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const hash = (s) => { let h = 0; for (const c of String(s)) h = (h * 31 + c.codePointAt(0)) >>> 0; return h; };

const state = {
  guest: ls('hw2_guest') || null,
  guestId: ls('hw2_gid') || (Math.random().toString(36).slice(2) + Date.now().toString(36)),
  cleared: new Set(ls('hw2_cleared') || []),
  stars: ls('hw2_stars') || {},
  thanked: !!ls('hw2_thanked'),
  thanksSeen: !!ls('hw2_thanksseen'),
  cueReady: false,

};
ls('hw2_gid', state.guestId);

const KEYS_NEEDED = 3;
const hasGame = (r) => !!ROOM_SCENE[r];
const keyCount = () => Math.min(KEYS_NEEDED, state.cleared.size);
const unlocked = () => state.cleared.size >= KEYS_NEEDED;

/* ---------- 저장소: 체험 모드(localStorage) / 실서비스(Firebase) ---------- */
const Store = {
  mode: 'demo', uid: state.guestId, listeners: [],
  onChange(fn) { this.listeners.push(fn); },
  emit() { this.listeners.forEach(fn => fn()); },
  async init() {
    if (FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey) {
      try { await this.initLive(); return; } catch (e) { console.warn('Firebase 연결 실패, 체험 모드로 전환', e); }
    }
    this.initDemo();
  },
  initDemo() {
    this.mode = 'demo';
    let c = ls('hw2_claims');
    if (!c) { c = { glasses: { name: '민지 (예시)', uid: 'example', at: Date.now() } }; ls('hw2_claims', c); }
    state.claims = c;
    window.addEventListener('storage', (e) => { if (e.key === 'hw2_claims') { state.claims = ls('hw2_claims') || {}; this.emit(); } });
    this.emit();
  },
  async initLive() {
    const base = 'https://www.gstatic.com/firebasejs/10.12.2/';
    const [appMod, fs, authMod] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-firestore.js'), import(base + 'firebase-auth.js')]);
    const app = appMod.initializeApp(FIREBASE_CONFIG);
    const db = fs.getFirestore(app);
    const cred = await authMod.signInAnonymously(authMod.getAuth(app));
    this.uid = cred.user.uid; this.mode = 'live';
    fs.onSnapshot(fs.collection(db, 'claims'), (snap) => { const c = {}; snap.forEach(d => { c[d.id] = d.data(); }); state.claims = c; this.emit(); });
    this.claim = (gid, name) => fs.runTransaction(db, async (tx) => {
      const ref = fs.doc(db, 'claims', gid); const s = await tx.get(ref);
      if (s.exists()) throw new Error('taken');
      tx.set(ref, { name, uid: this.uid, at: fs.serverTimestamp() });
    });
    this.unclaim = (gid) => fs.deleteDoc(fs.doc(db, 'claims', gid));
  },
  async claim(gid, name) {
    const c = ls('hw2_claims') || {}; if (c[gid]) throw new Error('taken');
    c[gid] = { name, uid: this.uid, at: Date.now() }; ls('hw2_claims', c); state.claims = c; this.emit();
  },
  async unclaim(gid) { const c = ls('hw2_claims') || {}; delete c[gid]; ls('hw2_claims', c); state.claims = c; this.emit(); },
};
const isMine = (c) => c && c.uid === Store.uid;

const DOGS = {

let sayPending = null, sayTimer = 0;
function say(text, who, keepPending) {
  if (!keepPending) clearPending();
  speaker = who || speaker; const d = DOGS[speaker];
  $('#avatarImg').src = d.face; $('#avatarImg').alt = d.name;

/* 다음 멘트는 말풍선을 눌러야 넘어갑니다 (오래 안 누르면 알아서 넘어가요) */
function queueSay(text, who, after) {
  sayPending = { text, who, after };
  $('#bubble').classList.add('more');
  clearTimeout(sayTimer);
  sayTimer = setTimeout(flushPending, 14000);
}
function flushPending() {
  const q = sayPending; if (!q) return false;
  clearPending();
  say(q.text, q.who);
  if (q.after) q.after();
  return true;
}
function clearPending() {
  sayPending = null; clearTimeout(sayTimer);
  const b = $('#bubble'); if (b) b.classList.remove('more');
}
function dogTalk(who) {
  const room = curRoom();
  const need = KEYS_NEEDED - keyCount();
  if (unlocked()) {
    const left = GIFTS.filter(g => !state.claims[g.id]);
    if (left.length) say(`위시리스트에서 ${left[0].name}이(가) 아직 주인이 없어요`, who);
    else say(pick(['전부 주인이 정해졌어요! 고마워요', '꼬리가 멈추질 않아요 멍멍!']), who);
    return;
  }
  if (!hasGame(room)) {
    say(pick([`여긴 구경만 하는 곳이에요. 열쇠는 다른 방에서 모아요!`, '편하게 신발 벗고 들어오세요 멍!']), who);
    return;
  }
  if (state.cleared.has(room)) {
    say(`여긴 이미 열쇠를 드렸어요. 다른 방에서 ${need}개만 더 모으면 돼요!`, who);
    return;
  }
  say(pick([
    `이 방에서 한 판 깨면 열쇠 하나! ${need}개만 더 모으면 위시리스트가 열려요`,
    '아래 버튼 눌러보세요. 깨면 열쇠를 드려요 멍!',
    `열쇠 ${keyCount()}개 모았어요. 여기서 하나 더 가져가세요!`,
  ]), who);

/* ---------- 장면 그리기 ---------- */
const stage = $('#stage');
let layer = null, natural = { w: 4, h: 3 };
let pan = { x: 0, y: 0 }, maxPan = { x: 0, y: 0 }, zoom = 1;
const MAX_ZOOM = 2.8;

const svgArrow = (back) => back
  ? `<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v10M10 17l-5-6M10 17l5-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`
  : `<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 17V7M10 3l-5 6M10 3l5 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const svgGiftTag = () => `<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="6.5" width="11" height="7" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M1.5 6.5h13M8 6.5v7M8 6.5C6.2 3 4 3.8 5.3 5.6 6.2 6.4 8 6.5 8 6.5zm0 0c1.8-3.5 4-2.7 2.7-.9C9.8 6.4 8 6.5 8 6.5z" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>`;

function buildScene(id) {
  const sc = SCENES[id];
  const el = document.createElement('div');
  el.className = 'layer';
  el.innerHTML = `<img alt="${esc(ROOM_NAMES[sc.room])} 그림" draggable="false" src="${sc.img}">`;

  (sc.exits || []).forEach(([to, label, x, y, kind]) => {
    const back = kind === 'back';
    const h = document.createElement('div');
    h.className = 'hot';
    h.style.cssText = `left:${x}%;top:${y}%`;
    h.innerHTML = `<button class="go${back ? ' back' : ''}" type="button"><span class="disc">${svgArrow(back)}</span><b>${esc(label)}</b></button>`;
    h.querySelector('button').addEventListener('click', (e) => { e.stopPropagation(); goScene(to); });
    el.appendChild(h);
  });

  (unlocked() ? GIFTS.filter(g => g.scene === id) : []).forEach(g => {
    const h = document.createElement('div');
    h.className = 'hot';
    h.style.cssText = `left:${g.x}%;top:${g.y}%`;
    h.innerHTML = `<button class="wish" type="button" data-gift="${g.id}" aria-label="${esc(g.name)}"><span>${svgGiftTag()}</span></button>`;
    h.querySelector('button').addEventListener('click', (e) => { e.stopPropagation(); openGift(g.id); });
    el.appendChild(h);
  });

  (sc.dogs || []).forEach(([who, x, y, s]) => {
    const d = DOGS[who];
    const h = document.createElement('div');
    h.className = 'dog';
    h.style.cssText = `left:${x}%;top:${y}%;--s:${s || 1}`;
    h.innerHTML = `<img src="${d.img}" alt="${d.name}에게 말 걸기" draggable="false">`;
    h.addEventListener('click', (e) => { e.stopPropagation(); dogTalk(who); });
    el.appendChild(h);
  });
  return el;
}

/* 그림 전체가 보이도록 맞추고(=확대 1배), 확대하면 그만큼 끌어서 볼 수 있게 합니다 */
function fitLayer(el) {
  const W = stage.clientWidth, H = stage.clientHeight;
  if (!W || !H) return;
  const contain = Math.min(W / natural.w, H / natural.h);
  const cover = Math.max(W / natural.w, H / natural.h);
  const base = contain * Math.min(cover / contain, 1.62);
  const w = natural.w * base * zoom, h = natural.h * base * zoom;
  el.style.width = w + 'px'; el.style.height = h + 'px';
  el.style.left = ((W - w) / 2) + 'px'; el.style.top = ((H - h) / 2) + 'px';
  el.style.setProperty('--k', Math.max(.6, Math.min(1.25, w / 430)).toFixed(3));
  maxPan.x = Math.max(0, (w - W) / 2); maxPan.y = Math.max(0, (h - H) / 2);
  pan.x = Math.max(-maxPan.x, Math.min(maxPan.x, pan.x));
  pan.y = Math.max(-maxPan.y, Math.min(maxPan.y, pan.y));
  applyPan();
}
function applyPan() { if (layer) layer.style.transform = `translate(${pan.x}px, ${pan.y}px)`; }
function setZoom(z, anchor) {
  const was = zoom;
  zoom = Math.max(1, Math.min(MAX_ZOOM, z));
  if (zoom === was) return;
  const r = zoom / was;
  if (anchor) {
    const cx = anchor.x - stage.clientWidth / 2, cy = anchor.y - stage.clientHeight / 2;
    pan.x = (pan.x - cx) * r + cx; pan.y = (pan.y - cy) * r + cy;
  } else { pan.x *= r; pan.y *= r; }
  if (layer) {
    layer.style.transition = 'width .3s ease, height .3s ease, left .3s ease, top .3s ease, transform .3s ease';
    fitLayer(layer);
    setTimeout(() => { if (layer) layer.style.transition = 'none'; }, 320);
  }
  $('#zoomBtn').hidden = zoom <= 1;
}

function showScene(id, dir) {
  const old = layer;
  const el = buildScene(id);
  el.style.opacity = '0';
  el.style.transform = `scale(${dir === 'back' ? 1.06 : 0.94})`;
  stage.appendChild(el);
  const img = el.querySelector('img');
  const go = () => {
    natural = { w: img.naturalWidth || 4, h: img.naturalHeight || 3 };
    pan = { x: 0, y: 0 }; zoom = 1; $('#zoomBtn').hidden = true;
    layer = el;
    fitLayer(el);
    requestAnimationFrame(() => {
      el.style.transition = 'opacity .5s ease, transform .5s cubic-bezier(.2,.75,.3,1)';
      el.style.opacity = '1';
      applyPan();
    });
    if (old) {
      old.style.transition = 'opacity .4s ease, transform .4s ease';
      old.style.opacity = '0';
      old.style.transform += ` scale(${dir === 'back' ? 0.94 : 1.07})`;
      setTimeout(() => old.remove(), 440);
    }
    preload(id);
  };
  if (img.complete && img.naturalWidth) go(); else { img.onload = go; img.onerror = go; }
}

const preloaded = new Set();
function preload(id) {
  (SCENES[id].exits || []).forEach(([to]) => {
    if (preloaded.has(to)) return;
    preloaded.add(to);
    const i = new Image(); i.src = SCENES[to].img;
  });
}

function goScene(id, opt = {}) {
  if (!SCENES[id] || id === state.scene) return;
  const back = (SCENES[state.scene].exits || []).some(([to, , , , kind]) => to === id && kind === 'back');
  const prevRoom = curRoom();
  state.scene = id;
  showScene(id, back ? 'back' : 'fwd');
  updateChip();
  updateCta();
  $('#howto').classList.add('fade');
  if (!opt.silent) announce(prevRoom);
}
function updateChip() {
  const sc = SCENES[state.scene];
  $('#placeChip').innerHTML = `${esc(ROOM_NAMES[sc.room])}${sc.sub ? ` <span>${esc(sc.sub)}</span>` : ''}`;
}
function announce(prevRoom) {
  const room = curRoom();
  if (room === prevRoom) return;
  const who = dogFor(room);
  const need = KEYS_NEEDED - keyCount();
  if (unlocked()) {
    say(`${ROOM_NAMES[room]}에 도착! 여기 놓인 선물도 한번 보세요`, who);
  } else if (!hasGame(room)) {
    say(`${ROOM_NAMES[room]}이에요. 편하게 둘러보세요`, who);
  } else if (state.cleared.has(room)) {
    say(`${ROOM_NAMES[room]}은 이미 깼어요. 열쇠 ${need}개만 더!`, who);
  } else {
    say(`${ROOM_NAMES[room]}에 도착! 한 판 깨면 열쇠 하나예요 (${keyCount()}/${KEYS_NEEDED})`, who);
  }
}

/* 아래쪽 큰 버튼: 초대장 → 미니게임 → 완료 */
function updateCta() {
  const b = $('#ctaBtn');
  if (!state.guest || greeting) { b.hidden = true; return; }
  const room = curRoom();
  const g = ROOM_SCENE[room];
  if (g && !state.cleared.has(room)) {
    b.hidden = false; b.className = 'cta game';
    b.innerHTML = `<em>🎮</em> ${esc(ROOM_NAMES[room])} 미니게임`;
    b.onclick = () => openGame(room);
  } else if (g) {
    const st = state.stars[room] || 0;
    b.hidden = false; b.className = 'cta ghost';
    b.innerHTML = `<em>${st >= 3 ? '🏆' : '⭐'}</em> ${esc(ROOM_NAMES[room])} ${starStr(st)} ${st >= 3 ? '· 한 판 더' : '· 기록 깨기'}`;
    b.onclick = () => openGame(room);
  } else if (unlocked()) {
    /* 게임이 없는 방(현관) + 이미 다 열린 경우 */
    b.hidden = false; b.className = 'cta ghost';

    b.onclick = () => { renderNotebook(); showSheet('#nbSheet'); };

    b.hidden = false; b.className = 'cta game';

    b.onclick = () => goScene(ROOM_ENTRY.living);
  } else {
    b.hidden = false; b.className = 'cta game';
    b.innerHTML = `<em>🎮</em> 미니게임 하러 가기`;
    b.onclick = () => { renderRooms(); showSheet('#roomSheet'); };
  }
}

/* ---------- 확대해서 둘러보기 ---------- */
function setupDrag() {
  const pts = new Map();
  let drag = null, pinch = null, lastTap = 0;
  const rel = (e) => { const r = stage.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  stage.addEventListener('pointerdown', (e) => {
    if (e.target.closest('button, #inviteStage, #thanksStage')) return;
    pts.set(e.pointerId, e);
    try { stage.setPointerCapture(e.pointerId); } catch (err) {}
    if (pts.size === 2) {
      const [a, b] = [...pts.values()];
      pinch = { d: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY), z: zoom };
      drag = null;
    } else if (pts.size === 1) {
      drag = { x: e.clientX, y: e.clientY, px: pan.x, py: pan.y, moved: false };
      stage.classList.add('grabbing');
    }
  });
  stage.addEventListener('pointermove', (e) => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, e);
    if (pinch && pts.size === 2) {
      const [a, b] = [...pts.values()];
      const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
      zoom = Math.max(1, Math.min(MAX_ZOOM, pinch.z * (d / pinch.d)));
      if (layer) { layer.style.transition = 'none'; fitLayer(layer); }
      $('#zoomBtn').hidden = zoom <= 1;
      $('#howto').classList.add('fade');
      return;
    }
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.moved && Math.hypot(dx, dy) > 6) { drag.moved = true; $('#howto').classList.add('fade'); }
    if (!drag.moved) return;
    if (layer) layer.style.transition = 'none';
    pan.x = Math.max(-maxPan.x, Math.min(maxPan.x, drag.px + dx));
    pan.y = Math.max(-maxPan.y, Math.min(maxPan.y, drag.py + dy));
    applyPan();
  });
  const end = (e) => {
    pts.delete(e.pointerId);
    if (pts.size < 2) pinch = null;
    if (drag && !drag.moved && !e.target.closest('button')) {
      const now = Date.now();
      if (now - lastTap < 320) { setZoom(zoom > 1.2 ? 1 : 2, rel(e)); lastTap = 0; }
      else lastTap = now;
    }
    drag = null; stage.classList.remove('grabbing');
  };
  stage.addEventListener('pointerup', end);
  stage.addEventListener('pointercancel', end);
  stage.addEventListener('wheel', (e) => { e.preventDefault(); setZoom(zoom * (e.deltaY < 0 ? 1.18 : 1 / 1.18), rel(e)); }, { passive: false });
  new ResizeObserver(() => { if (layer) fitLayer(layer); }).observe(stage);
}

/* ================================================================
   미니게임 — 하트 3개, 별 3개가 걸린 한 판
   ================================================================ */
let game = null;
const imgCache = {};
function loadImg(src) {
  return new Promise((res, rej) => {
    if (imgCache[src]) return res(imgCache[src]);
    const i = new Image();
    i.onload = () => { imgCache[src] = i; res(i); };
    i.onerror = rej;
    i.src = src;
  });
}
/* 그림에서 '디테일이 많은 곳'을 골라줍니다 — 빈 벽이 아니라 물건 위에 문제가 나도록 */
function gridCells(gx, gy) {
  const out = [];
  for (let j = 0; j < gy; j++) for (let i = 0; i < gx; i++)
    out.push({ cx: (i + 0.5) / gx, cy: (j + 0.5) / gy, score: Math.random() });
  return out.sort((a, b) => b.score - a.score);
}
function detailCells(img, gx, gy) {
  try { return detailCellsPx(img, gx, gy); } catch (e) { return gridCells(gx, gy); }
}
function detailCellsPx(img, gx, gy) {
  const W = 180, H = Math.max(2, Math.round(180 * img.naturalHeight / img.naturalWidth));
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d', { willReadFrequently: true });
  g.drawImage(img, 0, 0, W, H);
  const d = g.getImageData(0, 0, W, H).data;
  const cw = W / gx, ch = H / gy, out = [];
  for (let j = 0; j < gy; j++) for (let i = 0; i < gx; i++) {
    let sum = 0, sum2 = 0, n = 0;
    for (let y = Math.floor(j * ch); y < Math.floor((j + 1) * ch); y++)
      for (let x = Math.floor(i * cw); x < Math.floor((i + 1) * cw); x++) {
        const k = (y * W + x) * 4, v = 0.299 * d[k] + 0.587 * d[k + 1] + 0.114 * d[k + 2];
        sum += v; sum2 += v * v; n++;
      }
    const mean = sum / n;
    out.push({ cx: (i + 0.5) / gx, cy: (j + 0.5) / gy, score: Math.max(0, sum2 / n - mean * mean) });
  }
  return out.sort((a, b) => b.score - a.score);
}
function spreadPicks(cells, n, minDist, margin) {
  const picks = [];
  for (const c of cells) {
    if (picks.length >= n) break;
    if (c.cx < margin || c.cx > 1 - margin || c.cy < margin || c.cy > 1 - margin) continue;
    if (picks.some(p => Math.hypot(p.cx - c.cx, p.cy - c.cy) < minDist)) continue;
    picks.push(c);
  }
  return picks;
}

function openGame(room) {
  if (!ROOM_SCENE[room]) return;
  game = { room, def: makeGameDef(room), hearts: 3, moves: 0, t0: Date.now() };
  Music.start('game');
  showSheet('#gameSheet');
  renderGame();
}
const heartsHtml = () => `<span class="hearts">${'♥'.repeat(game.hearts)}<i>${'♥'.repeat(3 - game.hearts)}</i></span>`;
function gameHead(score, right) {
  const g = game.def;
  return `<div class="grip"></div>
    <div class="eyebrow">${esc(ROOM_NAMES[game.room])} 미니게임</div>
    <div class="game-top"><h2>${esc(g.title)}</h2>${right || heartsHtml()}</div>
    <p class="lede">${esc(g.lede)}</p>
    ${score ? `<div class="score" id="score">${score}</div>` : ''}`;
}
const gameFoot = () => `<div class="actions"><button class="btn btn-ghost" data-close>나중에 할게요</button></div>`;
function wireFoot() { $('#gameSheet').querySelectorAll('[data-close]').forEach(b => b.onclick = closeSheets); }
function loading() {
  $('#gameSheet').innerHTML = gameHead() + `<p class="lede" style="margin-top:22px">그림 준비 중…</p>`;
}
function renderGame() {
  const t = game.def.type;
  if (t === 'spot') renderSpot();
  else if (t === 'detail') renderDetail();
  else if (t === 'memory') renderMemory();
  else if (t === 'quiz') renderQuiz();
  else if (t === 'puzzle') renderPuzzle();
  else if (t === 'maze') renderMaze();
  else if (t === 'shell') renderShell();
  else if (t === 'find') renderFind();
}
function loseHeart(msg) {
  game.hearts--;
  const h = $('#gameSheet').querySelector('.hearts');
  if (h) { h.outerHTML = heartsHtml(); }
  if (game.hearts <= 0) { setTimeout(failGame, 420); return true; }
  if (msg) say(msg, dogFor(game.room));
  return false;
}
function failGame() {
  $('#gameSheet').innerHTML = `
    <div class="grip"></div>
    <div class="won">
      <div class="big">🐾</div>
      <h2>아깝다! 기회를 다 썼어요</h2>
      <p>${esc(DOGS[dogFor(game.room)].name)}가 다시 섞어줄게요. 한 판 더 가시죠!</p>
    </div>
    <div class="actions">
      <button class="btn btn-primary" id="retry">다시 도전</button>
      <button class="btn btn-ghost" data-close>나중에 할게요</button>
    </div>`;
  $('#retry').onclick = () => openGame(game.room);
  wireFoot();
  say(pick(['괜찮아요, 저도 열 번은 틀렸어요', '한 판만 더요! 이번엔 느낌이 와요']), dogFor(game.room));
}

/* ---------- 틀린 그림 찾기 (작업실·거실 고정) ---------- */
function hitZone(diff, px, py, ar) {
  return diff.z.some(([x, y, r]) => Math.hypot((x - px) / 100, ((y - py) / 100) * ar) < r / 100 * 1.15);
}
function renderSpot() {
  const set = game.def.set;
  game.diffs = set.diffs.map(d => ({ ...d, got: false }));
  game.left = game.diffs.length;
  $('#gameSheet').innerHTML = gameHead(`찾은 곳 <b>0</b> / ${game.diffs.length}`) + `
    <div class="board">
      <div class="panels">
        <div class="pic" id="picA"><span class="lab">원본</span><img src="${set.a}" alt="원본 그림" draggable="false"><div class="marks" id="markA"></div></div>
        <div class="pic" id="picB"><span class="lab">바뀐 그림</span><img src="${set.b}" alt="바뀐 그림" draggable="false"><div class="marks" id="markB"></div></div>
      </div>
      <p class="foundlist" id="flist"></p>
    </div>` + gameFoot();
  const showList = () => {
    const got = game.diffs.filter(d => d.got);
    $('#flist').innerHTML = got.length ? '✅ ' + got.map(d => esc(d.n)).join(' · ') : '';
  };
  const tap = (e, host) => {
    const r = host.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width * 100, py = (e.clientY - r.top) / r.height * 100;
    const ar = r.height / r.width;
    const hit = game.diffs.find(d => !d.got && hitZone(d, px, py, ar));
    if (hit) {
      hit.got = true; game.left--;
      const z = hit.z[0];
      ['#markA', '#markB'].forEach(m => {
        const el = document.createElement('i');
        el.className = 'found';
        el.style.cssText = `left:${z[0]}%;top:${z[1]}%;width:${z[2] * 2.1}%`;
        $(m).appendChild(el);
      });
      const sc = $('#score'); if (sc) sc.innerHTML = `찾은 곳 <b>${game.diffs.length - game.left}</b> / ${game.diffs.length}`;
      showList();
      say(`${hit.n}! 잘 찾으셨어요`, dogFor(game.room));
      if (!game.left) setTimeout(winGame, 600);
    } else {
      const el = document.createElement('i');
      el.className = 'missx'; el.style.cssText = `left:${px}%;top:${py}%`;
      host.querySelector('.marks').appendChild(el);
      setTimeout(() => el.remove(), 700);
      loseHeart(pick(['음… 거긴 아니에요!', '앗, 다시 한 번 보세요', '거긴 똑같은데요?']));
    }
  };
  $('#picA').addEventListener('click', (e) => tap(e, $('#picA')));
  $('#picB').addEventListener('click', (e) => tap(e, $('#picB')));
  wireFoot();
}

/* ---------- 숨은 그림 찾기 ---------- */
function renderFind() {
  const def = game.def;
  const spots = [...HIDE_SPOTS[game.room]].sort(() => Math.random() - 0.5).slice(0, def.count);
  const items = [...ITEMS].sort(() => Math.random() - 0.5).slice(0, def.count);
  game.items = items.map((it, i) => ({ ...it, spot: spots[i], got: false }));
  game.left = def.count;
  $('#gameSheet').innerHTML = gameHead(`찾은 것 <b>0</b> / ${def.count}`) + `
    <ul class="seek" id="seek">
      ${game.items.map((it, i) => `<li data-i="${i}"><img src="rooms/items/${it.k}.webp" alt="${esc(it.n)}"><span>${esc(it.n)}</span></li>`).join('')}
    </ul>
    <div class="board"><div class="pic hidepic" id="picH">
      <img src="${SCENES[def.scene].img}" alt="${esc(ROOM_NAMES[game.room])} 그림" draggable="false">
      ${game.items.map((it, i) => {
        const [x, y, sc, rot] = it.spot;
        return `<img class="hidden-item" data-i="${i}" src="rooms/items/${it.k}.webp" alt="숨은 그림"
          style="left:${x}%;top:${y}%;width:${(it.w * sc * 100).toFixed(2)}%;transform:translate(-50%,-50%) rotate(${rot}deg)">`;
      }).join('')}
      <div class="marks" id="markH"></div>
    </div></div>` + gameFoot();
  const pic = $('#picH');
  pic.querySelectorAll('.hidden-item').forEach(el => el.addEventListener('click', (e) => {
    e.stopPropagation();
    const i = +el.dataset.i, it = game.items[i];
    if (it.got) return;
    it.got = true; game.left--;
    el.classList.add('got');
    $('#seek').querySelector(`[data-i="${i}"]`).classList.add('got');
    const [x, y] = it.spot;
    const ring = document.createElement('i');
    ring.className = 'found'; ring.style.cssText = `left:${x}%;top:${y}%;width:${(it.w * it.spot[2] * 150).toFixed(1)}%`;
    $('#markH').appendChild(ring);
    const sc = $('#score'); if (sc) sc.innerHTML = `찾은 것 <b>${game.items.length - game.left}</b> / ${game.items.length}`;
    say(`${it.n} 찾았다!`, dogFor(game.room));
    if (!game.left) setTimeout(winGame, 600);
  }));
  pic.addEventListener('click', (e) => {
    if (e.target.closest('.hidden-item')) return;
    const r = pic.getBoundingClientRect();
    const el = document.createElement('i');
    el.className = 'missx';
    el.style.cssText = `left:${(e.clientX - r.left) / r.width * 100}%;top:${(e.clientY - r.top) / r.height * 100}%`;
    $('#markH').appendChild(el);
    setTimeout(() => el.remove(), 700);
    loseHeart(pick(['거긴 아무것도 없는데요?', '음… 더 자세히 보세요', '앗, 빗나갔어요!']));
  });
  wireFoot();
}

/* ---------- 돋보기: 확대된 조각이 어디인지 찾기 ---------- */
async function renderDetail() {
  loading();
  const def = game.def;
  let img;
  try { img = await loadImg(SCENES[def.scene].img); } catch (e) { return failLoad(); }
  if (!game.spots) {
    const cells = spreadPicks(detailCells(img, 8, 7), 14, 0.2, 0.14);
    cells.sort(() => Math.random() - 0.5);
    game.spots = cells.slice(0, def.rounds);
    game.ri = 0;
  }
  const spot = game.spots[game.ri];
  const ar = img.naturalHeight / img.naturalWidth;
  $('#gameSheet').innerHTML = gameHead(`${game.ri + 1} / ${game.spots.length} 번째 조각`) + `
    <div class="board">
      <div class="hintwrap"><canvas id="hint" width="320" height="320"></canvas><span>이 조각이 어디일까요?</span></div>
      <div class="pic" id="picD"><img src="${SCENES[def.scene].img}" alt="${esc(ROOM_NAMES[game.room])} 그림" draggable="false"><div class="marks" id="markD"></div></div>
    </div>` + gameFoot();
  const hg = $('#hint').getContext('2d');
  const sW = img.naturalWidth * 0.17;
  hg.imageSmoothingQuality = 'high';
  hg.drawImage(img, spot.cx * img.naturalWidth - sW / 2, spot.cy * img.naturalHeight - sW / 2, sW, sW, 0, 0, 320, 320);
  $('#picD').addEventListener('click', (e) => {
    const r = $('#picD').getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
    const near = Math.hypot(spot.cx - px, (spot.cy - py) * ar) < 0.1;
    const el = document.createElement('i');
    el.style.cssText = `left:${px * 100}%;top:${py * 100}%`;
    if (near) {
      el.className = 'found'; el.style.width = '23%';
      el.style.left = spot.cx * 100 + '%'; el.style.top = spot.cy * 100 + '%';
      $('#markD').appendChild(el);
      game.ri++;
      setTimeout(() => { if (game.ri >= game.spots.length) winGame(); else renderDetail(); }, 650);
    } else {
      el.className = 'missx'; $('#markD').appendChild(el);
      setTimeout(() => el.remove(), 700);
      loseHeart(pick(['조금 더 왼쪽? 오른쪽?', '음… 그 근처는 아니에요', '다시 한 번 눈 크게!']));
    }
  }, { once: false });
  wireFoot();
}

/* ---------- 짝 맞추기 ---------- */
function renderMemory() {
  const g = game.def;
  const deck = [...g.pairs, ...g.pairs].sort(() => Math.random() - 0.5);
  game.deck = deck; game.up = []; game.done = 0; game.lock = false; game.moves = 0;
  $('#gameSheet').innerHTML = gameHead(`맞춘 쌍 <b>0</b> / ${g.pairs.length} · 뒤집기 <b id="mv">0</b>번`) + `
    <div class="board"><div class="cards" id="cards">
      ${deck.map((f, i) => `<button class="card" type="button" data-i="${i}" aria-label="카드"><span class="f">${f}</span></button>`).join('')}
    </div></div>` + gameFoot();
  $('#cards').querySelectorAll('.card').forEach(b => b.addEventListener('click', () => {
    if (game.lock || b.classList.contains('up') || b.classList.contains('done')) return;
    b.classList.add('up'); game.up.push(b);
    if (game.up.length < 2) return;
    game.moves++;
    const [a, c] = game.up;
    const score = () => { const s = $('#score'); if (s) s.innerHTML = `맞춘 쌍 <b>${game.done}</b> / ${g.pairs.length} · 뒤집기 <b>${game.moves}</b>번`; };
    if (game.deck[+a.dataset.i] === game.deck[+c.dataset.i]) {
      a.classList.add('done'); c.classList.add('done');
      game.up = []; game.done++; score();
      if (game.done === g.pairs.length) setTimeout(winGame, 420);
    } else {
      game.lock = true; score();
      setTimeout(() => { a.classList.remove('up'); c.classList.remove('up'); game.up = []; game.lock = false; }, 680);
    }
  }));
  wireFoot();
}

/* ---------- 집주인 퀴즈 ---------- */
function renderQuiz() {
  game.qi = game.qi || 0;
  const g = game.def, q = g.qs[game.qi];
  $('#gameSheet').innerHTML = gameHead(`${game.qi + 1}번 문제 / 전체 ${g.qs.length}문제`) + `
    <div class="board">
      <p class="quiz-q">${esc(q.q)}</p>
      <div class="opts" id="opts">

/* ---------- 미로 찾기 ---------- */
function genMaze(cols, rows) {
  const c = Array.from({ length: rows }, () => Array.from({ length: cols }, () => ({ n: 1, e: 1, s: 1, w: 1, v: 0 })));
  const stack = [[0, 0]]; c[0][0].v = 1;
  const D = [[0, -1, 'n', 's'], [1, 0, 'e', 'w'], [0, 1, 's', 'n'], [-1, 0, 'w', 'e']];
  while (stack.length) {
    const [x, y] = stack[stack.length - 1];
    const open = D.filter(([dx, dy]) => {
      const nx = x + dx, ny = y + dy;
      return nx >= 0 && ny >= 0 && nx < cols && ny < rows && !c[ny][nx].v;
    });
    if (!open.length) { stack.pop(); continue; }
    const [dx, dy, a, b] = open[Math.floor(Math.random() * open.length)];
    c[y][x][a] = 0; c[y + dy][x + dx][b] = 0; c[y + dy][x + dx].v = 1;
    stack.push([x + dx, y + dy]);
  }
  return c;
}
function renderMaze() {
  const def = game.def, cols = def.cols, rows = def.rows;
  const maze = genMaze(cols, rows);
  game.path = [[0, 0]]; game.t0 = null; game.tick = null;
  $('#gameSheet').innerHTML = gameHead('', `<span class="timer" id="tmr">0.0초</span>`) + `
    <div class="board"><canvas id="maze" class="mazec"></canvas></div>
    <div class="actions"><button class="btn btn-ghost" id="again">처음부터</button><button class="btn btn-ghost" data-close>나중에 할게요</button></div>`;
  const cv = $('#maze');
  const draw = () => {
    const W = cv.clientWidth || 320;
    const cell = W / cols, H = Math.round(cell * rows);
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    cv.style.height = H + 'px';
    const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, W, H);
    g.fillStyle = '#fcfaf4'; g.fillRect(0, 0, W, H);
    /* 지나온 길 */
    g.strokeStyle = 'rgba(217,165,80,.55)'; g.lineWidth = cell * 0.5; g.lineJoin = 'round'; g.lineCap = 'round';
    g.beginPath();
    game.path.forEach(([x, y], i) => { const px = (x + .5) * cell, py = (y + .5) * cell; i ? g.lineTo(px, py) : g.moveTo(px, py); });
    g.stroke();
    /* 벽 — 손으로 그은 듯 살짝 흔들리게 */
    g.strokeStyle = '#3b3630'; g.lineWidth = 2.6; g.lineCap = 'round';
    const j = () => (Math.random() - .5) * 1.4;
    const line = (x1, y1, x2, y2) => { g.beginPath(); g.moveTo(x1 + j(), y1 + j()); g.lineTo(x2 + j(), y2 + j()); g.stroke(); };
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
      const c = maze[y][x], L = x * cell, T = y * cell, R = L + cell, B = T + cell;
      if (c.n) line(L, T, R, T);
      if (c.w) line(L, T, L, B);
      if (x === cols - 1 && c.e) line(R, T, R, B);
      if (y === rows - 1 && c.s) line(L, B, R, B);
    }
    /* 출발 · 도착 */
    g.font = `${Math.round(cell * .62)}px serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText('🐾', cell * .5, cell * .5);
    g.fillText('🦴', (cols - .5) * cell, (rows - .5) * cell);
    /* 현재 위치 */
    const [cx, cy] = game.path[game.path.length - 1];
    g.fillStyle = '#c0544a'; g.beginPath(); g.arc((cx + .5) * cell, (cy + .5) * cell, cell * .17, 0, 7); g.fill();
    game.cell = cell;
  };
  requestAnimationFrame(() => { draw(); });
  const startTimer = () => {
    if (game.t0) return;
    game.t0 = Date.now();
    game.tick = setInterval(() => {
      const t = $('#tmr'); if (!t) return clearInterval(game.tick);
      t.textContent = ((Date.now() - game.t0) / 1000).toFixed(1) + '초';
    }, 100);
  };
  let dragging = false;
  const at = (e) => {
    const r = cv.getBoundingClientRect();
    return [Math.floor((e.clientX - r.left) / (r.width / cols)), Math.floor((e.clientY - r.top) / (r.height / rows))];
  };
  const step = (e) => {
    if (!dragging) return;
    const [x, y] = at(e);
    if (x < 0 || y < 0 || x >= cols || y >= rows) return;
    const [px, py] = game.path[game.path.length - 1];
    if (x === px && y === py) return;
    if (game.path.length > 1) {
      const [bx, by] = game.path[game.path.length - 2];
      if (x === bx && y === by) { game.path.pop(); draw(); return; }
    }
    const dx = x - px, dy = y - py;
    if (Math.abs(dx) + Math.abs(dy) !== 1) return;
    const c = maze[py][px];
    if ((dx === 1 && c.e) || (dx === -1 && c.w) || (dy === 1 && c.s) || (dy === -1 && c.n)) return;
    game.path.push([x, y]); draw();
    if (x === cols - 1 && y === rows - 1) {
      dragging = false; clearInterval(game.tick);
      game.secs = (Date.now() - game.t0) / 1000;
      setTimeout(winGame, 420);
    }
  };
  cv.addEventListener('pointerdown', (e) => {
    const [x, y] = at(e); const [px, py] = game.path[game.path.length - 1];
    if (Math.abs(x - px) + Math.abs(y - py) > 1) return;
    dragging = true; startTimer(); try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    step(e);
  });
  cv.addEventListener('pointermove', step);
  cv.addEventListener('pointerup', () => { dragging = false; });
  cv.addEventListener('pointercancel', () => { dragging = false; });
  $('#again').onclick = () => { clearInterval(game.tick); renderMaze(); };
  wireFoot();
}

/* ---------- 야바위 ---------- */
const BOWL = `<svg viewBox="0 0 80 64" aria-hidden="true"><path d="M6 18h68c0 24-13 40-34 40S6 42 6 18z" fill="#f6efe0" stroke="#3b3630" stroke-width="2.6" stroke-linejoin="round"/><ellipse cx="40" cy="18" rx="34" ry="8" fill="#fffdf7" stroke="#3b3630" stroke-width="2.6"/><path d="M18 30c2 12 9 20 16 23" fill="none" stroke="#b6ab97" stroke-width="2" stroke-linecap="round"/></svg>`;
function renderShell() {
  const def = game.def;
  game.round = game.round || 0;
  game.prize = Math.floor(Math.random() * 3);
  game.slot = [0, 1, 2];
  $('#gameSheet').innerHTML = gameHead(`${game.round + 1} / ${def.rounds} 판`) + `
    <div class="board"><div class="shellbox" id="shell">
      ${[0, 1, 2].map(i => `<button class="cup" type="button" data-i="${i}" style="--p:${i}" aria-label="그릇 ${i + 1}">${BOWL}<span class="bone">🦴</span></button>`).join('')}
    </div><p class="shelltip" id="stip">간식이 어디 있는지 잘 보세요…</p></div>` + gameFoot();
  const my = game;
  const alive = () => game === my && document.body.contains($('#shell'));
  const cups = [...$('#shell').querySelectorAll('.cup')];
  const place = () => cups.forEach((c, i) => c.style.setProperty('--p', my.slot[i]));
  cups[my.prize].classList.add('has');
  cups[my.prize].classList.add('up');
  let lock = true;
  const shuffles = 5 + game.round * 3;
  const speed = Math.max(170, 400 - game.round * 90);
  setTimeout(() => {
    if (!alive()) return;
    cups[my.prize].classList.remove('up');
    $('#stip').textContent = '섞는 중…';
    let k = 0;
    const once = () => {
      if (!alive()) return;
      if (k++ >= shuffles) {
        lock = false;
        $('#stip').textContent = '간식이 든 그릇을 골라주세요!';
        return;
      }
      let a = Math.floor(Math.random() * 3), b = Math.floor(Math.random() * 3);
      while (b === a) b = Math.floor(Math.random() * 3);
      const ia = my.slot.indexOf(a), ib = my.slot.indexOf(b);
      [my.slot[ia], my.slot[ib]] = [my.slot[ib], my.slot[ia]];
      cups.forEach(c => c.style.transitionDuration = speed + 'ms');
      place();
      setTimeout(once, speed + 40);
    };
    setTimeout(once, 420);
  }, 1200);
  cups.forEach(c => c.onclick = () => {
    if (lock || !alive()) return;
    lock = true;
    c.classList.add('up');
    if (c.classList.contains('has')) {
      say(pick(['정답! 눈 안 깜빡이셨죠?', '우와, 끝까지 따라오셨네요!']), dogFor(my.room));
      my.round++;
      setTimeout(() => { if (!alive()) return; if (my.round >= def.rounds) winGame(); else renderShell(); }, 900);
    } else {
      cups[my.prize].classList.add('up');
      if (!loseHeart(pick(['아깝다! 저기였어요', '으악, 한 끗 차이!']))) {
        setTimeout(() => { if (alive()) renderShell(); }, 1100);
      }
    }
  });
  wireFoot();
}

/* ---------- 통과! ---------- */
function gradeOf() {
  const t = game.def.type;
  if (t === 'puzzle') return game.moves <= 12 ? 3 : game.moves <= 20 ? 2 : 1;
  if (t === 'memory') return game.moves <= game.def.pairs.length * 1.9 ? 3 : game.moves <= game.def.pairs.length * 3 ? 2 : 1;
  if (t === 'maze') { const par = game.def.cols * game.def.rows * 0.42; return game.secs <= par ? 3 : game.secs <= par * 1.9 ? 2 : 1; }
  return Math.max(1, game.hearts);
}
const starStr = (n) => '★'.repeat(n) + '☆'.repeat(3 - n);
function winGame() {
  clearInterval(game.tick);
  const room = game.room;
  const wasKeys = keyCount(), wasUnlocked = unlocked();
  const grade = gradeOf();
  const best = state.stars[room] || 0;
  const record = grade > best;
  state.cleared.add(room); ls('hw2_cleared', [...state.cleared]);
  if (record) { state.stars[room] = grade; ls('hw2_stars', state.stars); }
  const keys = keyCount(), gotKey = keys > wasKeys;
  const justUnlocked = unlocked() && !wasUnlocked;
  burst(justUnlocked ? 140 : grade === 3 ? 100 : 70);

  const ring = (n, isNew) => `<div class="keyring">${Array.from({ length: KEYS_NEEDED }, (_, i) =>
    `<i class="keyslot${i < n ? ' on' : ''}${isNew && i === n - 1 ? ' new' : ''}">${i < n ? '🔑' : '🔒'}</i>`).join('')}</div>`;

  let body;
  if (justUnlocked) {
    body = `<div class="won">
      <div class="unlockbig">🔓</div>
      <div class="stars">${starStr(grade)}</div>
      <h2>열쇠 세 개 완성!</h2>
      ${ring(KEYS_NEEDED, true)}
      <p>집 안에 숨겨둔 <b>위시리스트 ${GIFTS.length}개</b>가 모두 열렸어요</p>
    </div>
    <ul class="nb-list">${wishRows()}</ul>`;
  } else if (unlocked()) {
    body = `<div class="won">
      <div class="big">${grade === 3 ? '🏆' : '🎉'}</div>
      <div class="stars">${starStr(grade)}</div>
      <h2>${grade === 3 ? '퍼펙트!' : '통과!'}</h2>
      <p>${record ? '최고 기록을 새로 세웠어요!' : `${esc(ROOM_NAMES[room])} 최고 기록은 ${starStr(best)} 예요`}</p>
    </div>`;
  } else {
    body = `<div class="won">
      <div class="big">${grade === 3 ? '🏆' : '🎉'}</div>
      <div class="stars">${starStr(grade)}</div>
      <h2>${grade === 3 ? '퍼펙트!' : '통과!'}</h2>
      ${ring(keys, gotKey)}
      <p class="keymsg">${gotKey
        ? `열쇠 ${keys}개 모았어요! ${KEYS_NEEDED - keys}개만 더 모으면 위시리스트가 열려요`
        : `이 방 열쇠는 이미 받았어요. 다른 방에서 ${KEYS_NEEDED - keys}개만 더!`}</p>
    </div>`;
  }

  $('#gameSheet').innerHTML = `<div class="grip"></div>${body}
    <div class="actions">
      <button class="btn btn-primary" data-close>${justUnlocked ? '위시리스트 보러 가기' : '계속 구경하기'}</button>
      ${grade < 3 ? `<button class="btn btn-ghost" id="retry">★★★ 노리고 다시 하기</button>` : ''}
    </div>`;
  $('#gameSheet').querySelectorAll('[data-gift]').forEach(b => b.onclick = () => {
    closeSheets(); setTimeout(() => openGift(b.dataset.gift), 240);
  });
  const rt = $('#retry'); if (rt) rt.onclick = () => openGame(room);
  wireFoot();
  say(justUnlocked ? '열쇠 세 개 완성! 위시리스트가 전부 열렸어요 멍멍!'
    : gotKey ? `열쇠 ${keys}개째! ${KEYS_NEEDED - keys}개만 더 모아요`
    : grade === 3 ? pick(['퍼펙트! 한 번도 안 틀리셨어요!', '우와, 하트를 하나도 안 쓰다니!'])
    : pick(['통과! 잘하시는데요?', '역시 눈썰미가 다르시네요']), dogFor(room));
  showScene(state.scene, 'fwd');
  updateCta(); refresh();
}

let openGiftId = null, confirming = false, busy = false, lastErr = '';
function openGift(gid) { openGiftId = gid; confirming = false; lastErr = ''; renderGift(); showSheet('#giftSheet'); }
const shopOf = (u) => (/coupang/i.test(u) ? '쿠팡' : '오늘의집');
function renderGift() {
  if (!openGiftId) return;
  const g = GIFTS.find(x => x.id === openGiftId);
  const c = state.claims[g.id];
  let action;
  if (c && isMine(c)) {
    action = `<div class="status mine"><span class="dot"></span><span><b>${esc(c.name)}</b>님이 준비하기로 했어요. 고마워요!</span></div>
      <button class="btn btn-ghost" id="unclaimBtn" ${busy ? 'disabled' : ''}>찜 취소하기</button>`;
  } else if (c) {
    action = `<div class="status"><span class="dot"></span><span><b>${esc(c.name)}</b>님이 이미 준비 중이에요</span></div>
      <button class="btn btn-ghost" data-close>다른 선물 보러 가기</button>`;
  } else if (confirming) {
    action = `<p class="confirm-q"><b>${esc(state.guest)}</b> 이름으로 이 선물을 찜할까요? 모두에게 이름이 보여요.</p>
      <button class="btn btn-primary" id="claimYes" ${busy ? 'disabled' : ''}>네, 제가 선물할게요</button>
      <button class="btn btn-ghost" id="claimNo">다시 생각해볼게요</button>`;
  } else {
    action = `<button class="btn btn-primary" id="claimBtn">이 선물 찜하기</button>
      <button class="btn btn-ghost" data-close>계속 구경하기</button>`;
  }
  $('#giftSheet').innerHTML = `
    <div class="grip"></div>
    <div class="eyebrow">${esc(WISH_TIERS[g.tier || 'must'].label)} · ${esc(ROOM_NAMES[giftRoom(g)])}</div>
    <div class="gift-hero">
      <div class="gift-emoji" aria-hidden="true">${g.emoji}</div>
      <div><h2 id="giftName">${esc(g.name)}</h2><div class="price">${esc(g.price)}</div>${g.opt ? `<div class="opt">${esc(g.opt)}</div>` : ''}</div>
    </div>
    <div class="note">“${esc(g.note)}”<small>집주인 한마디</small></div>
    ${g.url ? `<a class="link" href="${esc(g.url)}" target="_blank" rel="noopener">${shopOf(g.url)}에서 제품 보기 ↗</a>` : ''}
    <div class="actions">${action}${lastErr ? `<div class="err">${esc(lastErr)}</div>` : ''}</div>`;
  const on = (id, fn) => { const b = document.getElementById(id); if (b) b.onclick = fn; };
  on('claimBtn', () => { confirming = true; renderGift(); });
  on('claimNo', () => { confirming = false; renderGift(); });
  on('claimYes', async () => {
    busy = true; lastErr = ''; renderGift();
    try {
      await Store.claim(g.id, state.guest); confirming = false;
      say(`${state.guest}님 고마워요! 꼬리 흔드는 중`, dogFor(giftRoom(g)));

/* ================================================================
   배경음악 — 파일 없이 Web Audio 로 직접 연주합니다
      lobby : 호텔 라운지풍 느린 재즈 (기본)

    const d = buf.getChannelData(c);

}
/* 라운지: 보사노바 — F 키, 8마디 한 바퀴 (b 베이스 / v 기타 보이싱) */
const LOBBY_CH = [
  { b: 41, v: [57, 60, 64, 65] },  /* Fmaj7 */
  { b: 43, v: [59, 62, 65, 67] },  /* G7    */
  { b: 43, v: [58, 62, 65, 67] },  /* Gm7   */
  { b: 48, v: [58, 60, 64, 67] },  /* C7    */
  { b: 41, v: [57, 60, 64, 65] },  /* Fmaj7 */
  { b: 45, v: [57, 60, 64, 67] },  /* Am7   */
  { b: 43, v: [58, 62, 65, 67] },  /* Gm7   */
  { b: 48, v: [58, 60, 64, 67] },  /* C7    */

  { b: 41, v: [57, 60, 65] },      /* F  */
  { b: 43, v: [55, 59, 62] },      /* G  */
  { b: 45, v: [57, 60, 64] },      /* Am */

  { b: 50, v: [57, 62, 65] },      /* Dm */
  { b: 40, v: [56, 59, 64] },      /* E7 */
  { b: 45, v: [57, 60, 64] },      /* Am */

  72, null, 72, 74, 76, null, 74, 72,
  76, 76, 77, 76, 74, null, 72, null,
  77, null, 77, 76, 74, null, 76, 77,
  79, null, 77, 74, 72, null, 71, 74,

const Music = {
  on: ls('hw2_music') !== 0,
  ctx: null, kind: null, timer: 0, step: 0, next: 0,
  ensure() {

  fade(v, sec) {

  },
  stop() { clearInterval(this.timer); this.timer = 0; if (this.ctx) this.fade(0, .4); },
  toggle() {

  tick() {

  gameStep(i, t) {

    const bar = Math.floor(i / 16) % 4, ch = list[bar], b = i % 16;

    /* 쉴 틈 없는 8분 베이스 */

  danceStep(i, t) {
